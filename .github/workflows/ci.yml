name: Continuous Integration

on:
  # Triggers the workflow for pushes to maindev, for pull request events, and for the merge queue.
  # Pull requests only build Linux; every platform builds on push, schedule and manual runs.
  push:
    branches: [maindev]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  merge_group:
    types: [checks_requested]

  workflow_dispatch:
  
  schedule:
    - cron: '1 0 * * 0'

# Cancel in-progress runs if newer changes to the same branch/PR are pushed.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  meson:
    uses: ./.github/workflows/meson.yml
    with:
      linux_only: ${{ github.event_name == 'pull_request' }}

  msbuild:
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/msbuild.yml
