name: Cortex Studio

on:
  # Builds the Cortex Studio app (Tools/CortexStudio, with Mod Studio's page inside) for every platform when either changes,
  # and uploads the installers as build artefacts.
  push:
    branches: [maindev]
    paths: ["Tools/CortexStudio/**", "Tools/ModStudio/**", ".github/workflows/cortex-studio.yml"]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths: ["Tools/CortexStudio/**", "Tools/ModStudio/**", ".github/workflows/cortex-studio.yml"]
  workflow_dispatch:

concurrency:
  group: cortex-studio-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Both release editions (Tools/CortexStudio/src-tauri/src/edition.rs): Cortex Studio for Commander, and Cortex Studio CE for
    # Community Edition modders, with its own name and app id from tauri.community.conf.json.
    name: ${{ matrix.edition.app }} (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
        edition:
          - id: commander
            app: Cortex Studio
            artefact: CortexStudio
            config: ""
          - id: community
            app: Cortex Studio CE
            artefact: CortexStudioCE
            config: --config src-tauri/tauri.community.conf.json
    runs-on: ${{ matrix.platform.os }}
    env:
      CORTEX_STUDIO_EDITION: ${{ matrix.edition.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Tools/CortexStudio/src-tauri
          key: ${{ matrix.edition.id }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the app and its installers
        working-directory: Tools/CortexStudio
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.edition.config }}

      - name: Smoke test the run path (macOS and Linux)
        if: runner.os != 'Windows'
        working-directory: Tools/CortexStudio
        # Starts the app with no window on a tiny game folder, the way dev.sh does, and asks it for /api/info and the page.
        # The CE edition's program is cortex-studio-ce (mainBinaryName in tauri.community.conf.json).
        run: sh smoke.sh src-tauri/target/release/${{ matrix.edition.id == 'community' && 'cortex-studio-ce' || 'cortex-studio' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition.artefact }}-${{ matrix.platform.name }}
          path: |
            Tools/CortexStudio/src-tauri/target/release/bundle/msi/*.msi
            Tools/CortexStudio/src-tauri/target/release/bundle/nsis/*.exe
            Tools/CortexStudio/src-tauri/target/release/bundle/dmg/*.dmg
            Tools/CortexStudio/src-tauri/target/release/bundle/deb/*.deb
            Tools/CortexStudio/src-tauri/target/release/bundle/rpm/*.rpm
            Tools/CortexStudio/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
