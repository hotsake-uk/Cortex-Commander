DataModule
	ModuleName = Render Test
	SupportedGameVersion = 7.0.0
	Description = Dev-only module for exercising the renderer (primitives, effects). Not shipped.
	AddGlobalScript = GlobalScript
		PresetName = Render Test Primitives
		Description = Draws every primitive type near the top-left of player 1's screen.
		ScriptPath = RenderTest.rte/PrimitiveGallery.lua
		LuaClassName = PrimitiveGalleryScript
	AddGlobalScript = GlobalScript
		PresetName = Render Test FX
		Description = Periodically detonates explosives in front of player 1's camera, for testing effects rendering.
		ScriptPath = RenderTest.rte/FXTest.lua
		LuaClassName = FXTestScript
	AddGlobalScript = GlobalScript
		PresetName = Render Test Camera Tour
		Description = Moves player 1's camera through fixed points of interest, 3 seconds each, for repeatable screenshots.
		ScriptPath = RenderTest.rte/CameraTour.lua
		LuaClassName = CameraTourScript
	AddGlobalScript = GlobalScript
		PresetName = Render Test Lights
		Description = Gives every actor a lamp via the MovableObject light properties and adds a pulsing Lua light near the camera.
		ScriptPath = RenderTest.rte/LightsTest.lua
		LuaClassName = LightsTestScript
	AddGlobalScript = GlobalScript
		PresetName = Render Test Perf
		Description = Shows the performance stats overlay.
		ScriptPath = RenderTest.rte/Perf.lua
		LuaClassName = PerfScript
	AddGlobalScript = GlobalScript
		PresetName = Render Test Atmosphere
		Description = Sets a snowy dawn through the PostProcessMan Lua API.
		ScriptPath = RenderTest.rte/Atmosphere.lua
		LuaClassName = AtmosphereScript
	AddGlobalScript = GlobalScript
		PresetName = Render Test Fog
		Description = Turns on fog of war for team 1 so the unseen layer can be checked.
		ScriptPath = RenderTest.rte/Fog.lua
		LuaClassName = FogScript
	AddActivity = GAScripted
		CopyOf = Test Activity
		PresetName = Render Test Split Screen
		Player1IsHuman = 1
		Player2IsHuman = 1
		TeamOfPlayer1 = 0
		TeamOfPlayer2 = 0
