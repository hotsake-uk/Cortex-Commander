[package]
name = "cortex-studio"
version = "0.1.0"
description = "Cortex Studio: Mod Studio as a desktop app"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tiny_http = "0.12"
notify = "6"
include_dir = "0.7"
rfd = "0.15"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mod history (src/history.rs): libgit2 built into the app, so nobody needs git installed for it. No https or ssh, so no OpenSSL.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
