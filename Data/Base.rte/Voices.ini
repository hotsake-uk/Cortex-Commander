// Unit speech voices: what units sound like when they say their lines (Speech.ini). The settings: Game & HUD, Unit speech, "Speech sounds".
//
// No recordings: each line's sound is made in the game from its own words, so every line has one, a mod's and a name filled in alike.
// A voice either babbles (a mumbled syllable for each one in the line, Undertale and Animal Crossing style, with the line's rhythm and its
// rise and fall) or, with "Words = 1", speaks the actual words in a synthesised voice (for robots; the settings can turn that off).
// Then it goes through a radio: band-limited, overdriven, with static, and a squelch as the line starts and ends. Each unit's pitch,
// throat and pace differ a little from the next one's, by its ID, so a squad doesn't sound like one man.
//
// "Voice = Name" starts a voice (or changes one defined before, in this file or a module loaded earlier). Under it:
//   Words = 1 to speak the actual words (the synthesised voice); 0 to babble. Default 0.
//   Pitch = Its pitch in Hz: 85 a deep voice, 120 a man's, 200 a woman's or a small machine's. Default 120.
//   PitchSpread = How far one unit's pitch is from the next one's, as a share of Pitch. Default 0.18.
//   Square = 0 to 1, babble only: 0 a soft, voice-like tone; 1 a square-wave beep (Undertale's text). Default 0.3.
//   Formant = Its vowels, times, babble only: under 1 a bigger throat, over 1 a smaller one. Default 1.
//   Speed = How fast it talks, times. Default 1.
//   Bounce = How far its pitch steps from syllable to syllable, times, babble only. Default 1.
//   Radio = How much radio, times the settings' "Radio effect" (0: never over a radio). Default 1.
//   Crush = 0 to 1: bit-crushed and decimated, for machines. Default 0.
//   Ring = A ring modulator's frequency in Hz, for a machine's metallic edge; 0 for none. Default 0.
//   Growl = 0 to 1: rough and rasping, its pitch unsteady. Default 0.
//   Breath = 0 to 1: breathy, whispered. Default 0.
//   Volume = Times. Default 1.
//   Wave = The synthesised voice's source, Words only: Saw, Square, Triangle, Sine, Pulse, Noise or Warble. Default Saw.
//
// "Tone = Name" (a tone of Speech.ini's lines) changes the voice for lines of that tone. Under it:
//   Radio = Times. Bounce = Times. Speed = Times. RogerBeep = 1 to end on a radio beep. Defaults 1, 1, 1, 0.
//
// Who speaks with which voice, "What: Voice"; a unit takes the most particular that fits it, in this order:
//   VoiceForActor = A preset's name (PresetName).
//   VoiceForSet = A speech set (an actor's SpeechSet, as Speech.ini's "Set").
//   VoiceForGroup = A group it is in ("Actors - Mecha").
//   VoiceForClass = Its class (ACrab, AHuman).
//   VoiceForModule = The module that defines it (Dummy.rte).
//   DefaultVoice = The voice of anyone else.
//
// Mods: a Voices.ini in any module is read after this one, in load order. It can add voices, change these ("Voice = Soldier" then only
// what it changes) and give its own units a voice ("VoiceForModule = MyFaction.rte: MyVoice").

DefaultVoice = Soldier

Voice = Soldier
	Pitch = 118
	PitchSpread = 0.2
	Square = 0.3

Voice = Gruff
	// Browncoats: older, rougher, lower.
	Pitch = 98
	PitchSpread = 0.15
	Square = 0.2
	Formant = 0.93
	Growl = 0.2
	Speed = 0.92

Voice = Ronin
	// Mercenaries on cheap handsets: a little more radio.
	Pitch = 122
	PitchSpread = 0.22
	Square = 0.35
	Radio = 1.15
	Bounce = 1.15

Voice = Techion
	// Clean digital comms: brighter, a touch of crush.
	Pitch = 130
	PitchSpread = 0.15
	Square = 0.4
	Formant = 1.05
	Crush = 0.12
	Speed = 1.05

Voice = Robot
	// Dummy and Imperatus: they say the words, flat and metallic.
	Words = 1
	Pitch = 105
	PitchSpread = 0.12
	Wave = Square
	Crush = 0.35
	Ring = 55
	Radio = 0.9
	Speed = 1.05

Voice = Drone
	// The small walking drones: high and chirpy.
	Words = 1
	Pitch = 190
	PitchSpread = 0.1
	Wave = Pulse
	Crush = 0.5
	Ring = 90
	Speed = 1.2

Voice = Walker
	// Crabs and dreadnoughts: deep and heavy.
	Words = 1
	Pitch = 72
	PitchSpread = 0.1
	Wave = Saw
	Crush = 0.3
	Ring = 35
	Speed = 0.9

Voice = Medieval
	// Knights and archers have no radios: plain shouted babble.
	Pitch = 115
	PitchSpread = 0.22
	Square = 0.15
	Radio = 0
	Bounce = 1.1

Voice = Undead
	// Skeletons: low, rasping, whispered, and a ghostly bit of radio.
	Pitch = 82
	PitchSpread = 0.15
	Square = 0.1
	Formant = 0.9
	Growl = 0.7
	Breath = 0.4
	Speed = 0.85
	Radio = 0.4

Tone = Serious
	// By-the-book radio talk: tight, flat, quick, over a hard radio, with a roger beep.
	Radio = 1.25
	Bounce = 0.6
	Speed = 1.08
	RogerBeep = 1

Tone = Casual
	Radio = 0.9

Tone = Funny
	// Quips: bouncier, a lighter radio.
	Radio = 0.7
	Bounce = 1.5

Tone = Imperial
	Radio = 1.15
	Bounce = 0.7
	RogerBeep = 1

VoiceForModule = Browncoats.rte: Gruff
VoiceForModule = Ronin.rte: Ronin
VoiceForModule = Techion.rte: Techion
VoiceForModule = Dummy.rte: Robot
VoiceForModule = Imperatus.rte: Robot
VoiceForModule = Uzira.rte: Undead
VoiceForClass = ACrab: Walker
VoiceForActor = Medic Drone: Drone
VoiceForActor = Anti-Air Drone: Drone
VoiceForActor = Gatling Drone: Drone
VoiceForActor = Blast Runner: Drone
VoiceForSet = Medieval: Medieval
VoiceForSet = Undead: Undead
