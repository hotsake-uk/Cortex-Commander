// Unit speech: what units say over their heads when their AI does something (the settings, Game & HUD: Unit speech).
//
// Each "Trigger = Key" is one thing a unit can say something about. The AI scripts fire them (Owner:Say("Key"), see AI/UnitSpeech.lua),
// as does the engine for "Stuck" and "ManDown" and for what a unit notices around it (Source/Managers/UnitSpeechWorld.cpp: wading into
// acid, catching fire, gas, the weather, falling rock, a lost arm, a cart, a flag); any script can fire one, or a trigger of its own. Under a trigger:
//   Name = What the settings call it, where it can be turned off.
//   Description = The settings' tooltip.
//   Group = The heading the settings list it under ("Combat", "Weather"), where a whole group can be turned on or off. Default "Other".
//   Chance = Times the chance in the settings (0.5: half as often; 1 is the usual). Default 1.
//   Cooldown = How long, in ms, before the same unit says this again. Default 6000.
//   TeamCooldown = How long, in ms, before anyone on the same side says this again, so a squad doesn't shout it in chorus. Default 1500.
//   Urgent = 1 to cut in over a line still showing. Default 0.
//   Order = 1 for an answer to a player's order: the command that gives the order has the unit answer it, and for a moment after, the
//          AI's own guess at an order (AI/UnitSpeech.lua, which only sees that some order came) isn't said too. Default 0.
//   Line = One thing it might say. As many as wanted; one is picked at random, never the same one twice running. (A "//" in a Line
//          is part of its words, not a comment.)
//          In a Line, "{self}" is the speaker's name and "{name}" the name of whoever the line is about (a friend who fell, who's on fire):
//          a line with "{name}" is only said where there is someone to name. Names come from the UnitName list at the end of this file.
//          A side works through a trigger's lines in a shuffled order, each said once before any is said again.
//   Tone = The tone of the Lines after it, up to the next Tone or Trigger: "Serious" (by-the-book military radio talk), "Casual" (plain
//          soldier talk) or "Funny" (jokes and zingers), or a comma list ("Serious, Casual") for lines that fit more than one. A mod can
//          add a tone of its own just by naming it. "Tone = Any", or a Line before any Tone, fits every tone.
//          In the settings (Game & HUD: Unit speech) each side picks the tones it speaks, one or more, or any: a side set to Serious
//          only says Serious lines (and untagged ones). The settings file keeps it as UnitSpeechTones1..4 = Serious, Funny (empty: any).
//          The settings also have a slider per tone for the mix (Funny 90, Serious 10: nine funny lines to one serious); a side that
//          speaks only some tones shares the mix between those. The settings file keeps it as UnitSpeechToneMix = Serious:10, Funny:90.
//          A side whose tones have no line for a trigger says one of any tone instead.
//
// Tones, outside any Trigger:
//   ToneDescription = Tone: What it's like, for the settings' tooltips.
//   ToneWeight = Tone: 0 to 100, its share of the mix until a player moves its slider. Default 100. 0 keeps a tone out of a side that
//          speaks any tone: only a side that ticks it says it. (Base.rte/Speech/Imperial.ini does this.)
//
// Mods: a Speech.ini in any module is read after this one, in load order, then any .ini files in the module's Speech folder, by name
// (Base.rte/Speech/Imperial.ini is an example: a whole new tone, its lines added to the triggers here). "Trigger = Key" with a key already defined adds lines to it
// (or "ClearLines = 1" first, to replace them) and can change its settings; a new key adds a trigger, which appears in the settings.
// "Set = Name" starts a set of lines of its own, for a faction or a unit type: an actor with "SpeechSet = Name" in its INI (or
// actor.SpeechSet = "Name" from Lua) says that set's lines, and the lines here for any trigger its set has none for. Lines above the
// first "Set" are the default set's.

ToneDescription = Serious: by-the-book military radio talk ("Contact front!", "Copy, moving.").
ToneDescription = Casual: plain soldier talk ("There's one!", "Got 'em!").
ToneDescription = Funny: quips, sarcasm and gallows humour.

