// The game's own extra weather, after the built-in four in the weather menu (Weather.h). Purely visual. Turned off with "More weather types" in the settings.
// Every key is listed in Documentation/LightingAndEffects.md, "Weather". Colours are linear, 0 to 1. Mods add theirs the same way.

AddShader = Shader
	PresetName = Acid Rain Drops
	VertexShader = Base.rte/Shaders/Lighting/Precipitation.vert
	FragmentShader = Base.rte/Weather/Shaders/AcidRain.frag

AddShader = Shader
	PresetName = Void Rain Drops
	VertexShader = Base.rte/Shaders/Lighting/Precipitation.vert
	FragmentShader = Base.rte/Weather/Shaders/VoidRain.frag

// Glowing green rain that wobbles and fizzes as it falls, hisses up in green splashes and turns the light sickly.
AddWeather = Weather
	PresetName = Acid Rain
	DropsPerScreen = 2000
	DropShape = Streak
	DropColor = 0.35 1.0 0.25
	DropColor2 = 0.6 1.0 0.2
	DropGlow = 1.3
	AlphaMin = 0.35
	AlphaMax = 0.6
	LengthMin = 8
	LengthMax = 15
	Width = 1.5
	FallSpeedMin = 380
	FallSpeedMax = 520
	WindFactor = 1
	Sway = 3
	SwayRateMin = 3
	SwayRateMax = 6
	Jitter = 2
	JitterRate = 3
	PulseRate = 1.2
	PulseDepth = 0.5
	DropShader = Acid Rain Drops
	Splashes = 1.2
	SplashColor = 0.4 1.0 0.3
	SplashGlow = 1.2
	Rain = 0.6
	Mist = 0.5
	Overcast = 0.85
	CloudCover = 1
	Lightning = 0.6
	HazeColor = 0.35 0.5 0.2
	HazeColorAmount = 0.5
	Haze = 0.2
	SceneTint = 0.82 1.0 0.75

