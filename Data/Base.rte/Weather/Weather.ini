// The built-in weather, slots 1 to 4 of the weather menu (Weather.h). Purely how it looks; what rain, snow and dust do to the game goes by the slot.
// A mod changes one by defining a Weather of the same PresetName, and adds its own with any other name (they follow these in the menu).
// Every key is listed in Documentation/LightingAndEffects.md, "Weather". Colours are linear, 0 to 1.

AddWeather = Weather
	PresetName = Rain
	DropsPerScreen = 2500
	DropShape = Streak
	DropColor = 0.7 0.78 0.9
	AlphaMin = 0.25
	AlphaMax = 0.5
	LengthMin = 7
	LengthMax = 13
	Width = 1
	FallSpeedMin = 520
	FallSpeedMax = 760
	WindFactor = 1
	Splashes = 1
	SplashColor = 0.85 0.92 1.0
	Rain = 1
	Mist = 0.35
	Overcast = 1
	CloudCover = 1
	Lightning = 1

