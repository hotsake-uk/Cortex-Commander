///////////////////////////////////////////////////////////////////////
// Background Sets
// Whole stacks of backgrounds (nearest first, as a Scene lists them) that the Settings panel (F6, Sky & daylight) can put behind any map in place of its own.
// A mod adds its own the same way: AddBackgroundSet = BackgroundSet, a PresetName, and one AddBackgroundLayer per layer.


AddBackgroundSet = BackgroundSet
	PresetName = Grasslands
	AddBackgroundLayer = SLBackground
		CopyOf = Base.rte/Default Front
	AddBackgroundLayer = SLBackground
		CopyOf = Base.rte/Default Middle
	AddBackgroundLayer = SLBackground
		CopyOf = Base.rte/Clouds Layer A
	AddBackgroundLayer = SLBackground
		CopyOf = Base.rte/Default Sky Layer


