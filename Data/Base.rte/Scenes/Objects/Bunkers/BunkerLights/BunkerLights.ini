///////////////////////////////////////////////////////////////////////
// Bunker Lights: small fixtures that can be put anywhere. Made by Tools/MakeBunkerLights.py.
// They are drawn on the back wall, so they never get in the way. A light goes out when what it hangs on (anything solid within five pixels) is destroyed.


AddTerrainObject = TerrainObject
	PresetName = Ceiling Lamp White
	Description = A lamp that hangs from the ceiling. It goes out if the ceiling it hangs from is destroyed.
	AddToGroup = Bunker Lights
	GoldValue = 5
	BGColorFile = ContentFile
		FilePath = Base.rte/Scenes/Objects/Bunkers/BunkerLights/CeilingLampWhiteBG.png
	BitmapOffset = Vector
		X = 0
		Y = 0
	AddLight = TerrainLight
		Offset = Vector
			X = 6
			Y = 6
		Color = Color
			R = 225
			G = 240
			B = 235
		Radius = 120
		Intensity = 1.1


