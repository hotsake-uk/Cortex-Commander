///////////////////////////////////////////////////////////////////////
// Lifts and moving platforms (AMover)
//
// An AMover's deck travels in straight lines between its stops (AddStop, the deck's offset from the motor), pausing StopWait ms at each.
// The deck is drawn into the terrain as Lift Metal where it is, so units stand on it, and what stands on it is carried along.
// ClearStops = 1 drops the stops of the preset copied from, before new ones are added. Speed is in pixels per second. OnCall = 1 makes it wait at its stop until a unit stands at another stop or rides it, instead of shuttling.
// A mover belongs to no side; it stops and goes back rather than crush a unit in its way.


AddEffect = MOSRotating
	PresetName = Lift Deck Gib
	Mass = 15
	HitsMOs = 1
	GetsHitByMOs = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Scenes/Objects/Bunkers/BunkerSystems/Lifts/LiftDeckGib.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -9
		Y = -4
	AngularVel = 6
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Military Stuff
		Resolution = 4
		Depth = 0
	DeepCheck = 0


