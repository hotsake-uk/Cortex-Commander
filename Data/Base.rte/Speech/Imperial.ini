// An example of a mod's tone: Imperial, troopers of a galactic Empire ("For the Emperor!", "Rebel scum!").
//
// Any module can do the same: put a Speech.ini, or .ini files in a Speech folder (read by name), in the module's folder. This file:
//   - names a new tone with ToneDescription (and so adds it to the settings, Game & HUD: Unit speech, where a side can pick it);
//   - gives it ToneWeight 0, so it stays out of sides that speak any tone and is only heard from a side that ticks it;
//   - adds lines of that tone to the triggers Base.rte/Speech.ini defines ("Trigger = Key" with a key already defined adds to it).
// A mod can also define triggers of its own (a new key, fired from Lua with actor:Say("Key")), or give a faction its own lines with
// "Set = Name" and SpeechSet on its actors. See the notes at the top of Base.rte/Speech.ini.

ToneDescription = Imperial: troopers of a galactic Empire ("For the Emperor!", "Rebel scum!"). An example of a mod's tone, in Base.rte/Speech/Imperial.ini.
