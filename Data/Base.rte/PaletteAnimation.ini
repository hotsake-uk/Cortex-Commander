// Animated palette colours (the "Animated palette colours" setting on the Surfaces page). Read once when a game starts.
// Each line works on the game palette's colour numbers (1 to 255), on all existing art that uses them, with no new assets.
//
// Pulse = colour, low glow, high glow, seconds per pulse, phase
//     The colour's glow swings between the two strengths (0 to 1) and back, starting at the phase (0 to 1) of its pulse.
//     For hot metal, warning lights and glow strips. Two colours with the same period and phases 0 and 0.5 blink in turn.
// Cycle = first colour, last colour, seconds per full turn
//     The run of colours rotates through itself, the classic palette cycle for running water or energy.
//
// Glowing liquids (lava) breathe on their own and need no line here. Scripts can do the same at any time with
// PostProcessMan:SetPalettePulse(colour, low, high, period, phase), PostProcessMan:SetPaletteCycle(first, last, period)
// and PostProcessMan:ClearPaletteAnimation().
//
// Examples (remove the // to use them):
// Pulse = 117, 0.4, 1.0, 1.2, 0
// Cycle = 200, 207, 2.0
