// Powerups
//
// Items a unit carries and uses from its inventory (the unit menu's Quick actions; units run by the AI use them by themselves in a fight)
// for a few seconds of an effect. What each gives is its Powerup properties (HeldDevice: PowerupShield, PowerupStim, PowerupOvercharge and
// PowerupCloak in seconds, PowerupHeal, PowerupUses). Placed from the Sandbox item list; not in the buy menu (BuyableMode 2). The pictures
// are Tools/MakePowerupSprites.py's. The spell scrolls are Medieval.rte's (Devices/Scrolls).


