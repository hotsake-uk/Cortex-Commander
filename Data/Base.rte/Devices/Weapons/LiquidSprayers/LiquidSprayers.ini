// Sprayers


AddDevice = HDFirearm
	CopyOf = Concrete Sprayer
	PresetName = Water Cannon
	AddToGroup = Weapons
	Description = A high-pressure water cannon. Knocks people off their feet and puts out fires. The water runs off and pools like any other.
	GoldValue = 30
	Buyable = 1
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Weapons/LiquidSprayers/WaterSprayer.png
	FrameCount = 2
	Magazine = Magazine
		CopyOf = Magazine Water Cannon
	RateOfFire = 3000
	ReloadTime = 2000
	ParticleSpreadRange = 3


