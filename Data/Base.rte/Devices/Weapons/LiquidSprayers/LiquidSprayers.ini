///////////////////////////////////////////////////////////////////////
// Liquid sprayers: the Concrete Sprayer refitted to spray water, acid or burning fuel.
// Their drops settle into the terrain as flowing liquid (see FluidSim): water puts fires out, acid eats soft ground, napalm fuel pools and burns.
// A drop only flows if it's drawn in its liquid's own colour, so keep each drop's Color the same as its material's.


///////////////////////////////////////////////////////////////////////
// Ammo


AddAmmo = MOPixel
	PresetName = Water Jet Drop
	Mass = 0.25
	RestThreshold = 500
	AirResistance = 0.02
	HitsMOs = 1
	GetsHitByMOs = 0
	Sharpness = 0
	Color = Color
		R = 15
		G = 105
		B = 145
	Atom = Atom
		Material = Material
			CopyOf = Water
		TrailColor = Color
			R = 93
			G = 158
			B = 225
		TrailLength = 4


AddAmmo = Round
	PresetName = Round Water Jet
	ParticleCount = 6
	Particle = MOPixel
		CopyOf = Water Jet Drop
	FireVelocity = 26
	Separation = 6


AddAmmo = MOPixel
	PresetName = Acid Glob
	Mass = 0.05
	RestThreshold = 500
	HitsMOs = 1
	GetsHitByMOs = 0
	Sharpness = 0
	DamageOnCollision = 0.6
	Color = Color
		R = 120
		G = 220
		B = 40
	Atom = Atom
		Material = Material
			CopyOf = Acid
		TrailColor = Color
			R = 120
			G = 220
			B = 40
		TrailLength = 2


AddAmmo = Round
	PresetName = Round Acid Glob
	ParticleCount = 7
	Particle = MOPixel
		CopyOf = Acid Glob
	FireVelocity = 15
	Separation = 4


AddAmmo = MOPixel
	PresetName = Napalm Fuel
	Mass = 0.08
	RestThreshold = 500
	AirResistance = 0.02
	HitsMOs = 1
	GetsHitByMOs = 0
	Sharpness = 0
	DamageOnCollision = 0.4
	Color = Color
		R = 64
		G = 19
		B = 12
	Atom = Atom
		Material = Material
			CopyOf = Oil
		TrailColor = Color
			R = 255
			G = 160
			B = 40
		TrailLength = 3
	ScreenEffect = ContentFile
		FilePath = Base.rte/Effects/Glows/FireGlowTiny.png
	EffectStartTime = 0
	EffectStopTime = 600
	EffectStartStrength = 0.8
	EffectStopStrength = 0.2


AddAmmo = Round
	PresetName = Round Napalm Fuel
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Napalm Fuel
	FireVelocity = 16
	Separation = 5


AddAmmo = Round
	PresetName = Round Napalm Flame
	ParticleCount = 1
	Particle = MOSParticle
		CopyOf = Flame Hurt Short
	FireVelocity = 15
	Separation = 3


