///////////////////////////////////////////////////////////////////////
// Magic (MG-1): the first spells, built on the engine's magic effects rather than on bullets.
// A spell is a book or a scroll (Tools/MakeSpellSprites.py), seen only where it lies dropped: a unit holding one doesn't draw it
// (DrawnWhenHeld = 0), and its empty hand takes the spell's pose while casting (CastStanceOffset, held CastPoseTime after each cast).
// Telekinetic Push casts SceneMan:MagicPush (Source/Managers/MagicEffects): a shove of everything in a cone in front of the hand, and a
// gust of air that carries smoke and spray with it. Acid Spray throws Spell Acid, which eats soft ground and stings for ten seconds after
// it lands and is then gone (the material's FadeAfter). Both are in the "Spells" group, and in Weapons so the AI casts them.


///////////////////////////////////////////////////////////////////////
// Shared


AddDevice = HDFirearm
	PresetName = Spell Base
	Buyable = 0
	Mass = 1
	HitsMOs = 0
	GetsHitByMOs = 1
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Magic/SpellBook.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -6
		Y = -4
	EntryWound = AEmitter
		CopyOf = Dent Metal Device
	ExitWound = AEmitter
		CopyOf = Dent Metal Device
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Civilian Stuff
		Resolution = 2
		Depth = 0
	DeepGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Civilian Stuff
		Resolution = 3
		Depth = 4
	DeepCheck = 0
	JointStrength = 200
	JointStiffness = 0.5
	JointOffset = Vector
		X = 0
		Y = 0
	DrawAfterParent = 1
	DrawnWhenHeld = 0
	CollidesWithTerrainWhileAttached = 0
	GetsHitByMOsWhenHeld = 0
	// The hand at rest, a little forward and low, as if ready.
	StanceOffset = Vector
		X = 6
		Y = 6
	SharpStanceOffset = Vector
		X = 9
		Y = 1
	SharpLength = 0
	OneHanded = 1
	Supportable = 0
	CastPoseTime = 450
	FireIgnoresThis = 1
	ShakeRange = 0
	SharpShakeRange = 0
	NoSupportFactor = 1
	ParticleSpreadRange = 0
	MuzzleOffset = Vector
		X = 3
		Y = 0
	EmptySound = SoundContainer
		AddSound = ContentFile
			FilePath = Base.rte/Sounds/Devices/EmptyClick1.flac
	GibImpulseLimit = 2000


///////////////////////////////////////////////////////////////////////
// Telekinetic Push


// An invisible wave the push "fires": it hits nothing, and only tells the AI how far the push reaches (30 m/s for a quarter second, about
// the 150 px the script pushes over).
AddAmmo = MOPixel
	PresetName = Telekinetic Push Wave
	Mass = 0.01
	LifeTime = 250
	HitsMOs = 0
	GetsHitByMOs = 0
	Sharpness = 0
	Color = Color
		R = 255
		G = 0
		B = 255
	Atom = Atom
		Material = Material
			CopyOf = Air


AddAmmo = Round
	PresetName = Round Telekinetic Push
	ParticleCount = 1
	Particle = MOPixel
		CopyOf = Telekinetic Push Wave
	FireVelocity = 30


AddAmmo = Magazine
	CopyOf = Null Magazine Infinite
	PresetName = Magazine Telekinetic Push
	RegularRound = Round
		CopyOf = Round Telekinetic Push


AddDevice = HDFirearm
	CopyOf = Spell Base
	PresetName = Telekinetic Push
	AddToGroup = Weapons
	AddToGroup = Weapons - Secondary
	AddToGroup = Spells
	AddToGroup = Spells - Utility
	Description = A spell book. A wave of force out of the open hand shoves units, grenades, gibs and loose things in front of you away, the nearer and lighter the harder, and knocks a unit close by off its feet. Walls shield what is behind them. Pushes smoke and spray along with it.
	GoldValue = 40
	Buyable = 1
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Magic/SpellBook.png
	ScriptPath = Base.rte/Devices/Magic/TelekineticPush.lua
	// Casting: the palm thrust out at arm's length.
	CastStanceOffset = Vector
		X = 13
		Y = -2
	Magazine = Magazine
		CopyOf = Magazine Telekinetic Push
	FireSound = SoundContainer
		AttenuationStartDistance = 160
		AddSound = ContentFile
			FilePath = Base.rte/Sounds/Actors/JetpackStart1.flac
		AddSound = ContentFile
			FilePath = Base.rte/Sounds/Actors/JetpackStart2.flac
		AddSound = ContentFile
			FilePath = Base.rte/Sounds/Actors/JetpackStart3.flac
	RateOfFire = 75
	FullAuto = 0


///////////////////////////////////////////////////////////////////////
// Acid Spray


AddAmmo = MOPixel
	CopyOf = Acid Glob
	PresetName = Spell Acid Glob
	// Gone if it hasn't landed in six seconds; once it lands it is Spell Acid, which goes ten seconds after.
	LifeTime = 6000
	Color = Color
		R = 150
		G = 245
		B = 60
	Atom = Atom
		Material = Material
			CopyOf = Spell Acid
		TrailColor = Color
			R = 150
			G = 245
			B = 60
		TrailLength = 2


AddAmmo = Round
	PresetName = Round Spell Acid Glob
	ParticleCount = 6
	Particle = MOPixel
		CopyOf = Spell Acid Glob
	FireVelocity = 17
	Separation = 4


AddAmmo = Magazine
	CopyOf = Null Magazine Infinite
	PresetName = Magazine Acid Spray
	RegularRound = Round
		CopyOf = Round Spell Acid Glob


AddDevice = HDFirearm
	CopyOf = Spell Base
	PresetName = Acid Spray
	AddToGroup = Weapons
	AddToGroup = Weapons - Primary
	AddToGroup = Spells
	AddToGroup = Spells - Attack
	Description = A spell scroll. Sprays acid from both hands that stings whoever it hits and eats away dirt, sand and other soft ground where it pools. Ten seconds after it lands it is gone.
	GoldValue = 60
	Buyable = 1
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Magic/SpellScroll.png
	SpriteOffset = Vector
		X = -7
		Y = -4
	// Casting: both hands out in front, cupped together, as the acid pours from them.
	CastStanceOffset = Vector
		X = 11
		Y = 1
	Supportable = 1
	OneHanded = 0
	SupportOffset = Vector
		X = 0
		Y = 1
	Magazine = Magazine
		CopyOf = Magazine Acid Spray
	FireSound = SoundContainer
		AttenuationStartDistance = 150
		AddSound = ContentFile
			FilePath = Base.rte/Devices/Tools/Digger/Sounds/DiggerActive.flac
		LoopSetting = -1
	RateOfFire = 600
	FullAuto = 1
	ParticleSpreadRange = 8
