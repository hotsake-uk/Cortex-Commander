///////////////////////////////////////////////////////////////////////
// Magic (MG-1): the first spells, built on the engine's magic effects rather than on bullets.
// Telekinetic Push casts SceneMan:MagicPush (Source/Managers/MagicEffects): a shove of everything in a cone in front of it, and a gust of air
// that carries smoke and spray with it. Acid Spray throws Spell Acid, which eats soft ground and stings for ten seconds after it lands and is
// then gone (the material's FadeAfter). Both are in the "Spells" group. For now they borrow the Repeller's and the Acid Sprayer's looks.


///////////////////////////////////////////////////////////////////////
// Telekinetic Push


AddDevice = HDFirearm
	CopyOf = Repeller Gun
	PresetName = Telekinetic Push
	AddToGroup = Tools
	AddToGroup = Spells
	AddToGroup = Spells - Utility
	Description = A wave of force out of the hand: shoves units, grenades, gibs and loose things in front of you away, the nearer and lighter the harder, and knocks a unit close by off its feet. Walls shield what is behind them. Pushes smoke and spray along with it.
	GoldValue = 40
	Buyable = 1
	ScriptPath = Base.rte/Devices/Magic/TelekineticPush.lua
	Magazine = Magazine
		CopyOf = Null Magazine Infinite
	FireSound = SoundContainer
		AttenuationStartDistance = 160
		AddSound = ContentFile
			FilePath = Base.rte/Sounds/Actors/JetpackStart1.flac
		AddSound = ContentFile
			FilePath = Base.rte/Sounds/Actors/JetpackStart2.flac
		AddSound = ContentFile
			FilePath = Base.rte/Sounds/Actors/JetpackStart3.flac
	RateOfFire = 75
	FullAuto = 0
	ShakeRange = 0
	ParticleSpreadRange = 0


///////////////////////////////////////////////////////////////////////
// Acid Spray


AddAmmo = MOPixel
	CopyOf = Acid Glob
	PresetName = Spell Acid Glob
	// Gone if it hasn't landed in six seconds; once it lands it is Spell Acid, which goes ten seconds after.
	LifeTime = 6000
	Color = Color
		R = 150
		G = 245
		B = 60
	Atom = Atom
		Material = Material
			CopyOf = Spell Acid
		TrailColor = Color
			R = 150
			G = 245
			B = 60
		TrailLength = 2


AddAmmo = Round
	PresetName = Round Spell Acid Glob
	ParticleCount = 6
	Particle = MOPixel
		CopyOf = Spell Acid Glob
	FireVelocity = 17
	Separation = 4


AddAmmo = Magazine
	CopyOf = Magazine Acid Sprayer
	PresetName = Magazine Acid Spray
	RoundCount = 80
	RegularRound = Round
		CopyOf = Round Spell Acid Glob
	TracerRound = Round
		CopyOf = Round Spell Acid Glob


AddDevice = HDFirearm
	CopyOf = Acid Sprayer
	PresetName = Acid Spray
	AddToGroup = Spells
	AddToGroup = Spells - Attack
	Description = Sprays acid that stings whoever it hits and eats away dirt, sand and other soft ground where it pools. Ten seconds after it lands it is gone.
	GoldValue = 60
	Buyable = 1
	Magazine = Magazine
		CopyOf = Magazine Acid Spray
	RateOfFire = 600
