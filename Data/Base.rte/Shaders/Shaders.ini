// A unit turned to stone by a creature (the "Petrified" status effect Actors/Creatures/Shared/Gaze.lua puts on it): a mod shader as the
// Medieval faction's, turned off with "Mod shaders" in the settings and faded by the mod shader strength.
AddShader = Shader
	PresetName = Creature Petrified
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Base.rte/Shaders/Petrified.frag

// A unit chilled by a creature (the "Chilled" status effect Actors/Creatures/Shared/Chill.lua puts on it: a frost drake's breath, a shade's
// touch), and the Shade itself (its own Shader), mod shaders as above.
AddShader = Shader
	PresetName = Creature Frozen
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Base.rte/Shaders/Frozen.frag

AddShader = Shader
	PresetName = Creature Spectral
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Base.rte/Shaders/Spectral.frag
