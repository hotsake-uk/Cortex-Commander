///////////////////////////////////////////////////////////////////////
// Motor Boat (VH-2): a little speedboat with an outboard motor. It drives only with the propeller in the water, rides up on its bow at
// speed, and its motor puffs smoke and revs with the throttle.
// The picture is made by Tools/MakeVehicleSprites.py, the motor's sound by Tools/MakeVehicleSounds.py.


AddEffect = AEmitter
	PresetName = Motor Boat Exhaust
	Mass = 0
	HitsMOs = 0
	GetsHitByMOs = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Null.png
	FrameCount = 1
	AtomGroup = AtomGroup
		CopyOf = Null AtomGroup
	JointStrength = 10000
	JointStiffness = 1
	DrawAfterParent = 1
	// Up out of the stack.
	EmissionAngle = Matrix
		AngleDegrees = 90
	AddEmission = Emission
		EmittedParticle = MOSParticle
			CopyOf = Tiny Smoke Ball 1
			PresetName = Motor Boat Exhaust Puff
			LifeTime = 700
			AirResistance = 0.05
		LifeVariation = 0.4
		Spread = 0.4
		MaxVelocity = 3
		MinVelocity = 1
		PushesEmitter = 0
	ParticlesPerMinute = 240
	// Twice as thick flat out (the engine's load sets the throttle).
	NegativeThrottleMultiplier = 0.5
	PositiveThrottleMultiplier = 2
	EmissionEnabled = 0


AddActor = AVehicle
	PresetName = Motor Boat
	Description = A little speedboat with an outboard motor. Put it in the water, climb in (pick up beside it) and drive with left and right; down slows it. It rides up on its bow at speed and throws spray. It only drives with the propeller in the water, and out of it just sits on its hull.
	AddToGroup = Actors
	AddToGroup = Actors - Vehicles
	Buyable = 1
	GoldValue = 90
	Mass = 110
	HitsMOs = 1
	GetsHitByMOs = 1
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Vehicles/MotorBoat/MotorBoatHull.png
	IconFile = ContentFile
		FilePath = Base.rte/Actors/Vehicles/MotorBoat/MotorBoatIcon.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -46
		Y = -13
	EntryWound = AEmitter
		CopyOf = Dent Metal Light
	ExitWound = AEmitter
		CopyOf = Dent Metal Light
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Metal
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	Health = 120
	Mechanical = 1
	ImpulseDamageThreshold = 4000
	CharHeight = 30
	Perceptiveness = 0.25
	// Points along the bottom, from the middle, that the water holds up: each by as much of the 10 pixels above it as is under water.
	AddHullPoint = Vector
		X = -34
		Y = 7
	AddHullPoint = Vector
		X = -22
		Y = 7
	AddHullPoint = Vector
		X = -10
		Y = 7
	AddHullPoint = Vector
		X = 2
		Y = 7
	AddHullPoint = Vector
		X = 14
		Y = 6
	AddHullPoint = Vector
		X = 26
		Y = 3
	AddHullPoint = Vector
		X = 38
		Y = -2
	HullDraft = 10
	Buoyancy = 2.6
	WaterThrust = 6
	WaterMaxSpeed = 11
	WaterDrag = 0.3
	// The bow comes up about 7 degrees at top speed.
	PlaningTrim = 0.12
	// The propeller, at the bottom of the outboard's leg: no push with it out of the water.
	PropellerOffset = Vector
		X = -42
		Y = 13
	EngineSound = SoundContainer
		AttenuationStartDistance = 180
		AddSound = ContentFile
			FilePath = Base.rte/Actors/Vehicles/MotorBoat/OutboardLoop.wav
		LoopSetting = -1
	Exhaust = AEmitter
		CopyOf = Motor Boat Exhaust
		ParentOffset = Vector
			X = -43
			Y = -13
	BrakeStrength = 4
	SeatOffset = Vector
		X = -12
		Y = -8
	ExitOffset = Vector
		X = 56
		Y = -14
	BoardingReach = 40
	GibImpulseLimit = 3000
	GibWoundLimit = 25
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Panel White Medium A
		Count = 4
		Spread = 3.1
		MaxVelocity = 9
		MinVelocity = 2
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Panel White Small B
		Count = 6
		Spread = 3.1
		MaxVelocity = 10
		MinVelocity = 2
	AddGib = Gib
