AddActor = AVehicle
	PresetName = Tank
	Description = A tracked tank with a turret gun. Slow, heavy and hard to stop; small arms barely scratch it. Its crew sit inside, out of sight, and stay in however hard it is knocked about. The first soldier in drives; a second lays the gun and fires at enemies ahead. On your own you aim and fire it as you drive.
	AddToGroup = Actors
	AddToGroup = Actors - Vehicles
	Buyable = 1
	GoldValue = 450
	Mass = 600
	HitsMOs = 1
	GetsHitByMOs = 1
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Vehicles/Tank/TankHull.png
	IconFile = ContentFile
		FilePath = Base.rte/Actors/Vehicles/Tank/TankIcon.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -58
		Y = -15
	EntryWound = AEmitter
		CopyOf = Dent Metal
	ExitWound = AEmitter
		CopyOf = Dent Metal
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Military Stuff
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	Health = 400
	DamageMultiplier = 0.4
	Mechanical = 1
	ImpulseDamageThreshold = 20000
	CharHeight = 50
	Perceptiveness = 0.35
	// Six road wheels on short, stiff springs, the belt over them.
	AddWheel = Attachable
		CopyOf = Tank Road Wheel
		ParentOffset = Vector
			X = -38
			Y = 15
	AddWheel = Attachable
		CopyOf = Tank Road Wheel
		ParentOffset = Vector
			X = -23
			Y = 15
	AddWheel = Attachable
		CopyOf = Tank Road Wheel
		ParentOffset = Vector
			X = -8
			Y = 15
	AddWheel = Attachable
		CopyOf = Tank Road Wheel
		ParentOffset = Vector
			X = 7
			Y = 15
	AddWheel = Attachable
		CopyOf = Tank Road Wheel
		ParentOffset = Vector
			X = 22
			Y = 15
	AddWheel = Attachable
		CopyOf = Tank Road Wheel
		ParentOffset = Vector
			X = 37
			Y = 15
	// After the wheels, so the belt is drawn over them. Its frames step on a pixel's drive at a time: four make a link.
	Tracks = Attachable
		CopyOf = Tank Tracks
		ParentOffset = Vector
			X = 0
			Y = 12
	TrackFrameLength = 1
	// At rest the springs sit about half way in (9.8 / (98 * 0.05 m per pixel) = 2 pixels of 4).
	SuspensionTravel = 4
	SuspensionStiffness = 98
	SuspensionDamping = 14
	Acceleration = 2.5
	BrakeStrength = 8
	RollingResistance = 1
	MaxSpeed = 4
	Grip = 1.6
	SeatOffset = Vector
		X = 24
		Y = -6
	AddGunnerSeat = Vector
		X = -6
		Y = -12
	DrawsCrew = 0
	CrewThrowSpeed = 0
	ThrowsCrewWhenFlipped = 0
	Turret = Turret
		CopyOf = Tank Turret
		ParentOffset = Vector
			X = -6
			Y = -16
	// The gun lays about 23 degrees up and down from level, and the gunner looks 800 pixels out.
	AimRange = 0.4
	GunRange = 800
	GunTurnSpeed = 1
	EngineSound = SoundContainer
		AttenuationStartDistance = 260
		AddSound = ContentFile
			FilePath = Base.rte/Actors/Vehicles/Tank/TankEngineLoop.wav
		LoopSetting = -1
	Exhaust = AEmitter
		CopyOf = Tank Exhaust
		ParentOffset = Vector
			X = -38
			Y = -12
	ExitOffset = Vector
		X = 72
		Y = -10
	BoardingReach = 52
	Buoyancy = 0.2
	GibImpulseLimit = 30000
	GibWoundLimit = 120
