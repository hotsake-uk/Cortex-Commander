// Tank (VH-5): a tracked tank with a turret gun. Its crew sit inside, out of sight and kept in when it is knocked about; the gunner (or the
// driver alone) lays the gun. The tracks' links run round as it drives.
// The pictures are made by Tools/MakeVehicleSprites.py, the engine's sound by Tools/MakeVehicleSounds.py.


AddAmmo = AEmitter
	CopyOf = Particle Rocket Launcher
	PresetName = Particle Tank Shell
	GlobalAccScalar = 0.35
	Mass = 8


AddAmmo = Magazine
	CopyOf = Null Magazine
	PresetName = Magazine Tank Cannon
	Mass = 6
	RoundCount = 1
	RegularRound = Round
		PresetName = Round Tank Cannon
		ParticleCount = 1
		Particle = AEmitter
			CopyOf = Particle Tank Shell
		Shell = MOSParticle
			CopyOf = Explosion Smoke 1
		AIFireVel = 55
		FireVelocity = 55
		ShellVelocity = -3
	AIBlastRadius = 60


