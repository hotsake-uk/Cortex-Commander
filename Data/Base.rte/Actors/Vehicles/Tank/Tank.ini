		FilePath = Base.rte/Null.png
	FrameCount = 1
	AtomGroup = AtomGroup
		CopyOf = Null AtomGroup
	JointStrength = 10000
	JointStiffness = 1
	DrawAfterParent = 1
	EmissionAngle = Matrix
		AngleDegrees = 90
	AddEmission = Emission
		EmittedParticle = MOSParticle
			CopyOf = Small Smoke Ball 1
			PresetName = Tank Exhaust Puff
			LifeTime = 900
			AirResistance = 0.05
