AddActor = AVehicle
	PresetName = Moonhopper
	Description = A six-wheeled rock hopper on stilts. Every wheel rides its own long, soft spring, so it walks over boulders, craters and bunker roofs with the cab barely rocking. Jump (the jump key) with its wheels down and the springs throw it into the air. A soldier climbs in to drive it (pick up beside it).
