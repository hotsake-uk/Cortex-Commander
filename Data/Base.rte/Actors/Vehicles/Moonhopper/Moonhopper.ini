// Moonhopper: a six-wheeled rock hopper on tall telescoping legs, made to show off the sprung wheels. Each wheel rides its own long, soft
// spring on a leg that slides up into the shock above it; with half its wheels down it jumps (the jump key).
// The pictures are made by Tools/MakeVehicleSprites.py.


AddActor = Attachable
	PresetName = Moonhopper Leg
	Mass = 6
	HitsMOs = 1
	GetsHitByMOs = 1
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Vehicles/Moonhopper/HopperLeg.png
	FrameCount = 1
	// The leg's picture hangs up from the wheel's axle.
	SpriteOffset = Vector
		X = -3
		Y = -35
	EntryWound = AEmitter
		CopyOf = Dent Metal Light
	ExitWound = AEmitter
		CopyOf = Dent Metal Light
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Metal
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	CollidesWithTerrainWhileAttached = 0
	DrawAfterParent = 0
	JointStrength = 4000
	JointStiffness = 0.6
	GibImpulseLimit = 4000
	GibWoundLimit = 6
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Pipe Small A
		Count = 2
		Spread = 3.1
		MaxVelocity = 8
		MinVelocity = 2


