///////////////////////////////////////////////////////////////////////
// Giant Wasp (phase 4, C8). A wasp the size of a dog: it hovers by its prey and stings it again and again, a venom that hurts and slows.
// It tires after half a minute in the air and lands to rest. Placeholder art drawn by Tools/make_placeholders.py: three frames, a wing
// beat.


// The sting: venom (Shared/Venom.lua), 6 health a second for 3 seconds, walking at seven tenths of its pace meanwhile.

AddEffect = MOPixel
	CopyOf = Particle Spider Venom Bite
	PresetName = Particle Wasp Sting
	AddCustomValue = NumberValue
		VenomDamage = 6
	AddCustomValue = NumberValue
		VenomSeconds = 3
	AddCustomValue = NumberValue
		VenomSlow = 0.7


AddAmmo = Round
	PresetName = Round Wasp Sting
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Wasp Sting
	Shell = None
	FireVelocity = 32
	Separation = 2


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Wasp Sting
	Description = "A giant wasp's sting. It comes with the wasp."
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Wasp Sting
		RegularRound = Round
			CopyOf = Round Wasp Sting
	RateOfFire = 70
	MuzzleOffset = Vector
		X = 4
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Wasp Head
	MountedDevice = HDFirearm
		CopyOf = Wasp Sting
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	PresetName = Giant Wasp
	Description = "A wasp the size of a dog. It hovers by its prey and stings it again and again, a venom that hurts and slows."
	AddToGroup = Actors - Creatures
	GoldValue = 70
	Buyable = 1
	Mass = 14
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/GiantWasp/GiantWaspBodyA.png
	FrameCount = 3
	SpriteAnimMode = 0
	SpriteOffset = Vector
		X = -15
		Y = -12
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Armoured Flesh
		Resolution = 3
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Bone Crack
	DeathSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PassengerSlots = 0
	// What its body can do (the movement profile): 28 px across and 16 tall; it flies on its wings at 7 m/s for 30 seconds before it
	// must land and rest. It doesn't climb.
	BodyWidth = 28
	BodyHeight = 16
	Flies = Wings
	FlySpeed = 7
	FlyStamina = 30
	Swims = Never
	BreathSeconds = 10
	SafeFallHeight = 300
	AimRangeUpperLimit = 1.5
	AimRangeLowerLimit = 1.5
	// How it hunts (CreatureBehaviors.FlyHunt): hovers 24 px off its prey and stings within 34 px, and joins a packmate's hunt within 300 px.
	AddCustomValue = StringValue
		CreatureFlyAttack = Hover
	AddCustomValue = NumberValue
		CreatureHoverRange = 24
	AddCustomValue = NumberValue
		CreatureAttackRange = 34
	AddCustomValue = NumberValue
		CreatureBiteReach = 20
	AddCustomValue = NumberValue
		CreaturePackRange = 300
	AddCustomValue = NumberValue
		CreatureChaseRange = 900
	Turret = Turret
		CopyOf = Wasp Head
		ParentOffset = Vector
			X = 6
			Y = 2
	MaxHealth = 90
	Health = 90
	Organic = 1
	ImpulseDamageThreshold = 2500
	Perceptiveness = 0.9
	CharHeight = 22
	// (No legs, but a crab's body still keeps foot groups.)
	LFootGroup = AtomGroup
		CopyOf = Crab Foot
	RFootGroup = AtomGroup
		CopyOf = Crab Foot
	GibImpulseLimit = 2500
	GibWoundLimit = 7
	GibSound = SoundContainer
		CopyOf = Bone Crack
	AddGib = Gib
		GibParticle = MOPixel
			CopyOf = Drop Blood
		Count = 6
		MinVelocity = 1
		MaxVelocity = 6
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Flesh Tiny A
		Count = 3
		MinVelocity = 1
		MaxVelocity = 4
