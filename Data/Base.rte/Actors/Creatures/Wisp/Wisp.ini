	AddCustomValue = StringValue
		CreatureFlyAttack = Hover
	AddCustomValue = NumberValue
		CreatureHoverRange = 160
	AddCustomValue = NumberValue
		CreatureAttackRange = 16
	AddCustomValue = NumberValue
		CreatureBiteReach = 16
	AddCustomValue = NumberValue
		CreatureSpitRange = 320
	AddCustomValue = NumberValue
		CreatureSpitCooldown = 1500
	AddCustomValue = NumberValue
