// Wisp (phase 4, C8). A ball of living light that flies freely, as a flying vehicle does, with no wings: it never tires, holds still in
// the air off its prey and casts bolts of light at it, and shocks what touches it. It glows (Wisp.lua). Placeholder art drawn by
// Tools/make_placeholders.py.


// Its bolt: a fast mote of light that strikes hard and fizzles (Wisp.lua).

AddEffect = MOPixel
	PresetName = Wisp Bolt
	Mass = 0.1
	Sharpness = 60
	WoundDamageMultiplier = 3
	HitsMOs = 1
	GetsHitByMOs = 0
	GlobalAccScalar = 0
	AirResistance = 0
	LifeTime = 1500
	RestThreshold = 500
	ScriptPath = Base.rte/Actors/Creatures/Wisp/Wisp.lua
	Color = Color
		R = 180
		G = 220
		B = 255
	Atom = Atom
		Material = Material
			CopyOf = Bullet Metal
		TrailColor = Color
			R = 110
			G = 170
			B = 255
		TrailLength = 8


AddEffect = MOPixel
	CopyOf = Particle Hound Bite
	PresetName = Particle Wisp Shock
	WoundDamageMultiplier = 1
	Color = Color
		R = 180
		G = 220
		B = 255


AddAmmo = Round
	PresetName = Round Wisp Shock
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Wisp Shock
	Shell = None
	FireVelocity = 28
	Separation = 2


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Wisp Shock
	Description = "A wisp's touch, a shock of light. It comes with the wisp."
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Wisp Shock
		RegularRound = Round
			CopyOf = Round Wisp Shock
	RateOfFire = 90
	MuzzleOffset = Vector
		X = 3
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Wisp Heart
	MountedDevice = HDFirearm
		CopyOf = Wisp Shock
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	PresetName = Wisp
	Description = "A ball of living light. It drifts freely through the air, never tiring, and casts bolts of light at its prey from afar."
	AddToGroup = Actors - Creatures
	GoldValue = 110
	Buyable = 1
	Mass = 4
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Wisp/Wisp.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Wisp/WispBodyA.png
	FrameCount = 2
	SpriteAnimMode = 4
	SpriteAnimDuration = 400
	SpriteOffset = Vector
		X = -9
		Y = -9
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Flesh
		Resolution = 3
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	DeathSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PassengerSlots = 0
	// What its body can do (the movement profile): 16 px round; it flies freely at 5 m/s and never tires; fire doesn't catch on it, and
	// it doesn't breathe.
	BodyWidth = 16
	BodyHeight = 16
	Flies = Free
	FlySpeed = 5
	FireProof = 1
	Swims = Never
	BreathSeconds = 0
	SafeFallHeight = 400
	AimRangeUpperLimit = 1.5
	AimRangeLowerLimit = 1.5
