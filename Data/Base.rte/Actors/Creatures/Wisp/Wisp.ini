	AddCustomValue = StringValue
		CreatureSpit = Wisp Bolt
	AddCustomValue = NumberValue
		CreaturePackRange = 400
	AddCustomValue = NumberValue
		CreatureChaseRange = 1000
	Turret = Turret
		CopyOf = Wisp Heart
		ParentOffset = Vector
			X = 0
			Y = 0
	MaxHealth = 60
	Health = 60
	Organic = 0
	ImpulseDamageThreshold = 3000
	Perceptiveness = 1
	CharHeight = 18
