///////////////////////////////////////////////////////////////////////
// Shade (Bestiary III, the fliers). A ghost: a hooded, tattered thing of dark grey-blue (drawn by Tools/make_bestiary.py) drawn in the
// Creature Spectral shader, that drifts freely through the air as a wisp does (Flies = Free: no wings, no tiring, no landing), passes
// through units rather than against them, and chills whoever it touches (Shared/Chill.lua). Ghostly for good (a PassiveEffect, SE-1:
// half the harm, fire-proof), of the Unholy group (the Kingdom's Holy Smite is for the undead), and it leaves no body: killed, it goes
// to mist (Shade.lua).


AddEffect = MOPixel
	CopyOf = Particle Hound Bite
	PresetName = Particle Shade Touch
	ScriptPath = Base.rte/Actors/Creatures/Shared/Chill.lua
	WoundDamageMultiplier = 1.5
	Color = Color
		R = 120
		G = 140
		B = 190
	AddCustomValue = NumberValue
		ChillSeconds = 3
	AddCustomValue = NumberValue
		ChillSpeed = 0.7


AddAmmo = Round
	PresetName = Round Shade Touch
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Shade Touch
	Shell = None
	FireVelocity = 22
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Shade Touch
	Description = "A shade's cold touch. It comes with the shade."
	SharpLength = 18
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Shade Touch
		RegularRound = Round
			CopyOf = Round Shade Touch
	FireSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	RateOfFire = 70
	MuzzleOffset = Vector
		X = 4
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Shade Heart
	MountedDevice = HDFirearm
		CopyOf = Shade Touch
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	PresetName = Shade
	Description = "A ghost in tattered grey. It drifts through the air, never tiring, passes through whoever stands in its way and chills them with its touch. Blades and arrows do it half the harm; holy light does it more."
	AddToGroup = Actors - Creatures
	AddToGroup = Unholy
	GoldValue = 130
	Buyable = 1
	Mass = 6
	HitsMOs = 0
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shade/Shade.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Shade/ShadeBodyA.png
	FrameCount = 2
	SpriteAnimMode = 4
	SpriteAnimDuration = 600
	SpriteOffset = Vector
		X = -11
		Y = -14
	Shader = Creature Spectral
	EntryWound = AEmitter
		CopyOf = Wound Dry Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Dry Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Flesh
		Resolution = 3
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	DeathSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PassengerSlots = 0
	BodyWidth = 22
	BodyHeight = 28
	Flies = Free
	FlySpeed = 4
	FireProof = 1
	Swims = Never
	BreathSeconds = 0
	SafeFallHeight = 400
	AimRangeUpperLimit = 1.5
	AimRangeLowerLimit = 1.5
	// Ghostly (SE-1): half the harm and no fire, for good.
	PassiveEffect = StatusEffect
		Name = Ghostly
		Label = Ghostly
		DamageTakenMultiplier = 0.5
		FireProof = 1
	// How it hunts (CreatureBehaviors.FlyHunt): drifts to 24 px off its prey and touches it from there, within 20 px; joins another's
	// hunt within 400 px, gives up past 1000 px.
	AddCustomValue = StringValue
		CreatureFlyAttack = Hover
	AddCustomValue = NumberValue
		CreatureHoverRange = 24
	AddCustomValue = NumberValue
		CreatureAttackRange = 20
	AddCustomValue = NumberValue
		CreatureBiteReach = 20
	AddCustomValue = NumberValue
		CreaturePackRange = 400
	AddCustomValue = NumberValue
		CreatureChaseRange = 1000
	Turret = Turret
		CopyOf = Shade Heart
		ParentOffset = Vector
			X = 0
			Y = -4
	MaxHealth = 100
	Health = 100
	Organic = 0
	ImpulseDamageThreshold = 3000
	Perceptiveness = 1
	CharHeight = 28
	LFootGroup = AtomGroup
		CopyOf = Crab Foot
	RFootGroup = AtomGroup
		CopyOf = Crab Foot
	GibImpulseLimit = 3000
	GibWoundLimit = 8
