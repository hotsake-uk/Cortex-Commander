///////////////////////////////////////////////////////////////////////
// Flame Fiend (CR-7). A creature of fire on two legs, half as big again as a soldier: its body is FlameFiendBody.ini (generated by
// Tools/make_flame_fiend.py), placeholder art until its own is drawn. Fire doesn't catch on it and it wades lava; the ground and anyone
// not of its side close to it catch fire (FireAuraRadius); it throws gouts of flame at what it hunts; it glows in the dark; and deep
// water douses it, killing it in about five seconds (WaterWeakness).


// Its flames: the napalm flamer's burning tongues, sparing its own side (Flame.lua's TeamAware).

AddEffect = MOSParticle
	CopyOf = Flame Hurt Short
	PresetName = Fiend Flame
	LifeTime = 2500
	AddCustomValue = NumberValue
		TeamAware = 1


AddAmmo = Round
	PresetName = Round Fiend Flame
	ParticleCount = 2
	Particle = MOSParticle
		CopyOf = Fiend Flame
	Shell = None
	FireVelocity = 15
	Separation = 3


AddDevice = HDFirearm
	PresetName = Fiend Flames
	Description = "The fire a Flame Fiend throws from its claws. It comes with the fiend."
	AddToGroup = Weapons - Natural
	Buyable = 0
	Mass = 1
	HitsMOs = 0
	GetsHitByMOs = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Null.png
	FrameCount = 1
	AtomGroup = AtomGroup
		CopyOf = Null AtomGroup
	DeepCheck = 0
	JointStrength = 10000
	JointStiffness = 0.5
	JointOffset = Vector
		X = 0
		Y = 0
	StanceOffset = Vector
		X = 9
		Y = 3
	SharpStanceOffset = Vector
		X = 12
		Y = -3
	SupportOffset = Vector
		X = 3
		Y = 3
	DeleteWhenRemovedFromParent = 1
	DrawAfterParent = 1
	SharpLength = 0
	Magazine = Magazine
		PresetName = Magazine Fiend Flames
		Mass = 0
		SpriteFile = ContentFile
			FilePath = Base.rte/Null.png
		AtomGroup = AtomGroup
			CopyOf = Null AtomGroup
		JointStrength = 200
		JointStiffness = 1
		RoundCount = -1
		RegularRound = Round
			CopyOf = Round Fiend Flame
		Discardable = 0
	FireSound = SoundContainer
		CopyOf = Explosion Sweetener Fire
	RateOfFire = 420
	ReloadTime = 0
	FullAuto = 1
	FireIgnoresThis = 1
	ShakeRange = 0
	SharpShakeRange = 0
	NoSupportFactor = 0
	ParticleSpreadRange = 6
	MuzzleOffset = Vector
		X = 4
		Y = 0


AddActor = AHuman
	CopyOf = Flame Fiend Body
	PresetName = Flame Fiend
	Description = "A hulking creature of living fire. Sets the ground and anyone near it alight, throws fire at what it hunts and walks through lava. Water is the only thing it fears."
	AddToGroup = Actors - Creatures
	GoldValue = 200
	Buyable = 1
	Mass = 80
	MaxHealth = 220
	Health = 220
	ImpulseDamageThreshold = 4000
	PainSound = SoundContainer
		CopyOf = Flesh Torso Impact
	DeathSound = SoundContainer
		CopyOf = Explosion Sweetener Fire
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	StrideSound = SoundContainer
		CopyOf = Footstep Light Generic
	ScriptPath = Base.rte/AI/HumanAI.lua
	// What its body can do (the movement profile): fire doesn't catch on it and it is routed through lava; it doesn't swim, and doesn't
	// breathe (it dies of the water long before it would drown).
	FireProof = 1
	Swims = Never
	BreathSeconds = 0
	SafeFallHeight = 200
	LegJumpHeight = 40
	// Its elements (CR-7): it sets alight what is within 30 px of it, and loses a fifth of its full health a second deep in water.
	FireAuraRadius = 30
	WaterWeakness = 0.2
	// How it hunts (CreatureBehaviors.ChargeTarget): it walks at its prey and lets it have its fire from 110 px, and joins a packmate's
	// hunt within 400 px.
	AddCustomValue = NumberValue
		CreatureAttackRange = 110
	AddCustomValue = NumberValue
		CreatureChaseRange = 900
	AddCustomValue = NumberValue
		CreaturePackRange = 400
	AddInventory = HDFirearm
		CopyOf = Fiend Flames
	GibImpulseLimit = 5000
	GibWoundLimit = 12
	GibSound = SoundContainer
		CopyOf = Explosion Sweetener Fire
	// It bursts into flame and embers.
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Fire Puff Large
		Count = 4
		MinVelocity = 2
		MaxVelocity = 8
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Fiend Flame
		Count = 8
		MinVelocity = 3
		MaxVelocity = 12
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Flesh Small B
		Offset = Vector
			X = -3
			Y = -4
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Flesh Small D
		Offset = Vector
			X = 2
			Y = -12
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Bone Small B
		Offset = Vector
			X = 0
			Y = -8
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Flesh Tiny A
		Count = 4
