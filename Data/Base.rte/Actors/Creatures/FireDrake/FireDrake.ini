// Fire Drake (Bestiary III, the fliers). A drake of middling size, red-scaled (drawn by Tools/make_bestiary.py; three frames, a wing
// beat), smaller and quicker than the Wyvern. It holds in the air off its prey (CreatureBehaviors.FlyHunt, Hover) and breathes fire on it
// (the Flame Fiend's flames, which spare its own side), and bites what comes close. Fire doesn't catch on it. It tires and lands to rest.


AddDevice = HDFirearm
	CopyOf = Fiend Flames
	PresetName = Fire Drake Breath
	Description = "The fire a drake breathes. It comes with the drake."
	MuzzleOffset = Vector
		X = 8
		Y = 0


AddEffect = MOPixel
	CopyOf = Particle Hound Bite
	PresetName = Particle Drake Bite
	WoundDamageMultiplier = 3


AddAmmo = Round
	PresetName = Round Drake Bite
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Drake Bite
	Shell = None
	FireVelocity = 32
	Separation = 4


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Drake Jaws
	Description = "A drake's jaws. They come with the drake."
	SharpLength = 36
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Drake Jaws
		RegularRound = Round
			CopyOf = Round Drake Bite
	RateOfFire = 90
	MuzzleOffset = Vector
		X = 6
		Y = 2


