///////////////////////////////////////////////////////////////////////
// Treant (Bestiary II). A walking tree twice a soldier's height on the Civilian's rig (TreantBody.ini, made by Tools/make_bestiary.py; its
// flesh is the Wood material, which burns, its wounds dry, and it falls to planks and splinters). Very slow (SpeedMultiplier), with bark
// that turns some of the harm (a PassiveEffect, SE-1). It fights with its roots: a blow that holds whoever it lands on fast for two seconds
// (Shared/Grab.lua). Standing in water it drinks, and its wounds close (Treant.lua).


AddAmmo = Round
	PresetName = Round Treant Roots
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Scorpion Grab
		PresetName = Particle Treant Root
		WoundDamageMultiplier = 2.5
		AddCustomValue = NumberValue
			GrabSeconds = 2
	Shell = None
	FireVelocity = 26
	Separation = 4


AddDevice = HDFirearm
	CopyOf = Ogre Club
	PresetName = Treant Roots
	Description = "A treant's roots, that lash out and hold. They come with the treant."
	Magazine = Magazine
		CopyOf = Magazine Ogre Club
		PresetName = Magazine Treant Roots
		RegularRound = Round
			CopyOf = Round Treant Roots
	RateOfFire = 40


AddActor = AHuman
	CopyOf = Treant Body
	PresetName = Treant
	Description = "A tree that walks, twice a man's height, in bark and moss. Slow as the seasons, but its roots lash out and hold whoever they catch, its bark turns blades, and standing in water its wounds close. It is wood, and wood burns."
	AddToGroup = Actors - Creatures
	GoldValue = 230
	Buyable = 1
	Mass = 320
	MaxHealth = 420
	Health = 420
	ImpulseDamageThreshold = 8000
	PainSound = SoundContainer
		CopyOf = Bone Crack
	DeathSound = SoundContainer
		CopyOf = Bone Crack
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	StrideSound = SoundContainer
		CopyOf = Footstep Light Generic
	ScriptPath = Base.rte/AI/HumanAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Trample.lua
	ScriptPath = Base.rte/Actors/Creatures/Treant/Treant.lua
	BodyWidth = 40
	BodyHeight = 96
	Swims = Never
	BreathSeconds = 0
	SafeFallHeight = 300
	LegJumpHeight = 12
	// Half a man's pace.
	SpeedMultiplier = 0.5
	// Its bark (SE-1): it takes 85% of the harm, for good.
	PassiveEffect = StatusEffect
		Name = Bark
		Label = Bark
		DamageTakenMultiplier = 0.85
	// How it hunts (CreatureBehaviors.ChargeTarget): it walks at its prey and lashes from 46 px, alone, and gives up past 600 px.
	AddCustomValue = NumberValue
		CreatureAttackRange = 46
	AddCustomValue = NumberValue
		CreatureChaseRange = 600
	AddCustomValue = NumberValue
		CreaturePackRange = 0
	// Its trample (Shared/Trample.lua): going faster than 1.5 m/s it shoulders aside units of up to 140 kg within 30 px in front of it.
	AddCustomValue = NumberValue
		TrampleSpeed = 1.5
	AddCustomValue = NumberValue
		TrampleMass = 140
	AddCustomValue = NumberValue
		TrampleReach = 30
	// Its drinking (Treant.lua): with its feet in water, three health a second back.
	AddCustomValue = NumberValue
		TreantDrinkRate = 3
	AddInventory = HDFirearm
		CopyOf = Treant Roots
	GibImpulseLimit = 9000
	GibWoundLimit = 22
	GibSound = SoundContainer
		CopyOf = Bone Crack
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Wood Splinter
		Count = 24
		MinVelocity = 2
		MaxVelocity = 10
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Wood Plank A
		Offset = Vector
			X = -4
			Y = -8
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Wood Plank B
		Offset = Vector
			X = 4
			Y = -20
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Wood Plank C
		Offset = Vector
			X = 0
			Y = -32
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Wood Plank A
		Offset = Vector
			X = 2
			Y = -12
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Wood Plank B
		Offset = Vector
			X = -2
			Y = -24
