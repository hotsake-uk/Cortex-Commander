// Ogre (phase 3). A brute on two legs, twice a soldier's size: its body is OgreBody.ini (generated by Tools/make_ogre.py), placeholder
// art until its own is drawn. It walks at its prey and swings a club that knocks units back and onto the ground (Shared/Club.lua, D11),
// and going at speed it shoulders small units out of its way (Shared/Trample.lua).


// The club's blow: a few heavy, blunt particles in a short arc in front of it, each knocking whoever it strikes off its feet.

AddEffect = MOPixel
	PresetName = Particle Ogre Club
	Mass = 0.6
	WoundDamageMultiplier = 3
	RestThreshold = 500
	LifeTime = 60
	Sharpness = 15
	HitsMOs = 1
	GetsHitByMOs = 0
	ScriptPath = Base.rte/Actors/Creatures/Shared/Club.lua
	Color = Color
		R = 255
		G = 0
		B = 255
	Atom = Atom
		Material = Material
			CopyOf = Bullet Metal
		TrailLength = 0
	AddCustomValue = NumberValue
		ClubSpeed = 9
	AddCustomValue = NumberValue
		ClubMass = 200


AddAmmo = Round
	PresetName = Round Ogre Club
	ParticleCount = 4
	Particle = MOPixel
		CopyOf = Particle Ogre Club
	Shell = None
	FireVelocity = 30
	Separation = 4


AddDevice = HDFirearm
	PresetName = Ogre Club
	Description = "A log an ogre swings. It comes with the ogre."
	AddToGroup = Weapons - Natural
	Buyable = 0
	Mass = 6
	HitsMOs = 0
	GetsHitByMOs = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Ogre/OgreClub.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -4
		Y = -5
	AtomGroup = AtomGroup
		CopyOf = Null AtomGroup
	DeepCheck = 0
	JointStrength = 10000
	JointStiffness = 0.5
	JointOffset = Vector
		X = 0
		Y = 0
	StanceOffset = Vector
		X = 12
		Y = 4
	SharpStanceOffset = Vector
		X = 16
		Y = -4
	SupportOffset = Vector
		X = 4
		Y = 4
	DeleteWhenRemovedFromParent = 1
	DrawAfterParent = 1
	SharpLength = 0
	Magazine = Magazine
		PresetName = Magazine Ogre Club
		Mass = 0
		SpriteFile = ContentFile
			FilePath = Base.rte/Null.png
		AtomGroup = AtomGroup
			CopyOf = Null AtomGroup
		JointStrength = 200
		JointStiffness = 1
		RoundCount = -1
		RegularRound = Round
			CopyOf = Round Ogre Club
		Discardable = 0
	FireSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	RateOfFire = 50
	ReloadTime = 0
	FullAuto = 1
	FireIgnoresThis = 1
	ShakeRange = 0
	SharpShakeRange = 0
	NoSupportFactor = 0
	ParticleSpreadRange = 25
	MuzzleOffset = Vector
		X = 24
		Y = 0


AddActor = AHuman
	CopyOf = Ogre Body
	PresetName = Ogre
	Description = "A hulking brute twice a man's height. It swings a club that sends people flying and barges through anyone small in its way."
	AddToGroup = Actors - Creatures
	GoldValue = 220
	Buyable = 1
	Mass = 160
	MaxHealth = 400
	Health = 400
	ImpulseDamageThreshold = 6000
	PainSound = SoundContainer
		CopyOf = Flesh Torso Impact
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	StrideSound = SoundContainer
		CopyOf = Footstep Light Generic
	ScriptPath = Base.rte/AI/HumanAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Trample.lua
	// What its body can do (the movement profile): about 40 px across and 96 tall, so it is routed round gaps it won't fit; it wades
	// rather than swims, and drops two storeys unhurt.
	BodyWidth = 40
	BodyHeight = 96
	Swims = Never
	BreathSeconds = 30
	SafeFallHeight = 200
	LegJumpHeight = 30
	// How it hunts (CreatureBehaviors.ChargeTarget): it walks at its prey and swings from 40 px, and joins a packmate's hunt within 400 px.
	AddCustomValue = NumberValue
		CreatureAttackRange = 40
	AddCustomValue = NumberValue
		CreatureChaseRange = 900
	AddCustomValue = NumberValue
		CreaturePackRange = 400
	// Its trample (Shared/Trample.lua): going faster than 2 m/s it shoulders aside units of up to 150 kg within 30 px in front of it.
	AddCustomValue = NumberValue
		TrampleSpeed = 2
	AddCustomValue = NumberValue
		TrampleMass = 150
	AddCustomValue = NumberValue
		TrampleReach = 30
	AddInventory = HDFirearm
		CopyOf = Ogre Club
	GibImpulseLimit = 9000
	GibWoundLimit = 20
	GibSound = SoundContainer
		CopyOf = Flesh Torso Gib
	// It bursts into flesh and bone.
	AddGib = Gib
		GibParticle = MOPixel
			CopyOf = Drop Blood
		Count = 24
		MinVelocity = 2
		MaxVelocity = 10
	AddGib = Gib
		GibParticle = MOSParticle
