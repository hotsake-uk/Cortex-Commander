///////////////////////////////////////////////////////////////////////
// Bear (Bestiary I). The Hound's rig near twice the size (BearBody.ini, made by Tools/make_bestiary.py), in brown fur: slow, very tough,
// and it swipes with its claws (a short arc of heavy blows that knock a man off his feet, Shared/Club.lua) rather than bites. A loner:
// it joins no pack. Big enough that the path grid routes it round gaps it won't fit (BodyWidth, BodyHeight), and at a run it shoulders
// units aside (Shared/Trample.lua).


AddAmmo = Round
	PresetName = Round Bear Swipe
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Ogre Club
		PresetName = Particle Bear Claw
		WoundDamageMultiplier = 3.5
		LifeTime = 45
		AddCustomValue = NumberValue
			ClubSpeed = 7
		AddCustomValue = NumberValue
			ClubMass = 160
	Shell = None
	FireVelocity = 28
	Separation = 4


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Bear Claws
	Description = "A bear's claws. They come with the bear."
	SharpLength = 60
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Bear Claws
		RegularRound = Round
			CopyOf = Round Bear Swipe
	RateOfFire = 70
	ParticleSpreadRange = 20
	MuzzleOffset = Vector
		X = 8
		Y = 2


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Bear Head
	MountedDevice = HDFirearm
		CopyOf = Bear Claws
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	CopyOf = Bear Body
	PresetName = Bear
	Description = "A brown bear, as big as a cart and as heavy. It walks at what it hunts and swipes it off its feet with claws that open a man up. Very hard to kill."
	AddToGroup = Actors - Creatures
	GoldValue = 220
	Buyable = 1
	ScriptPath = Base.rte/AI/CrabAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Trample.lua
	Mass = 200
	MaxHealth = 350
	Health = 350
	ImpulseDamageThreshold = 5000
	// What its body can do (the movement profile): about 48 px across and 36 tall, so it is routed round gaps it won't fit.
	BodyWidth = 48
	BodyHeight = 36
	// How it hunts (CreatureBehaviors.lua): swipes within 40 px, never leaps, joins no pack, gives up past 800 px.
	AddCustomValue = NumberValue
		CreatureBiteReach = 40
	AddCustomValue = NumberValue
		CreaturePounceRange = 0
	AddCustomValue = NumberValue
		CreaturePackRange = 0
	AddCustomValue = NumberValue
		CreatureChaseRange = 800
	// Its trample (Shared/Trample.lua): going faster than 2.5 m/s it shoulders aside units of up to 150 kg within 36 px in front of it.
	AddCustomValue = NumberValue
		TrampleSpeed = 2.5
	AddCustomValue = NumberValue
		TrampleMass = 150
	AddCustomValue = NumberValue
		TrampleReach = 36
	Turret = Turret
		CopyOf = Bear Head
		ParentOffset = Vector
			X = 18
			Y = -9
