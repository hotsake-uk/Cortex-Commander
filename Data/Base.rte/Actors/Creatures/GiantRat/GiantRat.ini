///////////////////////////////////////////////////////////////////////
// Giant Rat (Bestiary I). The Hound's rig at half size (GiantRatBody.ini, made by Tools/make_bestiary.py): a dog-sized rat, fast, weak,
// in swarms of eight (SpawnGroup: one click of the sandbox's Unit tool puts the whole swarm down). Its bite is slight but carries disease
// (Shared/Venom.lua: a mild, slowing poison), and a rat left with fewer than three of its kind near it breaks off and runs
// (CreatureBehaviors.lua, CreatureFleeBelow).


AddAmmo = Round
	PresetName = Round Giant Rat Bite
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Hound Bite
		PresetName = Particle Giant Rat Bite
		WoundDamageMultiplier = 1.5
		ScriptPath = Base.rte/Actors/Creatures/Shared/Venom.lua
		AddCustomValue = NumberValue
			VenomDamage = 1
		AddCustomValue = NumberValue
			VenomSeconds = 3
		AddCustomValue = NumberValue
			VenomSlow = 0.85
	Shell = None
	FireVelocity = 28
	Separation = 2


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Giant Rat Jaws
	Description = "A rat's teeth. They come with the rat."
	SharpLength = 20
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Giant Rat Jaws
		RegularRound = Round
			CopyOf = Round Giant Rat Bite
	RateOfFire = 140
	MuzzleOffset = Vector
		X = 2
		Y = 0.5


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Giant Rat Head
	MountedDevice = HDFirearm
		CopyOf = Giant Rat Jaws
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	CopyOf = Giant Rat Body
	PresetName = Giant Rat
	Description = "A rat the size of a dog. They come in swarms of eight: quick, easily killed, and their bites fester. A rat left with few of its kind runs."
	AddToGroup = Actors - Creatures
	GoldValue = 15
	Buyable = 1
	ScriptPath = Base.rte/AI/CrabAI.lua
	Mass = 8
	MaxHealth = 25
	Health = 25
	Perceptiveness = 0.7
	// A swarm (SandboxWorld::SpawnUnits): one placed is eight.
	AddCustomValue = NumberValue
		SpawnGroup = 8
	// How it hunts (CreatureBehaviors.lua): bites within 16 px, leaps at prey within 80 px, joins a packmate's hunt within 300 px, gives
	// up past 600 px, and runs when fewer than three rats are with it.
	AddCustomValue = NumberValue
		CreatureBiteReach = 16
	AddCustomValue = NumberValue
		CreaturePounceRange = 80
	AddCustomValue = NumberValue
		CreaturePackRange = 300
	AddCustomValue = NumberValue
		CreatureChaseRange = 600
	AddCustomValue = NumberValue
		CreatureFleeBelow = 3
	Turret = Turret
		CopyOf = Giant Rat Head
		ParentOffset = Vector
			X = 5
			Y = -2.5
