///////////////////////////////////////////////////////////////////////
// Frost Drake (Bestiary III, the fliers). The Fire Drake's cold twin, in ice-blue scales (drawn by Tools/make_bestiary.py). Its breath is
// a cone of freezing mist (Shared/Chill.lua): whoever it touches is Chilled, slowed to six tenths of their pace and drawn frosted over,
// for four seconds. Unlike the Fire Drake it is not fire-proof: fire catches on it as on anything.


AddEffect = MOPixel
	PresetName = Particle Frost Breath
	Mass = 0.05
	Sharpness = 2
	HitsMOs = 1
	GetsHitByMOs = 0
	GlobalAccScalar = 0.1
	AirResistance = 0.06
	LifeTime = 450
	RestThreshold = 500
	ScriptPath = Base.rte/Actors/Creatures/Shared/Chill.lua
	Color = Color
		R = 200
		G = 230
		B = 255
	Atom = Atom
		Material = Material
			CopyOf = Bullet Metal
		TrailColor = Color
			R = 180
			G = 210
			B = 255
		TrailLength = 6
	AddCustomValue = NumberValue
		ChillSeconds = 4
	AddCustomValue = NumberValue
		ChillSpeed = 0.6


AddAmmo = Round
	PresetName = Round Frost Breath
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Frost Breath
	Shell = None
	FireVelocity = 15
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Fiend Flames
	PresetName = Frost Drake Breath
	Description = "The freezing mist a frost drake breathes. It comes with the drake."
	Magazine = Magazine
		CopyOf = Magazine Fiend Flames
		PresetName = Magazine Frost Breath
		RegularRound = Round
			CopyOf = Round Frost Breath
	MuzzleOffset = Vector
		X = 8
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Frost Drake Head
	MountedDevice = HDFirearm
		CopyOf = Frost Drake Breath
		ParentOffset = Vector
			X = 0
			Y = 0
	AddMountedDevice = HDFirearm
		CopyOf = Drake Jaws
		ParentOffset = Vector
			X = 0
			Y = 2


AddActor = ACrab
	CopyOf = Fire Drake
	PresetName = Frost Drake
	Description = "A drake in ice-blue scales, the fire drake's cold twin. It holds in the air off its prey and breathes freezing mist that slows whoever it touches to a crawl. Fire catches on it as on anything."
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/FrostDrake/FrostDrakeBodyA.png
	FrameCount = 3
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Armoured Flesh
		Resolution = 4
		Depth = 0
	FireProof = 0
	Turret = Turret
		CopyOf = Frost Drake Head
		ParentOffset = Vector
			X = 24
			Y = -7
