///////////////////////////////////////////////////////////////////////
// Dire Wolf (Bestiary I). The pack's alpha: the Hound's rig a third bigger again (DireWolfBody.ini, made by Tools/make_bestiary.py), in
// black fur, tougher, with a worse bite, and when it leaps at its prey (CreaturePounceRange) it bowls over whoever it lands on
// (Shared/Trample.lua, going faster than 4 m/s). Hunts in packs with the wolves (CreatureBehaviors.lua).


AddAmmo = Round
	PresetName = Round Dire Wolf Bite
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Hound Bite
		PresetName = Particle Dire Wolf Bite
		WoundDamageMultiplier = 3.5
	Shell = None
	FireVelocity = 34
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Dire Wolf Jaws
	Description = "A dire wolf's teeth. They come with the wolf."
	SharpLength = 52
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Dire Wolf Jaws
		RegularRound = Round
			CopyOf = Round Dire Wolf Bite
	MuzzleOffset = Vector
		X = 5
		Y = 1


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Dire Wolf Head
	MountedDevice = HDFirearm
		CopyOf = Dire Wolf Jaws
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	CopyOf = Dire Wolf Body
	PresetName = Dire Wolf
	Description = "A black wolf half again the size of the grey ones, the alpha of its pack. It leaps at its prey and knocks it flat, and its bite takes a lot out of a man."
	AddToGroup = Actors - Creatures
	GoldValue = 110
	Buyable = 1
	ScriptPath = Base.rte/AI/CrabAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Trample.lua
	MaxHealth = 160
	Health = 160
	Perceptiveness = 1
	// How it hunts (CreatureBehaviors.lua): bites within 32 px, leaps at prey within 170 px, joins a packmate's hunt within 450 px.
	AddCustomValue = NumberValue
		CreatureBiteReach = 32
	AddCustomValue = NumberValue
		CreaturePounceRange = 170
	AddCustomValue = NumberValue
		CreaturePackRange = 450
	AddCustomValue = NumberValue
		CreatureChaseRange = 1000
	// Its pounce (Shared/Trample.lua): going faster than 4 m/s it bowls over units of up to 120 kg within 26 px in front of it.
	AddCustomValue = NumberValue
		TrampleSpeed = 4
	AddCustomValue = NumberValue
		TrampleMass = 120
	AddCustomValue = NumberValue
		TrampleReach = 26
	Turret = Turret
		CopyOf = Dire Wolf Head
		ParentOffset = Vector
			X = 13
			Y = -6.5
