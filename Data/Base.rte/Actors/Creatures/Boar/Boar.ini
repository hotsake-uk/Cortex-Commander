///////////////////////////////////////////////////////////////////////
// Boar (Bestiary I). A wild boar: the Hound's rig a tenth bigger (BoarBody.ini, made by Tools/make_bestiary.py), low and bristly. It
// doesn't leap; it charges (CreatureBehaviors.lua, CreatureChargeRange: a burst of speed at its prey when it is close, level and in the
// open), tramples whoever it runs into (Shared/Trample.lua) and gores with its tusks.


AddAmmo = Round
	PresetName = Round Boar Gore
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Hound Bite
		PresetName = Particle Boar Tusk
		WoundDamageMultiplier = 3
		Sharpness = 160
	Shell = None
	FireVelocity = 32
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Boar Tusks
	Description = "A boar's tusks. They come with the boar."
	SharpLength = 36
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Boar Tusks
		RegularRound = Round
			CopyOf = Round Boar Gore
	RateOfFire = 90
	MuzzleOffset = Vector
		X = 5
		Y = 2


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Boar Head
	MountedDevice = HDFirearm
		CopyOf = Boar Tusks
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	CopyOf = Boar Body
	PresetName = Boar
	Description = "A wild boar, low, heavy and bad-tempered. It charges whatever it hunts, tramples it flat and gores it with its tusks."
	AddToGroup = Actors - Creatures
	GoldValue = 90
	Buyable = 1
	ScriptPath = Base.rte/AI/CrabAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Trample.lua
	Mass = 70
	MaxHealth = 140
	Health = 140
	// How it hunts (CreatureBehaviors.lua): gores within 28 px, charges prey within 240 px (a burst of 9 m/s, every 3 s), never leaps,
	// joins a packmate's hunt within 300 px.
	AddCustomValue = NumberValue
		CreatureBiteReach = 28
	AddCustomValue = NumberValue
		CreaturePounceRange = 0
	AddCustomValue = NumberValue
		CreatureChargeRange = 240
	AddCustomValue = NumberValue
		CreatureChargeSpeed = 9
	AddCustomValue = NumberValue
		CreatureChargeCooldown = 3000
	AddCustomValue = NumberValue
		CreaturePackRange = 300
	AddCustomValue = NumberValue
		CreatureChaseRange = 900
	// Its trample (Shared/Trample.lua): going faster than 5 m/s it bowls over units of up to 160 kg within 28 px in front of it.
	AddCustomValue = NumberValue
		TrampleSpeed = 5
	AddCustomValue = NumberValue
		TrampleMass = 160
	AddCustomValue = NumberValue
		TrampleReach = 28
	Turret = Turret
		CopyOf = Boar Head
		ParentOffset = Vector
			X = 11
			Y = -5.5
