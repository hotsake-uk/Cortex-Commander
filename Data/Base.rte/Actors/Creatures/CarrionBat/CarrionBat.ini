///////////////////////////////////////////////////////////////////////
// Carrion Bat (phase 4, C8). A small flier on leathery wings that comes in swarms: it hangs from ceilings while on guard, dives on its
// prey and bites, pulls away and comes round again, and scatters for a moment when hurt. It tires after a while in the air and perches on a
// ceiling to rest. Placeholder art drawn by Tools/make_placeholders.py: three frames, a wing beat.


AddEffect = MOPixel
	CopyOf = Particle Hound Bite
	PresetName = Particle Bat Bite
	WoundDamageMultiplier = 1.5


AddAmmo = Round
	PresetName = Round Bat Bite
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Bat Bite
	Shell = None
	FireVelocity = 30
	Separation = 2


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Bat Teeth
	Description = "A carrion bat's teeth. They come with the bat."
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Bat Teeth
		RegularRound = Round
			CopyOf = Round Bat Bite
	RateOfFire = 160
	MuzzleOffset = Vector
		X = 3
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Bat Head
	MountedDevice = HDFirearm
		CopyOf = Bat Teeth
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	PresetName = Carrion Bat
	Description = "A carrion bat. They come in swarms: they hang from ceilings in wait, dive on their prey to bite, and scatter when hurt."
	AddToGroup = Actors - Creatures
	GoldValue = 30
	Buyable = 1
	Mass = 6
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/CarrionBat/CarrionBatBodyA.png
	FrameCount = 3
	SpriteAnimMode = 0
	SpriteOffset = Vector
		X = -15
		Y = -9
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Flesh
		Resolution = 3
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	DeathSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PassengerSlots = 0
	// What its body can do (the movement profile): 16 px across and tall for the routes it flies (its wings fold through a gap); it flies
	// on its wings at 8 m/s for 25 seconds before it must rest, and roosts hanging from ceilings.
	BodyWidth = 16
	BodyHeight = 14
	Flies = Wings
	FlySpeed = 8
	FlyStamina = 25
	Climbs = WallsAndCeilings
	CrawlSpeed = 1
	Swims = Never
	BreathSeconds = 10
	SafeFallHeight = 400
	AimRangeUpperLimit = 1.5
	AimRangeLowerLimit = 1.5
	// How it hunts (CreatureBehaviors.FlyHunt): dives at prey within 180 px, bites within 16 px, scatters when hurt, joins a packmate's hunt
	// within 500 px, and hangs from a ceiling over its post while on guard.
	AddCustomValue = StringValue
		CreatureFlyAttack = Dive
	AddCustomValue = NumberValue
		CreatureDiveRange = 180
	AddCustomValue = NumberValue
		CreatureBiteReach = 16
	AddCustomValue = NumberValue
		CreatureScatters = 1
	AddCustomValue = NumberValue
		CreaturePackRange = 500
	AddCustomValue = NumberValue
		CreatureChaseRange = 900
	AddCustomValue = NumberValue
		CreatureLurks = 1
	AddCustomValue = NumberValue
		CreatureLurkHeight = 250
	Turret = Turret
		CopyOf = Bat Head
		ParentOffset = Vector
			X = 3
			Y = 0
	MaxHealth = 40
	Health = 40
	Organic = 1
	ImpulseDamageThreshold = 1500
	Perceptiveness = 0.9
	CharHeight = 18
	// (No legs, but a crab's body still keeps foot groups.)
	LFootGroup = AtomGroup
		CopyOf = Crab Foot
	RFootGroup = AtomGroup
		CopyOf = Crab Foot
	GibImpulseLimit = 1500
	GibWoundLimit = 4
	GibSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	// It bursts into blood and bits of wing.
	AddGib = Gib
		GibParticle = MOPixel
			CopyOf = Drop Blood
		Count = 6
		MinVelocity = 1
		MaxVelocity = 6
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Flesh Tiny A
		Count = 2
		MinVelocity = 1
		MaxVelocity = 4
