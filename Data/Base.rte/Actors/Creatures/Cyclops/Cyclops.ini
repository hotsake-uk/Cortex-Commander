///////////////////////////////////////////////////////////////////////
// Cyclops (Bestiary II). The biggest of them: a one-eyed giant more than twice a soldier's size on the Civilian's rig (CyclopsBody.ini,
// made by Tools/make_bestiary.py) in weathered tan. It heaves boulders bigger than the troll's at prey it can't reach (the troll's
// CaveTroll/TrollThrow.lua, told what rock to throw; Boulder.lua on the rock), stomps whoever it walks into (Shared/Trample.lua) and swings
// a club up close (Shared/Club.lua). It has one eye: hurt below half its health it sees half as far (Cyclops.lua).


AddEffect = MOSRotating
	CopyOf = Troll Boulder
	PresetName = Cyclops Boulder
	Mass = 45
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Cyclops/CyclopsBoulder.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -11
		Y = -11
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Stone
		Resolution = 4
		Depth = 0
	// What it does to whoever it strikes (Boulder.lua): 45 health off, and knocked as a club of 11 m/s does.
	AddCustomValue = NumberValue
		BoulderDamage = 45
	AddCustomValue = NumberValue
		ClubSpeed = 11
	AddCustomValue = NumberValue
		ClubMass = 300
	GibImpulseLimit = 4000


AddAmmo = Round
	PresetName = Round Cyclops Club
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Ogre Club
		PresetName = Particle Cyclops Club
		WoundDamageMultiplier = 3.5
		LifeTime = 50
		AddCustomValue = NumberValue
			ClubSpeed = 11
		AddCustomValue = NumberValue
			ClubMass = 280
	Shell = None
	FireVelocity = 30
	Separation = 4


AddDevice = HDFirearm
	CopyOf = Ogre Club
	PresetName = Cyclops Club
	Description = "A cyclops' club, a whole tree. It comes with the cyclops."
	Magazine = Magazine
		CopyOf = Magazine Ogre Club
		PresetName = Magazine Cyclops Club
		RegularRound = Round
			CopyOf = Round Cyclops Club
	RateOfFire = 40


AddActor = AHuman
	CopyOf = Cyclops Body
	PresetName = Cyclops
	Description = "A one-eyed giant, more than twice a man's height. It heaves boulders at whatever it can't reach, stomps whoever it walks into, and its club is a whole tree. Blind it half and it sees half as far."
	AddToGroup = Actors - Creatures
	GoldValue = 320
	Buyable = 1
	Mass = 260
	MaxHealth = 650
	Health = 650
	ImpulseDamageThreshold = 8000
	PainSound = SoundContainer
		CopyOf = Flesh Torso Impact
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	StrideSound = SoundContainer
		CopyOf = Footstep Light Generic
	ScriptPath = Base.rte/AI/HumanAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Trample.lua
	ScriptPath = Base.rte/Actors/Creatures/CaveTroll/TrollThrow.lua
	ScriptPath = Base.rte/Actors/Creatures/Cyclops/Cyclops.lua
	BodyWidth = 44
	BodyHeight = 106
	Swims = Never
	BreathSeconds = 30
	SafeFallHeight = 250
	LegJumpHeight = 26
	// How it hunts (CreatureBehaviors.ChargeTarget): it walks at its prey and swings from 48 px, alone, and gives up past 1000 px.
	AddCustomValue = NumberValue
		CreatureAttackRange = 48
	AddCustomValue = NumberValue
		CreatureChaseRange = 1000
	AddCustomValue = NumberValue
		CreaturePackRange = 0
	// Its stomp (Shared/Trample.lua): going faster than 2 m/s it bowls over units of up to 160 kg within 34 px in front of it.
	AddCustomValue = NumberValue
		TrampleSpeed = 2
	AddCustomValue = NumberValue
		TrampleMass = 160
	AddCustomValue = NumberValue
		TrampleReach = 34
	// Its boulders (TrollThrow.lua): Cyclops Boulders at prey it hunts between 120 and 520 px off, one every 5 s, lobbed at 26 m/s.
	AddCustomValue = NumberValue
		TrollThrowMin = 120
	AddCustomValue = NumberValue
		TrollThrowRange = 520
	AddCustomValue = NumberValue
		TrollThrowCooldown = 5000
	AddCustomValue = NumberValue
		TrollThrowSpeed = 26
	AddCustomValue = StringValue
		TrollThrowRock = Cyclops Boulder
	AddInventory = HDFirearm
		CopyOf = Cyclops Club
	GibImpulseLimit = 10000
	GibWoundLimit = 26
	GibSound = SoundContainer
		CopyOf = Flesh Torso Gib
	AddGib = Gib
