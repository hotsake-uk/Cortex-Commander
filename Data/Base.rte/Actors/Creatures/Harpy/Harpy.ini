///////////////////////////////////////////////////////////////////////
// Harpy (Bestiary III, the fliers). A winged thing the size of a soldier (drawn by Tools/make_bestiary.py; three frames, a wing beat)
// that swoops on its prey (CreatureBehaviors.FlyHunt, Dive) and takes it in its talons: the unit struck is held fast (Shared/Grab.lua)
// and, if it is light enough, snatched up and carried off as the harpy pulls away, then let fall (Shared/Carry.lua). It tires and lands
// to rest, and hunts with its kind.


AddAmmo = Round
	PresetName = Round Harpy Talons
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Scorpion Grab
		PresetName = Particle Harpy Talon
		WoundDamageMultiplier = 2
		AddCustomValue = NumberValue
			GrabSeconds = 2.5
	Shell = None
	FireVelocity = 30
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Harpy Talons
	Description = "A harpy's talons, that catch and hold. They come with the harpy."
	SharpLength = 24
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Harpy Talons
		RegularRound = Round
			CopyOf = Round Harpy Talons
	RateOfFire = 60
	MuzzleOffset = Vector
		X = 4
		Y = 2


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Harpy Head
	MountedDevice = HDFirearm
		CopyOf = Harpy Talons
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	PresetName = Harpy
	Description = "A screeching thing on leathery wings, the size of a soldier. It swoops on its prey, catches it in its talons, carries it up and lets it fall."
	AddToGroup = Actors - Creatures
	GoldValue = 140
	Buyable = 1
	Mass = 40
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Carry.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Harpy/HarpyBodyA.png
	FrameCount = 3
	SpriteAnimMode = 0
	SpriteOffset = Vector
		X = -22
		Y = -15
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Flesh
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Bone Crack
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	PassengerSlots = 0
	BodyWidth = 44
	BodyHeight = 30
	Flies = Wings
	FlySpeed = 7
	FlyStamina = 40
	Swims = Never
	BreathSeconds = 30
	SafeFallHeight = 400
	AimRangeUpperLimit = 1.5
	AimRangeLowerLimit = 1.5
	// How it hunts (CreatureBehaviors.FlyHunt): dives at prey in the open within 200 px, strikes within 22 px, joins a packmate's hunt
	// within 300 px, gives up past 1000 px.
	AddCustomValue = StringValue
		CreatureFlyAttack = Dive
	AddCustomValue = NumberValue
		CreatureDiveRange = 200
	AddCustomValue = NumberValue
		CreatureBiteReach = 22
	AddCustomValue = NumberValue
		CreaturePackRange = 300
	AddCustomValue = NumberValue
		CreatureChaseRange = 1000
	// Its carrying (Shared/Carry.lua): a held unit of up to 120 kg against it, for 2 s, no more than once in 5 s.
	AddCustomValue = NumberValue
		CarryMaxMass = 120
	AddCustomValue = NumberValue
		CarrySeconds = 2
	AddCustomValue = NumberValue
		CarryCooldown = 5000
	Turret = Turret
		CopyOf = Harpy Head
		ParentOffset = Vector
			X = 14
			Y = -2
	MaxHealth = 150
	Health = 150
	Organic = 1
	ImpulseDamageThreshold = 4000
	Perceptiveness = 0.9
	CharHeight = 32
	LFootGroup = AtomGroup
		CopyOf = Crab Foot
	RFootGroup = AtomGroup
		CopyOf = Crab Foot
	GibImpulseLimit = 5000
	GibWoundLimit = 10
	GibSound = SoundContainer
		CopyOf = Flesh Torso Gib
	AddGib = Gib
		GibParticle = MOPixel
			CopyOf = Drop Blood
		Count = 12
		MinVelocity = 2
		MaxVelocity = 10
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Flesh Small A
		Offset = Vector
			X = -6
			Y = 0
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Bone Small A
		Offset = Vector
			X = 6
			Y = 0
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Flesh Tiny A
		Count = 4
