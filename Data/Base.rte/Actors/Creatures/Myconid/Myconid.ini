///////////////////////////////////////////////////////////////////////
// Myconid (Bestiary II). A walking mushroom (drawn by Tools/make_bestiary.py), on no legs: it shuffles along floors as the Ooze crawls,
// slowly, and climbs nothing. With an enemy near it puffs clouds of toxic spores out of its cap (Spores.lua, the gas the Plague Pot
// makes), and its touch sickens (Shared/Venom.lua). Killed, it bursts and two sprouts crawl off (the Ooze's split, Ooze/OozeSplit.lua,
// told what to split into).


AddEffect = MOPixel
	CopyOf = Particle Hound Bite
	PresetName = Particle Myconid Spore Touch
	ScriptPath = Base.rte/Actors/Creatures/Shared/Venom.lua
	WoundDamageMultiplier = 1
	Color = Color
		R = 160
		G = 90
		B = 180
	AddCustomValue = NumberValue
		VenomDamage = 2
	AddCustomValue = NumberValue
		VenomSeconds = 4
	AddCustomValue = NumberValue
		VenomSlow = 0.9


AddAmmo = Round
	PresetName = Round Myconid Spore Touch
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Myconid Spore Touch
	Shell = None
	FireVelocity = 20
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Myconid Touch
	Description = "A myconid's spore-laden touch. It comes with the myconid."
	SharpLength = 20
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Myconid Touch
		RegularRound = Round
			CopyOf = Round Myconid Spore Touch
	FireSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	RateOfFire = 60
	MuzzleOffset = Vector
		X = 4
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Myconid Cap
	MountedDevice = HDFirearm
		CopyOf = Myconid Touch
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	PresetName = Myconid
	Description = "A mushroom that walks, slowly, on no legs. Come near and it puffs clouds of poison spores from its cap; its touch sickens; and killed, it bursts into two sprouts that shuffle on."
	AddToGroup = Actors - Creatures
	GoldValue = 100
	Buyable = 1
	Mass = 60
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Ooze/OozeSplit.lua
	ScriptPath = Base.rte/Actors/Creatures/Myconid/Spores.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Myconid/MyconidBodyA.png
	FrameCount = 2
	SpriteAnimMode = 4
	SpriteAnimDuration = 1200
	SpriteOffset = Vector
		X = -15
		Y = -13
	EntryWound = AEmitter
		CopyOf = Wound Dry Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Dry Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Flesh
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	PassengerSlots = 0
	// What its body can do (the movement profile): a shuffle along the floor, climbing nothing; it doesn't breathe.
	BodyWidth = 30
	BodyHeight = 26
	Climbs = None
	CrawlSpeed = 1
	Swims = Never
	BreathSeconds = 0
	SafeFallHeight = 300
	AimRangeUpperLimit = 1
	AimRangeLowerLimit = 1
	// How it hunts (CreatureBehaviors.lua): touches within 18 px, joins a packmate's hunt within 300 px, gives up past 500 px; it
	// spits nothing.
	AddCustomValue = NumberValue
		CreatureBiteReach = 18
	AddCustomValue = NumberValue
		CreaturePackRange = 300
	AddCustomValue = NumberValue
		CreatureChaseRange = 500
	AddCustomValue = NumberValue
		CreatureSpitRange = 0
	// Its spores (Spores.lua): with an enemy within 100 px, a cloud every 3 s.
	AddCustomValue = NumberValue
		SporeRange = 100
	AddCustomValue = NumberValue
		SporeCooldown = 3000
	AddCustomValue = NumberValue
		SporeAmount = 2.5
	// Killed, it splits once, into two Myconid Sprouts (OozeSplit.lua).
	AddCustomValue = NumberValue
		OozeSplits = 1
	AddCustomValue = StringValue
		OozeSplitInto = Myconid Sprout
	Turret = Turret
		CopyOf = Myconid Cap
		ParentOffset = Vector
			X = 6
			Y = 2
	MaxHealth = 120
	Health = 120
	Organic = 1
	ImpulseDamageThreshold = 5000
	Perceptiveness = 0.6
	CharHeight = 26
	LFootGroup = AtomGroup
		CopyOf = Crab Foot
	RFootGroup = AtomGroup
		CopyOf = Crab Foot
	GibImpulseLimit = 5000
	GibWoundLimit = 10
	GibSound = SoundContainer
		CopyOf = Flesh Torso Gib
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Flesh Tiny A
		Count = 10
		MinVelocity = 2
		MaxVelocity = 8
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Flesh Small A
		Count = 2
		MinVelocity = 1
		MaxVelocity = 5


AddActor = ACrab
	CopyOf = Myconid
	PresetName = Myconid Sprout
	Description = "A sprout off a myconid, half its size. It doesn't split again."
	Buyable = 0
	GoldValue = 0
	Mass = 25
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Myconid/MyconidSproutBodyA.png
	FrameCount = 2
	SpriteOffset = Vector
		X = -9
		Y = -8
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Flesh
		Resolution = 4
		Depth = 0
	BodyWidth = 18
	BodyHeight = 16
	Turret = Turret
		CopyOf = Myconid Cap
		ParentOffset = Vector
			X = 4
			Y = 1
	AddCustomValue = NumberValue
		OozeSplits = 0
	AddCustomValue = NumberValue
		SporeRange = 70
	AddCustomValue = NumberValue
		SporeAmount = 1.2
	MaxHealth = 50
	Health = 50
	CharHeight = 16
