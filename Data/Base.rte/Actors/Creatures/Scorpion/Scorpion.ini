		MaxVelocity = 10
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Bone Small A
		Offset = Vector
			X = -10
			Y = 0
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Bone Small B
