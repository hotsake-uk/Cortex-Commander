///////////////////////////////////////////////////////////////////////
// Scorpion (phase 3). A giant scorpion on six legs (the four that carry it and two extra, ACrab AddExtraLeg, CR-5), with an armoured
// plate over its front. It grabs with its pincers, holding its prey where it stands like a short web, and stings with its tail, a
// stronger venom than the spider's that doesn't slow. It doesn't climb. Placeholder art from Tools/make_placeholders.py: the Mega
// Crab's legs in sandy chitin, on a drawn body.


// The pincers: a grab (Shared/Grab.lua) holds whoever it strikes for 1.2 seconds.

AddEffect = MOPixel
	CopyOf = Particle Hound Bite
	PresetName = Particle Scorpion Grab
	ScriptPath = Base.rte/Actors/Creatures/Shared/Grab.lua
	WoundDamageMultiplier = 1.5
	AddCustomValue = NumberValue
		GrabSeconds = 1.2


AddAmmo = Round
	PresetName = Round Scorpion Grab
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Scorpion Grab
	Shell = None
	FireVelocity = 30
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Scorpion Pincers
	Description = "A giant scorpion's pincers, that grab and hold. They come with the scorpion."
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Scorpion/ScorpionPincer.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -3
		Y = -4
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Scorpion Pincers
		RegularRound = Round
			CopyOf = Round Scorpion Grab
	RateOfFire = 30
	MuzzleOffset = Vector
		X = 10
		Y = 0


// The sting: venom (Shared/Venom.lua), 8 health a second for 3 seconds, and no slowing.

AddEffect = MOPixel
	CopyOf = Particle Spider Venom Bite
	PresetName = Particle Scorpion Sting
	AddCustomValue = NumberValue
		VenomDamage = 8
	AddCustomValue = NumberValue
		VenomSeconds = 3
	AddCustomValue = NumberValue
		VenomSlow = 1


AddAmmo = Round
	PresetName = Round Scorpion Sting
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Scorpion Sting
	Shell = None
	FireVelocity = 34
	Separation = 2


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Scorpion Sting
	Description = "A giant scorpion's sting. It comes with the scorpion."
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Scorpion Sting
		RegularRound = Round
			CopyOf = Round Scorpion Sting
	RateOfFire = 50
	MuzzleOffset = Vector
		X = 4
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Scorpion Head
	MountedDevice = HDFirearm
		CopyOf = Scorpion Pincers
		ParentOffset = Vector
			X = 2
			Y = 2
	AddMountedDevice = HDFirearm
		CopyOf = Scorpion Sting
		ParentOffset = Vector
			X = -6
			Y = -10


// The plate over its front: thick chitin that turns bullets.

AddEffect = Attachable
	PresetName = Scorpion Plate
	Mass = 10
	HitsMOs = 1
	GetsHitByMOs = 1
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Scorpion/ScorpionPlate.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -5
		Y = -7
	EntryWound = AEmitter
		CopyOf = Dent Metal Light
	ExitWound = AEmitter
		CopyOf = Dent Metal Light
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Military Stuff
		Resolution = 2
		Depth = 0
	DeepCheck = 0
	JointStrength = 2000
	JointStiffness = 0.5
	DrawAfterParent = 1
	GibImpulseLimit = 5000
	GibWoundLimit = 20
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Bone Small A
		Count = 2
		MinVelocity = 2
		MaxVelocity = 6


AddEffect = Leg
	CopyOf = Spider Leg FG
	PresetName = Scorpion Leg FG
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Scorpion/ScorpionLegFGA.png
	FrameCount = 4


AddEffect = Leg
	CopyOf = Spider Leg BG
	PresetName = Scorpion Leg BG
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Scorpion/ScorpionLegBGA.png
	FrameCount = 4


AddActor = ACrab
	PresetName = Scorpion
	Description = "A scorpion the size of a cart, with a plate of chitin over its front. It grabs its prey in its pincers and stings it."
	AddToGroup = Actors - Creatures
	GoldValue = 160
	Buyable = 1
	Mass = 140
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Scorpion/ScorpionBodyA.png
	FrameCount = 2
	SpriteAnimMode = 4
	SpriteAnimDuration = 700
	SpriteOffset = Vector
		X = -24
		Y = -20
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Armoured Flesh
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Bone Crack
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	PassengerSlots = 0
	// What its body can do (the movement profile): about 56 px across and 34 tall; it walks the bottom of water, holding its breath for
	// a minute, and drops two storeys unhurt. It doesn't climb.
	BodyWidth = 56
	BodyHeight = 34
	Swims = Never
	BreathSeconds = 60
	SafeFallHeight = 200
	LegJumpHeight = 36
	LegJumpSpeed = 7
	AimRangeUpperLimit = 1
	AimRangeLowerLimit = 1
	// How it hunts (CreatureBehaviors.lua): grabs and stings within 30 px, leaps at prey within 100 px, and hunts alone.
	AddCustomValue = NumberValue
		CreatureBiteReach = 30
	AddCustomValue = NumberValue
		CreaturePounceRange = 100
	AddCustomValue = NumberValue
		CreaturePackRange = 0
	AddCustomValue = NumberValue
		CreatureChaseRange = 900
	Turret = Turret
		CopyOf = Scorpion Head
		ParentOffset = Vector
			X = 16
			Y = 0
	AddAttachable = Attachable
		CopyOf = Scorpion Plate
		ParentOffset = Vector
			X = 20
			Y = 2
	MaxHealth = 200
	Health = 200
	Organic = 1
	ImpulseDamageThreshold = 6000
	Perceptiveness = 0.8
	CharHeight = 46
	// The four that carry it...
