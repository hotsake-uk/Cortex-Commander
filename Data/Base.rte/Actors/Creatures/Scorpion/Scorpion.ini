	RWalkLimbPath = LimbPath
		CopyOf = Spider Walk Path Right
	RDislodgeLimbPath = LimbPath
		CopyOf = Spider Dislodge Path Right
	GibImpulseLimit = 9000
	GibWoundLimit = 16
	GibSound = SoundContainer
		CopyOf = Bone Crack
