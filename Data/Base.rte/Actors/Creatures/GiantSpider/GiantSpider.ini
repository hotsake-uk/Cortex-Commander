	// What its body can do (the movement profile): about 60 px across and 36 tall, so it is routed round gaps it won't fit; it walks the
	// bottom of water rather than swim, holding its breath for half a minute, and drops two storeys unhurt.
	BodyWidth = 60
	BodyHeight = 36
	Swims = Never
	BreathSeconds = 30
	SafeFallHeight = 200
	// Leaps: up onto ledges on the way, and at its prey (CreaturePounceRange). No climbing walls yet (plan step C10).
	LegJumpHeight = 48
	LegJumpSpeed = 8
	AimRangeUpperLimit = 1
	AimRangeLowerLimit = 1
