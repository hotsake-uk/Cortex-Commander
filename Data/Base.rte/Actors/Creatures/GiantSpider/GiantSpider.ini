// Giant Spider (CR-6). Placeholder art from Tools/make_placeholders.py: the Mega Crab's legs in glossy black, on a drawn body, until its
// own is drawn. Eight legs: the four that carry it, and four more that copy their strides half a step out (ACrab AddExtraLeg, CR-5).


// The bite: like a hound's, and venomous (Shared/Venom.lua): whoever it strikes loses 4 health a second for 4 seconds, walking at half
// pace meanwhile.

AddEffect = MOPixel
	CopyOf = Particle Hound Bite
	PresetName = Particle Spider Venom Bite
	ScriptPath = Base.rte/Actors/Creatures/Shared/Venom.lua
	Color = Color
		R = 120
		G = 224
		B = 64
	AddCustomValue = NumberValue
		VenomDamage = 4
	AddCustomValue = NumberValue
		VenomSeconds = 4
	AddCustomValue = NumberValue
		VenomSlow = 0.5


AddAmmo = Round
	PresetName = Round Spider Venom Bite
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Spider Venom Bite
	Shell = None
	FireVelocity = 32
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Spider Fangs
	Description = "A giant spider's fangs, dripping venom. They come with the spider."
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Spider Fangs
		RegularRound = Round
			CopyOf = Round Spider Venom Bite
	RateOfFire = 90
	MuzzleOffset = Vector
		X = 6
		Y = 4


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Spider Head
	MountedDevice = HDFirearm
		CopyOf = Spider Fangs
		ParentOffset = Vector
			X = 0
			Y = 0


// The web: a slow, sticky glob, spat when its prey is out of reach (CreatureBehaviors.SpitAt). Whoever it strikes has its legs held fast
