// Giant Centipede (Bestiary II). A centipede as long as a cart, on ten legs (the Spider's, reshaded by Tools/make_bestiary.py, which
// also draws its body). It runs up walls and along ceilings (Climbs), hangs there in wait and drops on whatever passes under
// (CreatureBehaviors.lua, CreatureLurks), and bites with venomous mandibles (Shared/Venom.lua). It doesn't leap and hunts alone.


AddEffect = MOPixel
	CopyOf = Particle Spider Venom Bite
	PresetName = Particle Centipede Venom Bite
	WoundDamageMultiplier = 1.5
	AddCustomValue = NumberValue
		VenomDamage = 5
	AddCustomValue = NumberValue
		VenomSeconds = 4
	AddCustomValue = NumberValue
		VenomSlow = 0.8


AddAmmo = Round
	PresetName = Round Centipede Bite
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Centipede Venom Bite
	Shell = None
	FireVelocity = 28
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Centipede Mandibles
	Description = "A giant centipede's mandibles, dripping venom. They come with the centipede."
	SharpLength = 30
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Centipede Mandibles
		RegularRound = Round
			CopyOf = Round Centipede Bite
	RateOfFire = 120
	MuzzleOffset = Vector
		X = 6
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Centipede Head
	MountedDevice = HDFirearm
		CopyOf = Centipede Mandibles
		ParentOffset = Vector
			X = 0
			Y = 0


