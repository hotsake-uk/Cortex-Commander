///////////////////////////////////////////////////////////////////////
// Minotaur (Bestiary II). A bull-headed brute near twice a soldier's size on the Civilian's rig (MinotaurBody.ini, made by
// Tools/make_bestiary.py) in dark brown hide. It charges: a burst of speed at its prey when it is near, level and in the open
// (CreatureBehaviors.ChargeTarget, CreatureChargeRange), bowling over whoever is in the way (Shared/Trample.lua), and swings a great axe
// that sends units flying (Shared/Club.lua). It hunts with its kind.


AddAmmo = Round
	PresetName = Round Minotaur Axe
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Ogre Club
		PresetName = Particle Minotaur Axe
		WoundDamageMultiplier = 3.5
		Sharpness = 120
		LifeTime = 45
		AddCustomValue = NumberValue
			ClubSpeed = 10
		AddCustomValue = NumberValue
			ClubMass = 220
	Shell = None
	FireVelocity = 30
	Separation = 4


AddDevice = HDFirearm
	CopyOf = Ogre Club
	PresetName = Minotaur Axe
	Description = "A minotaur's great axe. It comes with the minotaur."
	Magazine = Magazine
		CopyOf = Magazine Ogre Club
		PresetName = Magazine Minotaur Axe
		RegularRound = Round
			CopyOf = Round Minotaur Axe
	RateOfFire = 45


AddActor = AHuman
	CopyOf = Minotaur Body
	PresetName = Minotaur
	Description = "A bull-headed brute, near twice a man's height, in dark hide. It charges whatever it hunts, bowling over whoever stands in the way, and its great axe sends men flying."
	AddToGroup = Actors - Creatures
	GoldValue = 230
	Buyable = 1
	Mass = 160
	MaxHealth = 380
	Health = 380
	ImpulseDamageThreshold = 6000
	PainSound = SoundContainer
		CopyOf = Flesh Torso Impact
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	StrideSound = SoundContainer
		CopyOf = Footstep Light Generic
	ScriptPath = Base.rte/AI/HumanAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Trample.lua
	BodyWidth = 36
	BodyHeight = 86
	Swims = Never
	BreathSeconds = 30
	SafeFallHeight = 200
	LegJumpHeight = 34
	// How it hunts (CreatureBehaviors.ChargeTarget): it goes at its prey and swings from 44 px; prey within 260 px, level and in the open,
	// it charges (a burst of 10 m/s, every 4 s); it joins a packmate's hunt within 300 px and gives up past 1000 px.
	AddCustomValue = NumberValue
		CreatureAttackRange = 44
	AddCustomValue = NumberValue
		CreatureChaseRange = 1000
	AddCustomValue = NumberValue
		CreaturePackRange = 300
	AddCustomValue = NumberValue
		CreatureChargeRange = 260
	AddCustomValue = NumberValue
		CreatureChargeSpeed = 10
	AddCustomValue = NumberValue
		CreatureChargeCooldown = 4000
	// Its trample (Shared/Trample.lua): going faster than 4 m/s it bowls over units of up to 170 kg within 30 px in front of it.
	AddCustomValue = NumberValue
		TrampleSpeed = 4
	AddCustomValue = NumberValue
		TrampleMass = 170
	AddCustomValue = NumberValue
		TrampleReach = 30
	AddInventory = HDFirearm
		CopyOf = Minotaur Axe
	GibImpulseLimit = 9000
	GibWoundLimit = 20
	GibSound = SoundContainer
		CopyOf = Flesh Torso Gib
	AddGib = Gib
		GibParticle = MOPixel
			CopyOf = Drop Blood
		Count = 24
		MinVelocity = 2
		MaxVelocity = 10
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Blood Spray Particle
		Count = 4
		MinVelocity = 1
		MaxVelocity = 5
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Flesh Small A
		Offset = Vector
			X = -4
			Y = -8
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Flesh Small B
		Offset = Vector
			X = 4
			Y = -18
	AddGib = Gib
