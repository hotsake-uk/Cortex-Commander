///////////////////////////////////////////////////////////////////////
// Cave Troll (Bestiary I). A brute twice a soldier's size on the Civilian's rig (CaveTrollBody.ini, made by Tools/make_bestiary.py) in a
// blue-grey hide. It regenerates for good (a PassiveEffect, SE-1: five health a second, which also closes its wounds), swings a club
// that knocks units down (Shared/Club.lua), shoulders small units aside at a run (Shared/Trample.lua), and from a distance it throws
// boulders (TrollThrow.lua: a real rock, lobbed at whoever it hunts, that hurts and bowls over what it lands on, Boulder.lua).


// The boulder: a rock the size of a head.
AddEffect = MOSRotating
	PresetName = Troll Boulder
	Mass = 25
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 1
	LifeTime = 6000
	ScriptPath = Base.rte/Actors/Creatures/CaveTroll/Boulder.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/CaveTroll/TrollBoulder.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -8
		Y = -8
	AngularVel = 4
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Stone
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	// What it does to whoever it strikes (Boulder.lua): 30 health off, and knocked as a club of 10 m/s does (Shared/Club.lua's numbers).
	AddCustomValue = NumberValue
		BoulderDamage = 30
	AddCustomValue = NumberValue
		ClubSpeed = 10
	AddCustomValue = NumberValue
		ClubMass = 220
	GibImpulseLimit = 3000
	GibWoundLimit = 2
	GibSound = SoundContainer
		CopyOf = Metal Door Gib
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Stone Small A
		Count = 1
		MinVelocity = 2
		MaxVelocity = 6
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Stone Small B
		Count = 1
		MinVelocity = 2
		MaxVelocity = 6
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Stone Tiny A
		Count = 6
		MinVelocity = 3
		MaxVelocity = 9


AddDevice = HDFirearm
	CopyOf = Ogre Club
	PresetName = Troll Club
	Description = "A tree trunk a troll swings. It comes with the troll."


AddActor = AHuman
	CopyOf = Cave Troll Body
	PresetName = Cave Troll
	Description = "A troll out of the deep caves, twice a man's height and blue-grey as the rock it lives in. Its wounds close as fast as they are made, it throws boulders at whatever it can't reach, and up close it swings a tree."
	AddToGroup = Actors - Creatures
	GoldValue = 260
	Buyable = 1
	Mass = 170
	MaxHealth = 500
	Health = 500
	ImpulseDamageThreshold = 6000
	PainSound = SoundContainer
		CopyOf = Flesh Torso Impact
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	StrideSound = SoundContainer
		CopyOf = Footstep Light Generic
	ScriptPath = Base.rte/AI/HumanAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Trample.lua
	ScriptPath = Base.rte/Actors/Creatures/CaveTroll/TrollThrow.lua
	// What its body can do (the movement profile): about 40 px across and 96 tall, so it is routed round gaps it won't fit; it wades
	// rather than swims, and drops two storeys unhurt.
	BodyWidth = 40
	BodyHeight = 96
	Swims = Never
	BreathSeconds = 30
	SafeFallHeight = 200
	LegJumpHeight = 30
	// Its regeneration (SE-1): five health a second, for good.
	PassiveEffect = StatusEffect
		Name = Troll Regeneration
		Label = Regenerating
		HealthPerSecond = 5
	// How it hunts (CreatureBehaviors.ChargeTarget): it walks at its prey and swings from 44 px, and joins a packmate's hunt within 400 px.
	AddCustomValue = NumberValue
		CreatureAttackRange = 44
	AddCustomValue = NumberValue
		CreatureChaseRange = 900
	AddCustomValue = NumberValue
		CreaturePackRange = 400
	// Its trample (Shared/Trample.lua): going faster than 2 m/s it shoulders aside units of up to 120 kg within 30 px in front of it.
	AddCustomValue = NumberValue
		TrampleSpeed = 2
	AddCustomValue = NumberValue
		TrampleMass = 120
	AddCustomValue = NumberValue
		TrampleReach = 30
	// Its boulders (TrollThrow.lua): at prey it hunts between 110 and 420 px off, one every 4 s, lobbed at 22 m/s.
	AddCustomValue = NumberValue
		TrollThrowMin = 110
	AddCustomValue = NumberValue
		TrollThrowRange = 420
	AddCustomValue = NumberValue
		TrollThrowCooldown = 4000
	AddCustomValue = NumberValue
		TrollThrowSpeed = 22
	AddInventory = HDFirearm
		CopyOf = Troll Club
	GibImpulseLimit = 9000
	GibWoundLimit = 22
	GibSound = SoundContainer
		CopyOf = Flesh Torso Gib
	AddGib = Gib
		GibParticle = MOPixel
			CopyOf = Drop Blood
		Count = 24
		MinVelocity = 2
		MaxVelocity = 10
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Blood Spray Particle
		Count = 4
