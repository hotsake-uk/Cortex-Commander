// Ooze (phase 3, C9's crawl). A legless blob of acid slime: it oozes along floors and up walls on its body (ACrab's crawl, with no legs
// at all), spits acid and burns what it touches. Killed, it splits into two half-size oozes that don't split again (OozeSplit.lua, D10).
// Placeholder art drawn by Tools/make_placeholders.py.


// Its touch and its spit: acid (Shared/Acid.lua), which eats at whoever it strikes for a few seconds.

AddEffect = MOPixel
	CopyOf = Particle Hound Bite
	PresetName = Particle Ooze Acid Touch
	ScriptPath = Base.rte/Actors/Creatures/Shared/Acid.lua
	WoundDamageMultiplier = 1
	Color = Color
		R = 150
		G = 230
		B = 40
	AddCustomValue = NumberValue
		AcidDamage = 5
	AddCustomValue = NumberValue
		AcidSeconds = 3


AddAmmo = Round
	PresetName = Round Ooze Acid Touch
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Ooze Acid Touch
	Shell = None
	FireVelocity = 28
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Ooze Touch
	Description = "An ooze's acid body. It comes with the ooze."
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Ooze Touch
		RegularRound = Round
			CopyOf = Round Ooze Acid Touch
	FireSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	RateOfFire = 70
	MuzzleOffset = Vector
		X = 4
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Ooze Maw
	MountedDevice = HDFirearm
		CopyOf = Ooze Touch
		ParentOffset = Vector
			X = 0
			Y = 0


// The spit: a glob of acid, lobbed at prey out of reach (CreatureBehaviors.SpitAt), which bursts on whatever it hits.

AddEffect = MOPixel
	PresetName = Ooze Acid Glob
	Mass = 0.2
	Sharpness = 0
	HitsMOs = 1
	GetsHitByMOs = 0
	GlobalAccScalar = 0.6
	AirResistance = 0.01
	LifeTime = 2500
	RestThreshold = 500
	ScriptPath = Base.rte/Actors/Creatures/Shared/Acid.lua
	Color = Color
		R = 150
		G = 230
		B = 40
	Atom = Atom
		Material = Material
			CopyOf = Bullet Metal
		TrailColor = Color
			R = 120
			G = 200
			B = 30
		TrailLength = 5
	AddCustomValue = NumberValue
		AcidGlob = 1
	AddCustomValue = NumberValue
		AcidDamage = 6
	AddCustomValue = NumberValue
		AcidSeconds = 4


AddActor = ACrab
	PresetName = Ooze
	Description = "A creeping mound of acid slime. It oozes along floors and up walls, spits acid and burns what it touches. Killed, it splits in two."
	AddToGroup = Actors - Creatures
	GoldValue = 120
	Buyable = 1
	Mass = 90
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Ooze/OozeSplit.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Ooze/OozeBodyA.png
	FrameCount = 2
	SpriteAnimMode = 4
	SpriteAnimDuration = 1200
	SpriteOffset = Vector
		X = -18
		Y = -12
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Flesh
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	PassengerSlots = 0
	// What its body can do (the movement profile): about 36 px across and 20 tall; it crawls on its body (it has no legs) along floors and
	// up walls, but not along ceilings, slowly; it doesn't swim or breathe, and isn't hurt by falls it can crawl down.
	BodyWidth = 36
	BodyHeight = 20
	Climbs = Walls
	CrawlSpeed = 1.2
	Swims = Never
	BreathSeconds = 0
	SafeFallHeight = 300
	AimRangeUpperLimit = 1
	AimRangeLowerLimit = 1
	// How it hunts (CreatureBehaviors.lua): burns what is within 20 px, spits acid at prey within 200 px every five seconds, and joins a
	// packmate's hunt within 300 px.
	AddCustomValue = NumberValue
		CreatureBiteReach = 20
	AddCustomValue = NumberValue
		CreaturePackRange = 300
	AddCustomValue = NumberValue
		CreatureChaseRange = 700
	AddCustomValue = NumberValue
		CreatureSpitRange = 200
	AddCustomValue = NumberValue
		CreatureSpitCooldown = 5000
	AddCustomValue = NumberValue
		CreatureSpitSpeed = 14
	AddCustomValue = StringValue
		CreatureSpit = Ooze Acid Glob
	// Killed, it splits once (OozeSplit.lua).
	AddCustomValue = NumberValue
		OozeSplits = 1
	Turret = Turret
		CopyOf = Ooze Maw
		ParentOffset = Vector
			X = 12
			Y = -2
	MaxHealth = 150
	Health = 150
	Organic = 1
	ImpulseDamageThreshold = 5000
	Perceptiveness = 0.7
	CharHeight = 24
	// (No legs, but a crab's body still keeps foot groups.)
	LFootGroup = AtomGroup
		CopyOf = Crab Foot
	RFootGroup = AtomGroup
		CopyOf = Crab Foot
	GibImpulseLimit = 6000
	GibWoundLimit = 14
	GibSound = SoundContainer
		CopyOf = Flesh Torso Gib
	// It bursts into acid slime.
	AddGib = Gib
		GibParticle = MOPixel
			CopyOf = Acid Glob
		Count = 20
		MinVelocity = 2
		MaxVelocity = 8
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Flesh Tiny A
		Count = 4
		MinVelocity = 1
		MaxVelocity = 5


