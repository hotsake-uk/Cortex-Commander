///////////////////////////////////////////////////////////////////////
// Gargoyle (Bestiary III, the fliers). A winged statue of grey stone (drawn by Tools/make_bestiary.py; the Stone material, dents for
// wounds, rubble for gibs, Shared/StoneGibs.ini). On guard it climbs to a ceiling and hangs there as a statue (CreatureLurks, as a bat
// does), wakes when prey comes under and drops; in the open it dives (CreatureBehaviors.FlyHunt) and rakes with stone claws that knock
// units down (Shared/Club.lua). Stone through and through: a Stone Hide for good (a PassiveEffect, SE-1: seven tenths of the harm,
// fire-proof), and it doesn't breathe.


AddAmmo = Round
	PresetName = Round Gargoyle Claws
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Ogre Club
		PresetName = Particle Gargoyle Claw
		WoundDamageMultiplier = 3
		LifeTime = 40
		AddCustomValue = NumberValue
			ClubSpeed = 8
		AddCustomValue = NumberValue
			ClubMass = 150
	Shell = None
	FireVelocity = 30
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Gargoyle Claws
	Description = "A gargoyle's stone claws. They come with the gargoyle."
	SharpLength = 26
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Gargoyle Claws
		RegularRound = Round
			CopyOf = Round Gargoyle Claws
	RateOfFire = 60
	MuzzleOffset = Vector
		X = 4
		Y = 2


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Gargoyle Head
	MountedDevice = HDFirearm
		CopyOf = Gargoyle Claws
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	PresetName = Gargoyle
	Description = "A winged statue of grey stone that is not a statue. It hangs from ceilings and ledges in wait, wakes when prey comes under, and drops on it with stone claws. Arrows glance off it and fire does nothing."
	AddToGroup = Actors - Creatures
	GoldValue = 200
	Buyable = 1
	Mass = 120
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Gargoyle/GargoyleBodyA.png
	FrameCount = 3
	SpriteAnimMode = 0
	SpriteOffset = Vector
		X = -22
		Y = -15
	EntryWound = AEmitter
		CopyOf = Dent Metal No Spark
	ExitWound = AEmitter
		CopyOf = Dent Metal No Spark
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Stone
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Metal Door Gib
	DeathSound = SoundContainer
		CopyOf = Metal Door Gib
	PassengerSlots = 0
	BodyWidth = 44
	BodyHeight = 30
	Flies = Wings
	FlySpeed = 5
	FlyStamina = 30
	Climbs = WallsAndCeilings
	CrawlSpeed = 1
	FireProof = 1
	Swims = Never
	BreathSeconds = 0
	SafeFallHeight = 400
	AimRangeUpperLimit = 1.5
	AimRangeLowerLimit = 1.5
	// Its stone hide (SE-1): seven tenths of the harm and no fire, for good.
	PassiveEffect = StatusEffect
		Name = Stone Hide
		Label = Stone
		DamageTakenMultiplier = 0.7
		FireProof = 1
	// How it hunts (CreatureBehaviors.lua): on guard it hangs from a ceiling within 300 px over its post and waits up to 12 s for prey to
	// come within 60 px of under it, then drops; in the air it dives at prey in the open within 180 px and rakes within 24 px; alone,
	// gives up past 900 px.
	AddCustomValue = NumberValue
		CreatureLurks = 1
	AddCustomValue = NumberValue
		CreatureLurkHeight = 300
	AddCustomValue = NumberValue
		CreatureLurkWait = 12000
	AddCustomValue = NumberValue
		CreatureDropReach = 60
	AddCustomValue = StringValue
		CreatureFlyAttack = Dive
	AddCustomValue = NumberValue
		CreatureDiveRange = 180
	AddCustomValue = NumberValue
		CreatureBiteReach = 24
	AddCustomValue = NumberValue
		CreaturePackRange = 0
	AddCustomValue = NumberValue
		CreatureChaseRange = 900
	Turret = Turret
		CopyOf = Gargoyle Head
		ParentOffset = Vector
			X = 14
			Y = -2
	MaxHealth = 300
	Health = 300
	Organic = 0
	ImpulseDamageThreshold = 8000
	Perceptiveness = 0.8
	CharHeight = 32
	LFootGroup = AtomGroup
		CopyOf = Crab Foot
	RFootGroup = AtomGroup
		CopyOf = Crab Foot
	GibImpulseLimit = 9000
	GibWoundLimit = 14
	GibSound = SoundContainer
		CopyOf = Metal Door Gib
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Stone Small A
		Offset = Vector
			X = -8
			Y = 0
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Stone Small B
		Offset = Vector
			X = 0
			Y = -2
	AddGib = Gib
