///////////////////////////////////////////////////////////////////////
// Giant Eagle (Bestiary III, the fliers). The fastest thing in the air (drawn by Tools/make_bestiary.py; three frames, a wing beat). It
// dives on its prey (CreatureBehaviors.FlyHunt) and rakes with talons that catch and hold (Shared/Grab.lua); a small creature (a rat, an
// imp) it snatches up and drops from a height (Shared/Carry.lua). It tires and lands to rest, and hunts alone.


AddAmmo = Round
	PresetName = Round Eagle Talons
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Scorpion Grab
		PresetName = Particle Eagle Talon
		WoundDamageMultiplier = 2.5
		Sharpness = 140
		AddCustomValue = NumberValue
			GrabSeconds = 1.2
	Shell = None
	FireVelocity = 34
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Eagle Talons
	Description = "A giant eagle's talons. They come with the eagle."
	SharpLength = 24
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Eagle Talons
		RegularRound = Round
			CopyOf = Round Eagle Talons
	RateOfFire = 80
	MuzzleOffset = Vector
		X = 4
		Y = 2


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Eagle Head
	MountedDevice = HDFirearm
		CopyOf = Eagle Talons
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	PresetName = Giant Eagle
	Description = "An eagle with the wingspan of a cart, the fastest thing in the sky. It dives on its prey and rakes it with its talons; small creatures it snatches up and drops from a height."
	AddToGroup = Actors - Creatures
	GoldValue = 120
	Buyable = 1
	Mass = 30
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Carry.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/GiantEagle/GiantEagleBodyA.png
	FrameCount = 3
	SpriteAnimMode = 0
	SpriteOffset = Vector
		X = -24
		Y = -14
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Flesh
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Bone Crack
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	PassengerSlots = 0
	BodyWidth = 48
	BodyHeight = 28
	Flies = Wings
	FlySpeed = 10
	FlyStamina = 50
	Swims = Never
	BreathSeconds = 30
	SafeFallHeight = 400
	AimRangeUpperLimit = 1.5
	AimRangeLowerLimit = 1.5
	// How it hunts (CreatureBehaviors.FlyHunt): dives at prey in the open within 260 px, rakes within 22 px, alone, gives up past 1200 px.
	AddCustomValue = StringValue
		CreatureFlyAttack = Dive
	AddCustomValue = NumberValue
		CreatureDiveRange = 260
	AddCustomValue = NumberValue
		CreatureBiteReach = 22
	AddCustomValue = NumberValue
		CreaturePackRange = 0
	AddCustomValue = NumberValue
		CreatureChaseRange = 1200
	// Its snatching (Shared/Carry.lua): a held creature of up to 30 kg against it, for 2.5 s, no more than once in 6 s.
	AddCustomValue = NumberValue
		CarryMaxMass = 30
	AddCustomValue = NumberValue
		CarrySeconds = 2.5
	AddCustomValue = NumberValue
		CarryCooldown = 6000
	Turret = Turret
		CopyOf = Eagle Head
		ParentOffset = Vector
			X = 16
			Y = -2
	MaxHealth = 120
	Health = 120
	Organic = 1
	ImpulseDamageThreshold = 3500
	Perceptiveness = 1
	CharHeight = 30
	LFootGroup = AtomGroup
		CopyOf = Crab Foot
	RFootGroup = AtomGroup
		CopyOf = Crab Foot
	GibImpulseLimit = 4000
	GibWoundLimit = 9
	GibSound = SoundContainer
		CopyOf = Flesh Torso Gib
	AddGib = Gib
		GibParticle = MOPixel
			CopyOf = Drop Blood
		Count = 10
		MinVelocity = 2
		MaxVelocity = 10
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Flesh Small A
		Offset = Vector
			X = -4
			Y = 0
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Bone Small A
		Offset = Vector
			X = 6
			Y = 0
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Flesh Tiny A
		Count = 4
