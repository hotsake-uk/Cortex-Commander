///////////////////////////////////////////////////////////////////////
// Basilisk (Bestiary II). A lizard the size of a horse: the Hound's rig 1.4x in dull green scales (BasiliskBody.ini, made by
// Tools/make_bestiary.py). Its gaze turns what it falls on to stone: spat as the creature AI spits (CreatureBehaviors.SpitAt), a
// weightless bolt drawn as a beam from its eye (Shared/Gaze.lua) that leaves the unit it strikes Petrified (a StatusEffect, SE-1: held,
// silenced, half the harm, drawn in the Creature Petrified shader) for four seconds. Up close it bites, and the bite is venom.


AddEffect = MOPixel
	CopyOf = Particle Spider Venom Bite
	PresetName = Particle Basilisk Venom Bite
	WoundDamageMultiplier = 2
	AddCustomValue = NumberValue
		VenomDamage = 4
	AddCustomValue = NumberValue
		VenomSeconds = 4
	AddCustomValue = NumberValue
		VenomSlow = 0.85


AddAmmo = Round
	PresetName = Round Basilisk Bite
	ParticleCount = 2
	Particle = MOPixel
		CopyOf = Particle Basilisk Venom Bite
	Shell = None
	FireVelocity = 30
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Basilisk Fangs
	Description = "A basilisk's fangs. They come with the basilisk."
	SharpLength = 44
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Basilisk Fangs
		RegularRound = Round
			CopyOf = Round Basilisk Bite
	RateOfFire = 80
	MuzzleOffset = Vector
		X = 6
		Y = 1


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Basilisk Head
	MountedDevice = HDFirearm
		CopyOf = Basilisk Fangs
		ParentOffset = Vector
			X = 0
			Y = 0


// The gaze: a weightless bolt, spat when its prey is in sight (CreatureBehaviors.SpitAt), that petrifies whoever it strikes (Shared/Gaze.lua).
AddEffect = MOPixel
	PresetName = Basilisk Gaze
	Mass = 0.1
	Sharpness = 0
	HitsMOs = 1
	GetsHitByMOs = 0
	GlobalAccScalar = 0
	AirResistance = 0
	LifeTime = 700
	RestThreshold = 500
	ScriptPath = Base.rte/Actors/Creatures/Shared/Gaze.lua
	Color = Color
		R = 180
		G = 255
		B = 120
	Atom = Atom
		Material = Material
			CopyOf = Bullet Metal
		TrailColor = Color
			R = 140
			G = 230
			B = 90
		TrailLength = 30
	AddCustomValue = NumberValue
		GazeSeconds = 4


AddActor = ACrab
	CopyOf = Basilisk Body
	PresetName = Basilisk
	Description = "A lizard the size of a horse, in dull green scales, with eyes that turn what they fall on to stone. Its gaze holds a unit as a statue for a few heartbeats; its bite is venom."
	AddToGroup = Actors - Creatures
	GoldValue = 200
	Buyable = 1
	ScriptPath = Base.rte/AI/CrabAI.lua
	Mass = 120
	MaxHealth = 240
	Health = 240
	// How it hunts (CreatureBehaviors.lua): bites within 30 px, leaps at prey within 120 px, hunts alone, gives up past 900 px; its gaze
	// (CreatureSpit) at prey in sight within 260 px, every 7 s, at 40 m/s.
	AddCustomValue = NumberValue
		CreatureBiteReach = 30
	AddCustomValue = NumberValue
		CreaturePounceRange = 120
	AddCustomValue = NumberValue
		CreaturePackRange = 0
	AddCustomValue = NumberValue
		CreatureChaseRange = 900
	AddCustomValue = NumberValue
		CreatureSpitRange = 260
	AddCustomValue = NumberValue
		CreatureSpitCooldown = 7000
	AddCustomValue = NumberValue
		CreatureSpitSpeed = 40
	AddCustomValue = StringValue
		CreatureSpit = Basilisk Gaze
	Turret = Turret
		CopyOf = Basilisk Head
		ParentOffset = Vector
			X = 14
			Y = -7
