// Giant Beetle (Bestiary II). An armoured beetle on six legs (the Scorpion's rig in blue-black, reshaded by Tools/make_bestiary.py).
// It charges its prey (CreatureBehaviors.lua, CreatureChargeRange), tramples what it runs into (Shared/Trample.lua) and tosses units with
// its horns (the Ogre's club collision, Shared/Club.lua). Its carapace takes six tenths of the harm (Carapace.lua: a status effect kept
// on it), but a hard enough blow flips it on its back for a moment, belly up and helpless, taking half again as much.


AddAmmo = Round
	PresetName = Round Beetle Gore
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Ogre Club
		PresetName = Particle Beetle Horn
		WoundDamageMultiplier = 2.5
		LifeTime = 40
		AddCustomValue = NumberValue
			ClubSpeed = 7
		AddCustomValue = NumberValue
			ClubMass = 150
	Shell = None
	FireVelocity = 28
	Separation = 3


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Beetle Horns
	Description = "A giant beetle's horns, that toss what they catch. They come with the beetle."
	SharpLength = 30
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Beetle Horns
		RegularRound = Round
			CopyOf = Round Beetle Gore
	RateOfFire = 60
	MuzzleOffset = Vector
		X = 6
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Beetle Head
	MountedDevice = HDFirearm
		CopyOf = Beetle Horns
		ParentOffset = Vector
			X = 0
			Y = 0


AddEffect = Leg
	CopyOf = Scorpion Leg FG
	PresetName = Beetle Leg FG
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/GiantBeetle/BeetleLegFGA.png
	FrameCount = 4


AddEffect = Leg
	CopyOf = Scorpion Leg BG
	PresetName = Beetle Leg BG
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/GiantBeetle/BeetleLegBGA.png
	FrameCount = 4


AddActor = ACrab
	PresetName = Giant Beetle
	Description = "A beetle the size of a pony in blue-black armour. It charges whatever it hunts, tramples it and tosses it on its horns. Its shell turns most blows, but hit it hard enough and it goes over on its back."
	AddToGroup = Actors - Creatures
	GoldValue = 150
	Buyable = 1
	Mass = 130
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Trample.lua
	ScriptPath = Base.rte/Actors/Creatures/GiantBeetle/Carapace.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/GiantBeetle/BeetleBodyA.png
	FrameCount = 2
	SpriteAnimMode = 4
	SpriteAnimDuration = 700
	SpriteOffset = Vector
		X = -24
		Y = -20
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Armoured Flesh
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Bone Crack
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	PassengerSlots = 0
	BodyWidth = 48
	BodyHeight = 30
	Swims = Never
	BreathSeconds = 30
	SafeFallHeight = 250
	LegJumpHeight = 24
	LegJumpSpeed = 6
	AimRangeUpperLimit = 1
	AimRangeLowerLimit = 1
	// How it hunts (CreatureBehaviors.lua): gores within 26 px, charges prey within 220 px (a burst of 8 m/s, every 3.5 s), never
	// leaps, joins a packmate's hunt within 300 px, gives up past 800 px.
	AddCustomValue = NumberValue
		CreatureBiteReach = 26
	AddCustomValue = NumberValue
		CreaturePounceRange = 0
	AddCustomValue = NumberValue
		CreatureChargeRange = 220
	AddCustomValue = NumberValue
		CreatureChargeSpeed = 8
	AddCustomValue = NumberValue
		CreatureChargeCooldown = 3500
	AddCustomValue = NumberValue
		CreaturePackRange = 300
	AddCustomValue = NumberValue
		CreatureChaseRange = 800
	// Its trample (Shared/Trample.lua): going faster than 4 m/s it bowls over units of up to 140 kg within 26 px in front of it.
	AddCustomValue = NumberValue
		TrampleSpeed = 4
	AddCustomValue = NumberValue
		TrampleMass = 140
	AddCustomValue = NumberValue
		TrampleReach = 26
	// Its carapace (Carapace.lua): six tenths of the harm; a blow of 20 health or more at once flips it for 2.5 s (half again the harm,
	// held), no more than once in 6 s.
	AddCustomValue = NumberValue
		CarapaceTaken = 0.6
	AddCustomValue = NumberValue
		CarapaceFlipDamage = 20
	AddCustomValue = NumberValue
		CarapaceFlipSeconds = 2.5
	AddCustomValue = NumberValue
		CarapaceFlipCooldown = 6000
