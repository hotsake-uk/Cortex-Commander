///////////////////////////////////////////////////////////////////////
// Stone Golem (Bestiary I). A statue that walks: the Civilian's rig 1.7x in grey stone (StoneGolemBody.ini, made by
// Tools/make_bestiary.py; its flesh is the Stone material, so arrows and blades glance off, and its wounds are dents, not blood). Slow
// (SpeedMultiplier), a Stone Skin for good (a PassiveEffect, SE-1: seven tenths of the harm, fire-proof), and it punches: a short blow that
// shoves whoever it lands on across the room (Shared/Club.lua). It doesn't breathe or swim; it sinks and walks on. When it dies it crumbles
// into rock (Shared/StoneGibs.ini).


AddAmmo = Round
	PresetName = Round Golem Punch
	ParticleCount = 3
	Particle = MOPixel
		CopyOf = Particle Ogre Club
		PresetName = Particle Golem Fist
		WoundDamageMultiplier = 2.5
		LifeTime = 40
		AddCustomValue = NumberValue
			ClubSpeed = 12
		AddCustomValue = NumberValue
			ClubMass = 260
	Shell = None
	FireVelocity = 28
	Separation = 4


AddDevice = HDFirearm
	CopyOf = Ogre Club
	PresetName = Golem Fist
	Description = "A golem's stone fist. It comes with the golem."
	SpriteFile = ContentFile
		FilePath = Base.rte/Null.png
	FrameCount = 1
	SpriteOffset = Vector
		X = 0
		Y = 0
	StanceOffset = Vector
		X = 10
		Y = 2
	SharpStanceOffset = Vector
		X = 12
		Y = -2
	Magazine = Magazine
		CopyOf = Magazine Ogre Club
		PresetName = Magazine Golem Fist
		RegularRound = Round
			CopyOf = Round Golem Punch
	FireSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	RateOfFire = 40
	ParticleSpreadRange = 15
	MuzzleOffset = Vector
		X = 14
		Y = 0


AddActor = AHuman
	CopyOf = Stone Golem Body
	PresetName = Stone Golem
	Description = "A statue that walks, hewn from grey stone. Arrows and blades glance off it, it feels no fire, and its fists send men flying. Slow, and it crumbles to rubble when it finally breaks."
	AddToGroup = Actors - Creatures
	GoldValue = 240
	Buyable = 1
	Mass = 400
	MaxHealth = 450
	Health = 450
	ImpulseDamageThreshold = 9000
	PainSound = SoundContainer
		CopyOf = Metal Door Gib
	DeathSound = SoundContainer
		CopyOf = Metal Door Gib
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	StrideSound = SoundContainer
		CopyOf = Footstep Light Generic
	ScriptPath = Base.rte/AI/HumanAI.lua
	ScriptPath = Base.rte/Actors/Creatures/Shared/Trample.lua
	// What its body can do (the movement profile): about 34 px across and 82 tall; fire doesn't catch on it; it doesn't breathe or swim,
	// and drops three storeys unhurt. Slow: six tenths of the rig's pace.
	BodyWidth = 34
	BodyHeight = 82
	FireProof = 1
	Swims = Never
	BreathSeconds = 0
	SafeFallHeight = 300
	LegJumpHeight = 16
	SpeedMultiplier = 0.6
	// Its stone skin (SE-1): seven tenths of the harm reaches it, for good.
	PassiveEffect = StatusEffect
		Name = Stone Skin
		Label = Stone
		DamageTakenMultiplier = 0.7
		FireProof = 1
	// How it hunts (CreatureBehaviors.ChargeTarget): it walks at its prey and punches from 36 px, joins no pack, gives up past 700 px.
	AddCustomValue = NumberValue
		CreatureAttackRange = 36
	AddCustomValue = NumberValue
		CreatureChaseRange = 700
	AddCustomValue = NumberValue
		CreaturePackRange = 0
	// Its trample (Shared/Trample.lua): going faster than 1.5 m/s it shoulders aside units of up to 200 kg within 30 px in front of it.
	AddCustomValue = NumberValue
		TrampleSpeed = 1.5
	AddCustomValue = NumberValue
		TrampleMass = 200
	AddCustomValue = NumberValue
		TrampleReach = 30
	AddInventory = HDFirearm
		CopyOf = Golem Fist
	GibImpulseLimit = 12000
	GibWoundLimit = 30
	GibSound = SoundContainer
		CopyOf = Metal Door Gib
	// It crumbles into rock.
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Stone Small A
		Count = 2
		Offset = Vector
			X = -4
			Y = -8
		MinVelocity = 1
		MaxVelocity = 5
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Stone Small B
		Count = 2
		Offset = Vector
			X = 4
			Y = -20
		MinVelocity = 1
		MaxVelocity = 5
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Stone Small C
		Count = 2
		Offset = Vector
			X = 0
			Y = -30
		MinVelocity = 1
		MaxVelocity = 5
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Stone Tiny A
		Count = 14
		MinVelocity = 2
		MaxVelocity = 8
