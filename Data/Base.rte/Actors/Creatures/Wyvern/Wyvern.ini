// Wyvern (phase 4, C8). A great winged drake: it flies over and round what is in its way, holds in the air off its prey and breathes fire
// on it (the Flame Fiend's flames, sparing its own side), and bites what comes close. Fire doesn't catch on it. It tires after most of a
// minute in the air and lands to rest. Placeholder art drawn by Tools/make_placeholders.py: three frames, a wing beat.


AddDevice = HDFirearm
	CopyOf = Fiend Flames
	PresetName = Wyvern Breath
	Description = "The fire a wyvern breathes. It comes with the wyvern."
	MuzzleOffset = Vector
		X = 8
		Y = 0


AddEffect = MOPixel
	CopyOf = Particle Hound Bite
	PresetName = Particle Wyvern Bite
	WoundDamageMultiplier = 4


AddAmmo = Round
	PresetName = Round Wyvern Bite
	ParticleCount = 4
	Particle = MOPixel
		CopyOf = Particle Wyvern Bite
	Shell = None
	FireVelocity = 34
	Separation = 4


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Wyvern Jaws
	Description = "A wyvern's jaws. They come with the wyvern."
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Wyvern Jaws
		RegularRound = Round
			CopyOf = Round Wyvern Bite
	RateOfFire = 80
	MuzzleOffset = Vector
		X = 8
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Wyvern Head
	MountedDevice = HDFirearm
		CopyOf = Wyvern Breath
		ParentOffset = Vector
			X = 0
			Y = 0
	AddMountedDevice = HDFirearm
		CopyOf = Wyvern Jaws
		ParentOffset = Vector
			X = 0
			Y = 2


AddActor = ACrab
	PresetName = Wyvern
	Description = "A great winged drake. It flies over whatever is in its way, breathes fire on its prey from the air and bites what comes close."
	AddToGroup = Actors - Creatures
	GoldValue = 300
	Buyable = 1
	Mass = 220
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Wyvern/WyvernBodyA.png
	FrameCount = 3
	SpriteAnimMode = 0
	SpriteOffset = Vector
		X = -42
		Y = -24
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Armoured Flesh
		Resolution = 4
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PainSound = SoundContainer
		CopyOf = Bone Crack
	DeathSound = SoundContainer
		CopyOf = Flesh Torso Impact
	PassengerSlots = 0
	// What its body can do (the movement profile): 60 px across and 30 tall for the routes it flies (its wings fold through a gap); it
	// flies on its wings at 6 m/s for 45 seconds before it must land and rest; fire doesn't catch on it.
	BodyWidth = 60
	BodyHeight = 30
	Flies = Wings
	FlySpeed = 6
	FlyStamina = 45
	FireProof = 1
	Swims = Never
	BreathSeconds = 30
	SafeFallHeight = 400
	AimRangeUpperLimit = 1.5
	AimRangeLowerLimit = 1.5
	// How it hunts (CreatureBehaviors.FlyHunt): holds 110 px off its prey in the air and lets it have its fire within 130 px; hunts alone.
	AddCustomValue = StringValue
		CreatureFlyAttack = Hover
	AddCustomValue = NumberValue
		CreatureHoverRange = 110
	AddCustomValue = NumberValue
		CreatureAttackRange = 130
	AddCustomValue = NumberValue
		CreatureBiteReach = 30
	AddCustomValue = NumberValue
		CreaturePackRange = 0
	AddCustomValue = NumberValue
		CreatureChaseRange = 1200
	Turret = Turret
		CopyOf = Wyvern Head
		ParentOffset = Vector
			X = 30
			Y = -10
	MaxHealth = 450
	Health = 450
	Organic = 1
	ImpulseDamageThreshold = 8000
	Perceptiveness = 1
	CharHeight = 50
	// (No legs, but a crab's body still keeps foot groups.)
	LFootGroup = AtomGroup
		CopyOf = Crab Foot
	RFootGroup = AtomGroup
		CopyOf = Crab Foot
	GibImpulseLimit = 12000
	GibWoundLimit = 24
	GibSound = SoundContainer
		CopyOf = Flesh Torso Gib
