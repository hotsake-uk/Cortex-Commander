	PainSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	DeathSound = SoundContainer
		CopyOf = Flesh Body Blunt Hit
	PassengerSlots = 0
	BodyWidth = 14
	BodyHeight = 10
	Flies = Wings
	FlySpeed = 9
	FlyStamina = 20
	Climbs = WallsAndCeilings
	CrawlSpeed = 1
	Swims = Never
	BreathSeconds = 10
	SafeFallHeight = 400
	AimRangeUpperLimit = 1.5
	AimRangeLowerLimit = 1.5
	// A swarm (SandboxWorld::SpawnUnits): one placed is eight.
	AddCustomValue = NumberValue
		SpawnGroup = 8
	// How it hunts (CreatureBehaviors.lua): hangs from a ceiling within 250 px over its post; dives at prey in the open within 160 px,
	// bites within 12 px, scatters when hurt, joins a swarm-mate's hunt within 400 px, gives up past 800 px.
	AddCustomValue = NumberValue
		CreatureLurks = 1
	AddCustomValue = NumberValue
		CreatureLurkHeight = 250
	AddCustomValue = StringValue
		CreatureFlyAttack = Dive
	AddCustomValue = NumberValue
