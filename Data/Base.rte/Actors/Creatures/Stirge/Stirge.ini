// Stirge (Bestiary III, the fliers). A blood-drinking bat-mosquito the size of a hand (drawn by Tools/make_bestiary.py), in swarms of
// eight (SpawnGroup: one placed in the sandbox is the swarm). They hang from ceilings in wait (CreatureLurks), dive to bite
// (CreatureBehaviors.FlyHunt), and the bite drains: a slow venom (Shared/Venom.lua) that bleeds health for five seconds. Hurt, they
// scatter. Little and quick, each one is a few health.


AddEffect = MOPixel
	CopyOf = Particle Spider Venom Bite
	PresetName = Particle Stirge Bite
	WoundDamageMultiplier = 0.8
	AddCustomValue = NumberValue
		VenomDamage = 2
	AddCustomValue = NumberValue
		VenomSeconds = 5
	AddCustomValue = NumberValue
		VenomSlow = 1


AddAmmo = Round
	PresetName = Round Stirge Bite
	ParticleCount = 1
	Particle = MOPixel
		CopyOf = Particle Stirge Bite
	Shell = None
	FireVelocity = 26
	Separation = 2


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Stirge Proboscis
	Description = "A stirge's proboscis. It comes with the stirge."
	SharpLength = 12
	Magazine = Magazine
		CopyOf = Magazine Hound Jaws
		PresetName = Magazine Stirge Proboscis
		RegularRound = Round
			CopyOf = Round Stirge Bite
	RateOfFire = 150
	MuzzleOffset = Vector
		X = 2
		Y = 0


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Stirge Head
	MountedDevice = HDFirearm
		CopyOf = Stirge Proboscis
		ParentOffset = Vector
			X = 0
			Y = 0


AddActor = ACrab
	PresetName = Stirge
	Description = "A blood-drinking thing the size of a hand, half bat and half mosquito. They come in swarms of eight, hang from ceilings in wait, dive to bite, and the bite drains. Hurt, they scatter."
	AddToGroup = Actors - Creatures
	GoldValue = 12
	Buyable = 1
	Mass = 2
	HitsMOs = 1
	GetsHitByMOs = 1
	IgnoresTeamHits = 0
	ScriptPath = Base.rte/AI/CrabAI.lua
	SpriteFile = ContentFile
		FilePath = Base.rte/Actors/Creatures/Stirge/StirgeBodyA.png
	FrameCount = 3
	SpriteAnimMode = 0
	SpriteOffset = Vector
		X = -7
		Y = -5
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Flesh
		Resolution = 2
		Depth = 0
	DeepCheck = 0
	BodyHitSound = SoundContainer
