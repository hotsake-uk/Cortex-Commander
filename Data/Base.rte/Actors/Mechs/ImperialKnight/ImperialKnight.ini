///////////////////////////////////////////////////////////////////////
// Imperial Knight (MK-1): the first mech, a walking war machine about 180 pixels tall. Its pilot is part of it. It walks on two legs of
// thigh, shin and foot (MechLeg), carries a battle cannon and a heavy stubber, and a chainsword on its far arm. Its weapons are mech-only
// (MechOnly): nothing else can pick them up, and it uses nothing else.
// The pictures are cut from Liam's sprite sheet by Tools/MakeKnightSprites.py, which prints the joints the offsets here come from
// (half-scale pixels). The chainsword's picture is a stand-in until its art arrives.


///////////////////////////////////////////////////////////////////////
