// Fell Legion voice: what the Legion's knights, cultists, marauders and sorcerers say over their heads, and the lines the Legion's spells
// and pots put in anyone's mouth.
//
// First the new triggers, in the default set (said by any unit a Legion spell touches, whatever its faction): the casters' lines as each
// dark spell goes off (FellCast.lua), "Doomed" on a unit the Doom is laid on (DoomMark.lua), "Chained" on one the chains catch
// (Chains.lua), the Plaguebearer's throws (Pot.lua's ThrowSpeech), and the second book's (Hexed, Cursed, Afraid, Drained, Frenzied,
// Harvested, and a Ghoul's GhoulRise). Then "Set = FellLegion", which every Legion unit has, for the
// triggers the Legion speaks of its own; for any other it says the default lines (Base.rte/Speech.ini). Tones as in Base.rte: Serious
// (a knight sworn to the Dread Lord), Casual (a marauder), Funny (gallows humour). The UnitName list replaces the default names.


