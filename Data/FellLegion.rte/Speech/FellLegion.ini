	Line = Go find 'em.
	Line = Catch this one.
	Line = Here it comes, hunting.
	Line = Bolt's away.
	Tone = Funny
	Line = No peeking, it finds you anyway.
	Line = Fetch!
	Line = Say hello to the dark.

