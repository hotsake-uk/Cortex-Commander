///////////////////////////////////////////////////////////////////////
// Hellhound
//
// The Legion's hound: Base.rte's Hound rig (Actors/Creatures/Hound/Hound.ini) in charcoal black with ember eyes, hunting in packs as the
// Hound does (CrabAI.lua, CreatureBehaviors.lua: CreatureBiteReach, CreaturePounceRange, CreaturePackRange). Fire doesn't catch on it,
// the ground and anyone not of its side close to it catch fire (FireAuraRadius), and it is routed through lava. The Legion buys them in
// pairs (Loadouts.ini, Hunting Pack); they are also a creature of their own in the sandbox's Creatures list. Sprites by
// Tools/FellLegion/sprites.py (make_hellhound).


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Hellhound Jaws
	Description = "A hellhound's teeth, hot as coals. They come with the hound."


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Hellhound Head
	MountedDevice = HDFirearm
		CopyOf = Hellhound Jaws


AddEffect = Leg
	CopyOf = Hound Leg Hind FG
	PresetName = Hellhound Leg Hind FG
	SpriteFile = ContentFile
		FilePath = FellLegion.rte/Actors/Hellhound/HellhoundLegHindFGA.png


AddEffect = Leg
	CopyOf = Hound Leg Hind BG
	PresetName = Hellhound Leg Hind BG
	SpriteFile = ContentFile
		FilePath = FellLegion.rte/Actors/Hellhound/HellhoundLegHindBGA.png


AddEffect = Leg
	CopyOf = Hound Leg Front FG
	PresetName = Hellhound Leg Front FG
	SpriteFile = ContentFile
		FilePath = FellLegion.rte/Actors/Hellhound/HellhoundLegFrontFGA.png


AddEffect = Leg
	CopyOf = Hound Leg Front BG
	PresetName = Hellhound Leg Front BG
	SpriteFile = ContentFile
		FilePath = FellLegion.rte/Actors/Hellhound/HellhoundLegFrontBGA.png


AddActor = ACrab
	CopyOf = Hound
	PresetName = Hellhound
	Description = "A hound out of the pit: charcoal black with embers for eyes, hot enough that the grass catches where it stands. Hellhounds run in packs, leap at whatever they catch and bite until it stops moving. Fire doesn't touch them."
	AddToGroup = Actors - Creatures
	AddToGroup = Unholy
	GoldValue = 75
	Buyable = 1
	Mass = 42
	SpriteFile = ContentFile
		FilePath = FellLegion.rte/Actors/Hellhound/HellhoundBodyA.png
	// Its elements: fire doesn't catch on it and it is routed through lava; what is within 16 px of it catches fire.
	FireProof = 1
	FireAuraRadius = 16
	// How it hunts (CreatureBehaviors.lua): bites within 26 px, leaps at prey within 140 px, joins a packmate's hunt within 450 px.
	AddCustomValue = NumberValue
		CreatureBiteReach = 26
	AddCustomValue = NumberValue
		CreaturePounceRange = 140
	AddCustomValue = NumberValue
		CreaturePackRange = 450
	LegJumpHeight = 38
	LegJumpSpeed = 7.2
	// It glows like a coal.
	LightColor = Color
		R = 255
		G = 110
		B = 40
	LightRadius = 50
	LightIntensity = 0.7
	LightFlicker = 0.4
	VisualEmission = Embers
	VisualEmissionRate = 6
	VisualEmissionSpread = 0.6
	Turret = Turret
		CopyOf = Hellhound Head
		ParentOffset = Vector
			X = 10
			Y = -5
	MaxHealth = 110
	Health = 110
	LFGLeg = Leg
		CopyOf = Hellhound Leg Hind FG
		ParentOffset = Vector
			X = -7
			Y = 2
	LBGLeg = Leg
		CopyOf = Hellhound Leg Hind BG
		ParentOffset = Vector
			X = -6
			Y = 2
	RFGLeg = Leg
		CopyOf = Hellhound Leg Front FG
		ParentOffset = Vector
			X = 7
			Y = 2
	RBGLeg = Leg
		CopyOf = Hellhound Leg Front BG
		ParentOffset = Vector
			X = 6
			Y = 2
