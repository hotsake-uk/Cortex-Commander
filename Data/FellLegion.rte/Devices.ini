///////////////////////////////////////////////////////////////////////
// Cursed Greatsword


AddDevice = HDFirearm
	CopyOf = Greatsword
	PresetName = Cursed Greatsword
	Buyable = 1
	AddToGroup = Weapons
	AddToGroup = Weapons - Melee
	AddToGroup = Weapons - Primary
	Description = A zweihander of black iron with runes of green fire down the blade. It sweeps a huge arc and goes through whatever is in it, limbs included, and every blow that lands gives its wielder back a little of the blood it spills.
	GoldValue = 60
	ScriptPath = FellLegion.rte/Devices/CursedGreatsword/CursedBlade.lua
	AddCustomValue = NumberValue
		LifeSteal = 6
	SpriteFile = ContentFile
