///////////////////////////////////////////////////////////////////////
// Fell Legion Devices
//
// The Legion's steel: the Medieval weapons' presets (Medieval.rte/Devices.ini and Devices/Arsenal/Arsenal.ini, which load first) in black
// iron, with their own sprites (Tools/FellLegion/sprites.py), and a few of the Legion's own. The blades are engine melee weapons as the
// Medieval ones are (BladeStart/BladeEnd, MeleeSwingArc), the javelin and knives ThrownDevices, the arrows sharp MOSParticles.
//   Black Blade         The Legion's arming sword, a little sharper than the kingdom's.
//   Wicked Dagger       A curved black dagger, quick.
//   Cursed Greatsword   A zweihander that gives its wielder back a little of the blood it spills (CursedBlade.lua).
//   Executioner's Axe   A headsman's crescent axe: a huge slow sweep that severs and knocks down.
//   Barbed Flail        A one-handed spiked ball on a chain: blunt, and it knocks men flat.
//   Dark Longbow        A black bow; its black arrows are heavier and bite deeper.
//   Spiked Shield       A black kite shield with a green cross.
//   Bone Javelin        A javelin of sharpened bone, lighter and sharper than ash.
//   Cursed Throwing Knife


///////////////////////////////////////////////////////////////////////
// Black Blade


AddDevice = HDFirearm
	CopyOf = Medieval Blade
	PresetName = Black Blade
	Buyable = 1
	AddToGroup = Weapons
	AddToGroup = Weapons - Melee
	AddToGroup = Weapons - Primary
	Description = The Legion's arming sword: black iron with an edge of green steel, a little sharper than the kingdom's. Hold fire to keep swinging; one-handed, so it pairs with a shield.
	GoldValue = 28
	SpriteFile = ContentFile
		FilePath = FellLegion.rte/Devices/BlackBlade/BlackBlade.png
	BladeSharpness = 10


