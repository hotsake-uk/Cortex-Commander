///////////////////////////////////////////////////////////////////////
// Fell Legion Shaders
//
// The dark spells' mod shaders (Documentation/LightingAndEffects.md, "Mod shaders"). Turned off with "Mod shaders" in the settings, and
// faded by the player's mod shader strength; a shader that fails to compile is left unused and the spells work the same without it.
// The status effects' shaders (Tools/FellLegion/shaders.py writes them from Medieval.rte's Frozen.frag; a StatusEffect's Shader names one,
// Devices/Spells/FellEffects.lua): Fell Hexed (a unit under a Hex), Fell Cursed (under a Curse of Weakness), Fell Frenzied (under Unholy
// Frenzy), Fell Burning (burning with hellfire). Fell Darkness is the screen while a Darkness holds (Devices/Spells/Darkness.lua).


AddShader = Shader
	PresetName = Fell Hexed
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = FellLegion.rte/Shaders/Hexed.frag


AddShader = Shader
	PresetName = Fell Cursed
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = FellLegion.rte/Shaders/Cursed.frag


AddShader = Shader
	PresetName = Fell Frenzied
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = FellLegion.rte/Shaders/Frenzied.frag


AddShader = Shader
	PresetName = Fell Burning
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = FellLegion.rte/Shaders/Burning.frag


AddShader = Shader
	PresetName = Fell Darkness
	VertexShader = Base.rte/Shaders/Lighting/Fullscreen.vert
	FragmentShader = FellLegion.rte/Shaders/Darkness.frag
