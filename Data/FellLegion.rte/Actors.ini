///////////////////////////////////////////////////////////////////////
// Fell Legion Actors
//
// Written by Tools/FellLegion/actors.py with Tools/Medieval/actors.py's writer: each unit's head, limbs and body share the Ronin soldier's
// frame and joints, with the Legion's own sprites and armour, and the Medieval leap (Medieval.rte/Actors.ini) instead of a jetpack.
// Every unit is in the "Unholy" group.

///////////////////////////////////////////////////////////////////////
// DreadLord parts


AddEffect = Attachable
	PresetName = FellLegion DreadLord Head
	Mass = 5
	HitsMOs = 1
	GetsHitByMOs = 1
	ScriptPath = Base.rte/Scripts/Shared/RandomFrame.lua
	SpriteFile = ContentFile
		FilePath = FellLegion.rte/Actors/DreadLord/Head.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -7
		Y = -8
	AngularVel = 6
	EntryWound = AEmitter
		CopyOf = Wound Flesh Entry Deadly
		PresetName = FellLegion DreadLord Wound Entry Head
		BurstSound = SoundContainer
			CopyOf = Flesh Head Impact Armored
	ExitWound = AEmitter
		CopyOf = Wound Flesh Exit Deadly
	AtomGroup = AtomGroup
		AutoGenerate = 1
		Material = Material
			CopyOf = Military Stuff
		Resolution = 4
		Depth = 1
	DeepCheck = 0
	JointStrength = 200
	JointStiffness = 0.1
	BreakWound = AEmitter
		CopyOf = Wound Flesh Body
	ParentBreakWound = AEmitter
		CopyOf = Wound Flesh Body
	JointOffset = Vector
		X = -2
		Y = 5
	GibImpulseLimit = 480
	GibWoundLimit = 10
	GibSound = SoundContainer
		CopyOf = Flesh Head Gib
	AddGib = Gib
		GibParticle = MOPixel
			CopyOf = Drop Blood
		Count = 60
		Spread = 2.25
		MaxVelocity = 10
		MinVelocity = 1
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Flesh Small A
		Count = 2
		Spread = 2.25
		MaxVelocity = 10
		MinVelocity = 1
	AddGib = Gib
		GibParticle = MOSRotating
			CopyOf = Gib Bone Small D
		Count = 2
		Spread = 2.25
		MaxVelocity = 10
		MinVelocity = 1
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Gib Metal Grey Tiny A
		Count = 3
		Spread = 2.25
		MaxVelocity = 10
		MinVelocity = 1


