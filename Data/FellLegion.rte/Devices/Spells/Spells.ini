///////////////////////////////////////////////////////////////////////
// The twelve dark spells of the Legion's second wave: the curses, the drains, the dark gifts and the Darkness. The status effects they put
// on a unit are FellEffects.lua's (Hexed, Cursed, Frenzied, Burning, Afraid, Harvesting), drawn by Shaders/Shaders.ini's shaders.
//   Hex Bolt           A violet bolt that hexes the unit it strikes: their blows do little more than half, eight seconds.   25 energy.
//   Curse of Weakness  A curse on every enemy within a few paces of the point under the aim: half again the damage, slower. 45 energy.
//   Fear               Every enemy near the caster runs from him for four seconds, too shaken to hit anything properly.    40 energy.
//   Life Drain         Held: a tether to the enemy under the aim that takes their life a little at a time into the caster. 15 energy a second.
//   Soul Harvest       For ten seconds the soul of every enemy that dies near the caster feeds him health and energy.       40 energy.
//   Blood Pact         The caster spends twenty-five health for sixty energy.                                               0 energy.
//   Unholy Frenzy      A friend (or the caster): half again as fast and as hard-hitting, the worse for every blow, ten seconds. 35 energy.
//   Dark Shield        A friend (or the caster): a dark bubble that turns bullets and shrapnel, six seconds.                 40 energy.
//   Shadow Step        The caster vanishes in black smoke and is at once up to eight paces along the aim.                   25 energy.
//   Shroud             The caster cloaks for six seconds: unseen by the enemy's AI, faint to look at.                        30 energy.
//   Darkness           Night falls on the field for eight seconds; the enemy's eyes are dulled.                              60 energy.
//   Raise Ghoul        A Ghoul claws up out of the ground on the caster's side, for forty seconds (three at most).           60 energy.


AddEffect = MOPixel
	CopyOf = Fell Spell Controller
	PresetName = Fell Spell Curse Field
	LifeTime = 1500
	ScriptPath = FellLegion.rte/Devices/Spells/CurseField.lua


