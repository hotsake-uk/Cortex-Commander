///////////////////////////////////////////////////////////////////////
// Fell Legion Spells
//
// Six dark spells for the Legion's casters, built as the Medieval ones are (Medieval.rte/Devices/Spells/Spells.ini, which loads first):
// each an HDFirearm copied from "Spell Base", seen only where it lies dropped (a black book or scroll, Tools/FellLegion/sprites.py), cast
// with the caster's empty hands (CastStanceOffset), an endless null magazine and an EnergyCost a round, in "Spells" and "Spells - Attack"
// and in "Weapons - Primary" or "Weapons - Secondary", so the AI casts them like guns. Every round's FireVelocity and LifeTime is the
// spell's real reach, so the AI only casts at what it can reach; the spells cast on the spot fire the Medieval invisible range mark.
//
// FellCast.lua runs on every spell: the cast line (Speech/FellLegion.ini), the flash at the hand, and for Hellfire Rain, Doom and Chains of
// the Damned the effect itself. The projectiles and the invisible controllers that carry an effect on have a script each, sharing
// Medieval.rte/Devices/Spells/SpellFX.lua. Sounds are Tools/FellLegion/sounds.py's and the Medieval spells'.
//
// The spells:
//   Shadow Bolt           A dark orb that hunts the nearest enemy down, and drains a little of their life back to the caster.  22 energy.
//   Bone Spear            A spear of sharpened bone, fast and flat, that goes deep and pins.                                   20 energy.
//   Hellfire Rain         A sigil under the aim; green fire falls out of the sky on it for three seconds, bursting where it lands. 70 energy.
//   Shadowflame           A held cone of black fire from both hands, a short reach, that burns whoever stands in it.          22 energy a second.
//   Doom                  A mark on the enemy under the aim: three heartbeats later it bursts, hardest on whoever bears it.   55 energy.
//   Chains of the Damned  Chains out of the ground in front that bind the enemies there still for a few seconds.             40 energy.


