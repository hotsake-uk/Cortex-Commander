///////////////////////////////////////////////////////////////////////
// Fell Legion Arsenal
//
// The Plaguebearer's pots: the Medieval Arsenal's clay pots (Medieval.rte/Devices/Arsenal/Arsenal.ini, Pot.lua: they break on what they
// hit, and their gibs are what was inside) with the Legion's own brews and sprites (Tools/FellLegion/sprites.py).
//   Plague Pot    A stinkpot brewed darker: it bursts into a choking purple miasma that poisons whoever breathes it (PlagueCloud.lua).
//   Hellfire Pot  A firepot of green hellfire that burns hotter and a little wider.


///////////////////////////////////////////////////////////////////////
// Plague Pot


// The miasma: the stinkpot's cloud, and a poison on whoever stands in it (PlagueCloud.lua, run by an invisible gib).
AddEffect = MOSParticle
	CopyOf = Arsenal Script Carrier
	PresetName = Fell Plague Miasma
	LifeTime = 7000
	ScriptPath = FellLegion.rte/Devices/Arsenal/PlagueCloud.lua


AddDevice = TDExplosive
	CopyOf = Stinkpot
	PresetName = Plague Pot
	Buyable = 1
	AddToGroup = Bombs
	AddToGroup = Bombs - Grenades
	Description = A stinkpot brewed darker: grave-dirt, rotten blood and worse, a month in the dark. It breaks on what it hits into a choking purple miasma that hides whoever stands in it and poisons them while they do, for a while after too.
	Mass = 1.1
	GoldValue = 14
	AddCustomValue = StringValue
		ThrowSpeech = PlaguePot
	SpriteFile = ContentFile
		FilePath = FellLegion.rte/Devices/Arsenal/PlaguePot.png
	SpriteOffset = Vector
		X = -4
		Y = -5
	ScreenEffect = ContentFile
		FilePath = FellLegion.rte/Devices/Spells/GlowShadowSmall.png
	PostEffectEnabled = 1
	EffectStartStrength = 0.4
	EffectStopStrength = 0.4
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Fell Plague Miasma
		Count = 1
		MinVelocity = 0
		MaxVelocity = 0
		InheritsVel = 0


///////////////////////////////////////////////////////////////////////
// Hellfire Pot


AddDevice = TDExplosive
	CopyOf = Firepot
	PresetName = Hellfire Pot
	Buyable = 1
	AddToGroup = Bombs
	AddToGroup = Bombs - Grenades
	Description = A clay pot of hellfire: greek fire brewed with something that burns green. It breaks on whatever it hits and splashes burning oil all round that clings, spreads and won't go out for water, wider than the kingdom's.
	Mass = 1.2
	GoldValue = 14
	AddCustomValue = StringValue
		ThrowSpeech = HellfirePot
	SpriteFile = ContentFile
		FilePath = FellLegion.rte/Devices/Arsenal/HellfirePot.png
	LightColor = Color
		R = 110
		G = 255
		B = 110
	ScreenEffect = ContentFile
		FilePath = FellLegion.rte/Devices/Spells/GlowHellfireSmall.png
	PostEffectEnabled = 1
	EffectStartStrength = 0.7
	EffectStopStrength = 0.7
	AddGib = Gib
		GibParticle = MOPixel
			CopyOf = Napalm Fuel
		Count = 25
		Spread = 3.14
		MinVelocity = 4
		MaxVelocity = 16
		InheritsVel = 0.3
	AddGib = Gib
		GibParticle = MOSParticle
			CopyOf = Flame Hurt Short
		Count = 4
		Spread = 3.14
		MinVelocity = 3
		MaxVelocity = 10
		InheritsVel = 0
