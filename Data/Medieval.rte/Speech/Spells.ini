// Spell speech: what casters say as they cast the Medieval spells (Devices/Spells/Spells.ini), and what the units caught by them say.
//
// The spells' scripts fire these (actor:Say("Key")): SpellCast.lua the cast lines on the caster as each spell goes off (Dragon's Breath
// once as the flame starts), FrostChill.lua "Chilled" on a unit Frost Shards freezes, TimeWarpField.lua "Slowed" on the enemies caught in
// a Time Warp, Tornado.lua "Lifted" on those a tornado catches (and Telekinetic Grab's and Levitate's), and RaiseDeadPortal.lua
// "SkeletonRise" on a freshly raised Skeleton and "Crumble" on one about to fall to dust. The support spells: "CastHoly" (Heal, Mass Heal,
// Blessing, Shield of Faith, Dispel), "CastBuff" (Haste, Stoneskin, Fire Ward, Regeneration, Enchant Weapon, Levitate, Light), "CastBlink"
// (Blink, Mirror Image) on the caster, and on the friend helped "Blessed" (a buff or a shield) and "Hasted" (Haste); "Healed" is Base.rte's. The engine applies the chance and the cooldowns, so a spell cast again and again isn't
// announced every time. All in the settings' "Spells" group (Game & HUD: Unit speech).
// These are the default set's lines, said by any unit (a Medieval unit's own set has none for them, so it says these); Undead.ini adds the
// Skeletons' own. Tones as in Base.rte: Serious, Casual, Funny, and Imperial (Base.rte/Speech/Imperial.ini's mod tone, here a legion of
// battle-mages sworn to the Emperor and the realm).


