// Medieval arms: what units say about the arsenal's thrown weapons and great weapons (Devices/Arsenal). The scripts there fire them with
// actor:Say("Key"); they're new triggers, listed in the settings (Game & HUD: Unit speech) under "Medieval arms".
// The lines are in the default set, so Medieval units (SpeechSet = Medieval) and anyone else holding these weapons say them.
// Tones as in Base.rte: Serious, Casual, Funny, and Imperial (Base.rte/Speech/Imperial.ini's mod tone).
//   HolyGrenade   the thrower pulls the Holy Pin (HolyHandGrenade.lua)
//   Firepot       the thrower lets a firepot fly (Pot.lua, StringValue ThrowSpeech)
//   Entangled     bolas wrap round this unit's legs (Bolas.lua)
//   Caltrops      this unit treads on a caltrop (Caltrop.lua)
//   KnockedDown   a warhammer, mace, throwing hammer or other heavy blow knocks this unit down (HeavyWeapon.lua)
//   BigSwing      the wielder of a warhammer or greatsword winds up a swing, now and then (HeavyWeapon.lua)

Trigger = HolyGrenade
	Name = Holy Hand Grenade
	Description = A unit pulls the pin on a Holy Hand Grenade and counts.
	Group = Medieval arms
	Cooldown = 4000
	TeamCooldown = 1000
	Urgent = 1
	Tone = Serious
	Line = One! Two! Three! Throwing!
	Line = The count is three. Three it is!
	Line = Pin drawn! Counting to three!
	Line = Holy ordnance away on three!
	Line = One, two... three. In the name of the Lord!
	Line = By the Book: three, and loose!
	Line = Blessed be this grenade. Clear the line!
	Tone = Casual
	Line = One, two, five! Er, three, sir! Three!
	Line = Right, how many was it? Three!
	Line = Count with me, lads: one, two, THREE!
	Line = Pin's out! Everybody duck!
	Line = Here comes the holy one!
	Line = Three shall be the number of the counting!
	Line = Pin's out, so I'm counting. Don't talk to me.
	Tone = Funny
	Line = Five is right out!
	Line = Four shalt thou not count, neither count thou two, excepting that thou then proceed to three!
	Line = O Lord, bless this thy hand grenade!
	Line = One... two... FIVE! Three, sir! THREE!
	Line = And the people did feast upon the lambs and sloths!
	Line = Armaments, chapter two, verses nine to twenty-one!
	Line = Who's got the Book? How many was it?
	Line = Skip a bit, brother!
	Tone = Imperial
	Line = Sacred munition armed! Count of three!
	Line = By the Emperor's blessing, one, two, three!
	Line = Blessed ordnance away! Per the Book, three!
	Line = The Chaplain said three. Three it is!
	Line = Holy pin withdrawn! Clear the sector!
	Line = For the Emperor and the Book of Armaments!
	Line = Count of three, trooper, and not one more!

Trigger = Firepot
	Name = Throws a firepot
	Description = A unit hurls a pot of greek fire.
	Group = Medieval arms
	Cooldown = 8000
	TeamCooldown = 2000
	Tone = Serious
	Line = Fire away!
	Line = Greek fire, incoming!
	Line = Burn them out!
	Line = Firepot loosed!
	Line = Fire on their line!
	Line = Mind the thatch! Fire away!
	Tone = Casual
	Line = Catch!
	Line = Warm yourselves on that!
	Line = Pot's away, stand back!
	Line = Smoke 'em out!
	Line = Hot pot coming over!
	Line = Hope you brought water!
	Tone = Funny
	Line = Mind, it's hot!
	Line = Who ordered the flambe?
	Line = Supper is served, and it's on fire!
	Line = Water won't help you, friend!
	Line = I'd duck. Or burn. Your choice.
	Line = Careful, it's an heirloom! Was.
	Tone = Imperial
	Line = Incendiary deployed!
	Line = Purge them with fire!
	Line = Burn the rebel nest!
	Line = Fire for the Emperor!
	Line = Incendiary away, clear the blast!
	Line = Let the flames cleanse them!

Trigger = Entangled
	Name = Caught by bolas
	Description = Bolas wrap round a unit's legs and bring it down.
	Group = Medieval arms
	Cooldown = 6000
	TeamCooldown = 1500
	Urgent = 1
	Tone = Serious
	Line = I'm bound! Cut me loose!
	Line = Legs tangled, I'm down!
	Line = Caught! Cover me!
	Line = Bolas! I can't stand!
	Line = I'm snared! Hold the line!
	Line = Tied fast, I need a blade!
	Tone = Casual
	Line = Oi! My legs!
	Line = Who tied my boots together?
	Line = I'm all knotted up!
	Line = Get these ropes off me!
	Line = Can't move, can't move!
	Line = Ow, my shins!
	Tone = Funny
	Line = Not the trussed-up-turkey look!
	Line = I've been gift-wrapped!
	Line = This isn't how I wanted to be tied down.
	Line = Somebody fetch the Boy Scouts!
	Line = I'll just lie here, then.
	Line = Is this a hug? It's a terrible hug.
	Tone = Imperial
	Line = Trooper immobilised!
	Line = I'm restrained! Assist!
	Line = Rebel snare! I'm down!
	Line = Mobility lost, send support!
	Line = Primitive weapon, effective, though!
	Line = Can't move, I'm a sitting target!

