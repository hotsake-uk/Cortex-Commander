	Line = Foot's pierced, I'm hit!
	Line = Mind the ground!
	Tone = Casual
	Line = Ow! Ow! Ow!
	Line = Right through the boot!
	Line = Who left these lying about?
	Line = My foot! My bloody foot!
	Line = Spikes, everywhere!
	Line = That's going to fester.
	Tone = Funny
	Line = Worse than treading on a child's toy!
	Line = Ow! I'm hopping, I'm hopping!
	Line = Who put the hedgehog here?
	Line = Stepped on a Lego! ...A what?
