// Undead voice: what summoned Skeletons say. Hollow, creepy and darkly funny.
//
// Skeletons have "SpeechSet = Undead": they say these lines, and the default ones (Base.rte/Speech.ini) for any trigger this set
// has none for. Only Lines are added here; trigger settings are Base.rte's, and SkeletonRise / Crumble are defined in Spells.ini.
// Tones: Serious, Casual, Funny, Imperial (here: the Emperor's eternal legion, raised to serve past death).

