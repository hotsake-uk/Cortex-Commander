Trigger = EnemySpotted
	Tone = Serious
	Line = The living. Ahead.
	Line = Warm blood. There.
	Line = A heartbeat. Kill it.
	Line = Flesh sighted.
	Line = The quick. Approaching.
	Tone = Casual
	Line = Ooh, a living one.
	Line = Fresh meat. Literally.
	Line = I smell breath.
	Line = Look, it's got skin.
	Line = One of the squishy ones.
	Tone = Funny
	Line = Brains... no, wait, we have none.
	Line = Oh look. Somebody with organs.
	Line = Show-off. Has a liver.
	Line = Hello! Want to join us? Ha.
	Line = He's got so much meat on him!
	Tone = Imperial
	Line = The living defy the Emperor.
	Line = Rebels of flesh. End them.
	Line = Eternal legion: foe ahead.
	Line = The Emperor's dead see you.
	Line = Heretic. Join the legion.

