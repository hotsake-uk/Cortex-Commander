// Medieval voice: what the Medieval faction's knights, archers, footmen and mages say over their heads.
//
// Every Medieval unit has "SpeechSet = Medieval", so it says the lines below, and the default lines (Base.rte/Speech.ini) for any
// trigger this set has none for. The triggers and their settings (Cooldown, Chance...) are Base.rte's; this file only adds Lines.
// Tones as in Base.rte: Serious (a disciplined man-at-arms), Casual (a plain soldier), Funny (jests, and guns as sorcery) and
// Imperial (Base.rte/Speech/Imperial.ini's mod tone, here a legion sworn to the Emperor and the realm).
// "{self}" is the speaker's name, "{name}" the fallen or burning friend's (only in ManDown, FriendOnFire, FriendBody, AllAlone).
// The UnitName list replaces the default names for this set: knights, yeomen, monks and village worthies.

