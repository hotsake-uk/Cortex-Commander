///////////////////////////////////////////////////////////////////////
// Medieval Shaders
//
// The spells' mod shaders (Documentation/LightingAndEffects.md, "Mod shaders"). Turned off with "Mod shaders" in the settings, and faded
// by the player's mod shader strength; a shader that fails to compile is left unused and the spells work the same without it.
// - Medieval Frozen: a unit chilled by Frost Shards (set on it by Devices/Spells/FrostChill.lua, which puts its own shader back after).
// - Medieval Spectral: a Skeleton raised by Raise Dead (Devices/Spells/RaiseDeadPortal.lua).
// - Medieval Time Warp: the screen while a Time Warp holds (Devices/Spells/TimeWarpField.lua, which puts the scene's own pass back after).
// - Medieval Blizzard: the screen while a Blizzard rages (Devices/Spells/Blizzard.lua, the same way).
// The status effects' shaders (Tools/Medieval/shaders.py writes them from Frozen.frag; a StatusEffect's Shader names one, and the engine puts
// the unit's own shader back when the effect ends, Devices/Spells/SpellEffects.lua):
// - Medieval Blessed: a unit under a Blessing.      - Medieval Hasted: a unit under Haste.         - Medieval Stoneskin: a unit under Stoneskin.
// - Medieval Warded: a unit under a Fire Ward.      - Medieval Illusion: a Mirror Image.           - Medieval Petrified: a unit turned to stone.


AddShader = Shader
	PresetName = Medieval Frozen
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Medieval.rte/Shaders/Frozen.frag


AddShader = Shader
	PresetName = Medieval Spectral
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Medieval.rte/Shaders/Spectral.frag


AddShader = Shader
	PresetName = Medieval Time Warp
	VertexShader = Base.rte/Shaders/Lighting/Fullscreen.vert
	FragmentShader = Medieval.rte/Shaders/TimeWarp.frag


AddShader = Shader
	PresetName = Medieval Blessed
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Medieval.rte/Shaders/Blessed.frag


AddShader = Shader
	PresetName = Medieval Hasted
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Medieval.rte/Shaders/Hasted.frag


AddShader = Shader
	PresetName = Medieval Stoneskin
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Medieval.rte/Shaders/Stoneskin.frag


AddShader = Shader
	PresetName = Medieval Warded
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Medieval.rte/Shaders/Warded.frag


AddShader = Shader
	PresetName = Medieval Illusion
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Medieval.rte/Shaders/Illusion.frag


AddShader = Shader
	PresetName = Medieval Petrified
	VertexShader = Base.rte/Shaders/Blit8.vert
	FragmentShader = Medieval.rte/Shaders/Petrified.frag


AddShader = Shader
	PresetName = Medieval Blizzard
	VertexShader = Base.rte/Shaders/Lighting/Fullscreen.vert
	FragmentShader = Medieval.rte/Shaders/Blizzard.frag
