///////////////////////////////////////////////////////////////////////
// Medieval Devices
//
// The swords, axe and spear are engine melee weapons: BladeStart and BladeEnd mark the edge, and MeleeSwingArc swings
// it on fire. They are HDFirearms with an endless null magazine so the AI equips them and attacks with them up close
// (it treats "Weapons - Melee" that way). Arrows and bolts are sharp MOSParticles drawn at the angle they fly.


///////////////////////////////////////////////////////////////////////
// Shared


AddEffect = MOSParticle
	PresetName = Medieval Splinter
	Mass = 0.05
	LifeTime = 1500
	HitsMOs = 0
	GetsHitByMOs = 0
	SpriteFile = ContentFile
		FilePath = Medieval.rte/Devices/Longbow/Arrow000.png
	FrameCount = 1
	SpriteOffset = Vector
		X = -7
		Y = -7
	Atom = Atom
		Material = Material
			CopyOf = Wood


