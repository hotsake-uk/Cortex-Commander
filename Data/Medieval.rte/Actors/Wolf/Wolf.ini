///////////////////////////////////////////////////////////////////////
// Wolf
//
// The Kingdom's wolf: Base.rte's Hound rig (Actors/Creatures/Hound/Hound.ini) in wolf grey, a little faster and a little less tough,
// hunting in packs as the Hound does (CrabAI.lua, CreatureBehaviors.lua: CreatureBiteReach, CreaturePounceRange, CreaturePackRange).
// Summon Wolf (Devices/Spells/Spells2.ini, SummonWolf.lua) calls two of them out of the mist on the caster's side for thirty seconds;
// they are also a creature of their own in the sandbox's Creatures list. Sprites by Tools/Medieval/creatures.py.


AddDevice = HDFirearm
	CopyOf = Hound Jaws
	PresetName = Wolf Jaws
	Description = "A wolf's teeth. They come with the wolf."


AddActor = Turret
	CopyOf = Hound Head
	PresetName = Wolf Head
	MountedMO = HDFirearm
		CopyOf = Wolf Jaws


AddEffect = Leg
	CopyOf = Hound Leg Hind FG
	PresetName = Wolf Leg Hind FG
	SpriteFile = ContentFile
		FilePath = Medieval.rte/Actors/Wolf/WolfLegHindFGA.png


AddEffect = Leg
	CopyOf = Hound Leg Hind BG
	PresetName = Wolf Leg Hind BG
	SpriteFile = ContentFile
		FilePath = Medieval.rte/Actors/Wolf/WolfLegHindBGA.png


AddEffect = Leg
	CopyOf = Hound Leg Front FG
	PresetName = Wolf Leg Front FG
	SpriteFile = ContentFile
		FilePath = Medieval.rte/Actors/Wolf/WolfLegFrontFGA.png


AddEffect = Leg
	CopyOf = Hound Leg Front BG
	PresetName = Wolf Leg Front BG
	SpriteFile = ContentFile
		FilePath = Medieval.rte/Actors/Wolf/WolfLegFrontBGA.png


AddActor = ACrab
	CopyOf = Hound
	PresetName = Wolf
	Description = "A grey wolf, lean and quick, amber-eyed. Wolves run in packs, leap at whatever they catch and bite until it stops moving. Faster than a hound and a little easier to kill."
	AddToGroup = Actors - Creatures
	GoldValue = 55
	Buyable = 1
	Mass = 36
	SpriteFile = ContentFile
		FilePath = Medieval.rte/Actors/Wolf/WolfBodyA.png
	// How it hunts (CreatureBehaviors.lua): bites within 26 px, leaps at prey within 150 px, joins a packmate's hunt within 450 px.
	AddCustomValue = NumberValue
		CreatureBiteReach = 26
	AddCustomValue = NumberValue
		CreaturePounceRange = 150
	AddCustomValue = NumberValue
		CreaturePackRange = 450
	LegJumpHeight = 40
	LegJumpSpeed = 7.5
	Turret = Turret
		CopyOf = Wolf Head
		ParentOffset = Vector
			X = 10
			Y = -5
	MaxHealth = 90
	Health = 90
	LFGLeg = Leg
		CopyOf = Wolf Leg Hind FG
		ParentOffset = Vector
			X = -7
			Y = 2
	LBGLeg = Leg
		CopyOf = Wolf Leg Hind BG
		ParentOffset = Vector
			X = -6
			Y = 2
	RFGLeg = Leg
		CopyOf = Wolf Leg Front FG
		ParentOffset = Vector
			X = 7
			Y = 2
	RBGLeg = Leg
		CopyOf = Wolf Leg Front BG
		ParentOffset = Vector
			X = 6
			Y = 2
	LWalkLimbPath = LimbPath
		CopyOf = Hound Walk Path
		PresetName = Wolf Walk Path
		TravelSpeed = 5.2
	RWalkLimbPath = LimbPath
		CopyOf = Wolf Walk Path
