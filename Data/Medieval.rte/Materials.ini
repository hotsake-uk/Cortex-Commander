// Medieval Materials
// What the Medieval buildings (Scenes/Buildings) are made of besides the base game's Wood and Stone. Indices 138 to 140, free in Base.rte.


AddMaterial = Material
	Index = 138
	PresetName = Thatch
	// Bundled straw on a roof: it catches like grass and goes up fast, leaving ash; a shot or a blast knocks it loose easily.
	Burns = Grass
	BurnMinTicks = 40
	BurnMaxTicks = 90
	BurnSpread = 0.35
	LeavesAsh = 1
	Bounce = 0.05
	Friction = 1.0
	StructuralIntegrity = 12
	DensityKGPerVolumeL = 0.3
	GibImpulseLimitPerVolumeL = 20
	GibWoundLimitPerVolumeL = 0.2
	Piling = 4
	Color = Color
		R = 196
		G = 160
		B = 84


AddMaterial = Material
	Index = 139
