///////////////////////////////////////////////////////////////////////
// Support spells (SE-1)
//
// The spells cast on friends, and on the caster: heals, blessings, wards, and a few tricks. None is a weapon (not in "Weapons", so the AI
// never shoots a friend with one and the buy menu lists them under Spells only); all are in "Spells" and "Spells - Support", and the AI casts
// them by their custom values (Base.rte/AI/HumanBehaviors.lua, SupportSpellUpdate): SupportKind says what the spell is for (Heal, MassHeal,
// Buff, Shield, Dispel, Mirror), SupportEffect the status effect a Buff puts on (SpellEffects.lua), SupportRange how far it reaches.
// Every one fires an invisible range mark along the aim: SpellCast.lua finds the friend under the aim within reach (a friend behind another
// is looked past; an enemy in the way blocks nothing) and casts on them, or on the caster when there is none. So: aim at a friend to help
// them, aim at the ground to help yourself.
// Telekinetic Grab is the one attack among them, a weapon like the others.


AddSoundContainer = SoundContainer
	PresetName = Medieval Spell Holy Chime
	AttenuationStartDistance = 200
	AddSound = ContentFile
