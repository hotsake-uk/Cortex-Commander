///////////////////////////////////////////////////////////////////////
// Medieval Spells
//
// Twenty-eight spells for the Medieval faction's casters, built like Base.rte's (Devices/Magic/Magic.ini): each is an HDFirearm copied from
// "Spell Base", seen only where it lies dropped (a book, a tome, a scroll or a stone tablet, each its own colour and emblem, drawn by
// Tools/Medieval/spells.py), with the caster's empty hands taking the spell's pose while casting (CastStanceOffset), an endless null
// magazine and an EnergyCost per round. They are in "Spells" (and "Spells - Attack", "Spells - Utility" or "Spells - Push") and in
// "Weapons - Primary" or "Weapons - Secondary", so the AI casts them like guns: every round's FireVelocity and LifeTime (and gravity, for
// the lobbed orbs) is the spell's real reach, so the AI only casts at what it can reach.
//
// The scripts are all in this folder. SpellCast.lua runs on every spell: the cast line (Speech/Spells.ini), the flash at the hand, and for
// the spells cast on the spot (Call Lightning, Earth Shatter, Tornado, Time Warp, Arcane Nova, whose rounds are invisible range markers)
// the effect itself. The projectiles and the invisible controllers that carry an effect on after the cast have a script each; SpellFX.lua
// is what they share. Sounds are Tools/Medieval/spellsounds.py's; the shaders (Medieval Frozen, Medieval Spectral, Medieval Time Warp) are
// in Medieval.rte/Shaders/Shaders.ini.
//
// The spells:
//   Fireball         An orb of fire that bursts in a fiery explosion.                                       30 energy.
//   Dragon's Breath  A cone of flame from both hands, held (a short reach), setting things alight.           22 energy a second.
//   Meteor Storm     A sigil bolt; where it lands a rune circle calls five meteors down out of the sky.       80 energy.
//   Call Lightning   A bolt out of the sky onto what is under the aim.                                       35 energy.
//   Arcane Missiles  Three violet bolts that home on the nearest enemy.                                      20 energy.
//   Frost Shards     A spray of ice shards; units hit are chilled (slowed, frosted) for three seconds.        25 energy.
//   Poison Cloud     A lobbed orb that bursts in a cloud of toxic gas.                                       30 energy.
//   Gravity Well     An orb that opens a vortex, pulls everything in for three seconds, then bursts.          50 energy.
//   Earth Shatter    A wave through the ground that erupts under everything in front.                        45 energy.
//   Raise Dead       Two Skeletons claw out of the ground; they crumble after thirty seconds (four at most).  70 energy.
//   Tornado          A whirlwind that travels on for four seconds, lifting and flinging what it meets.       50 energy.
//   Time Warp        Enemies round the caster move in slow motion for five seconds.                          60 energy.
//   Arcane Nova      A burst of force all round the caster (and a push spell: the AI throws grenades back).  35 energy.
//
// The support spells (Spells.ini's second half; SE-1): cast on the friend under the aim, or on the caster when there is none, and none of
// them a weapon (so the AI never shoots a friend with one); the AI casts them by their SupportKind (Base.rte/AI/HumanBehaviors.lua,
// SupportSpellUpdate). Their effects are SpellEffects.lua's status effects, drawn on the unit with Shaders/*.frag.
//   Heal             Forty health and the worst wounds back on a friend.                                     30 energy.
//   Mass Heal        Twenty-five health and a wound on every friend near the caster.                          60 energy.
//   Blessing         A third more damage dealt, some less taken, for fifteen seconds.                         35 energy.
//   Shield of Faith  A shield powerup's bubble on a friend, six seconds.                                      40 energy.
//   Haste            Half again the pace for ten seconds.                                                     35 energy.
//   Stoneskin        Half the damage taken (a little slower) for twelve seconds.                              40 energy.
//   Fire Ward        Put out, and fire-proof for fifteen seconds.                                             30 energy.
//   Regeneration     Four health a second and a wound every two, for twelve seconds.                          35 energy.
//   Enchant Weapon   Half again the damage from everything they hit with, twelve seconds.                     35 energy.
//   Levitate         Weightless for five seconds.                                                             30 energy.
//   Mirror Image     Two harmless copies of the caster, ten seconds or until struck.                          50 energy.
//   Blink            The caster is at once eight paces along the aim, where there is room.                    25 energy.
//   Dispel           Curses off a friend, blessings off the enemies near them.                                30 energy.
//   Light            A ball of light over the caster's head for thirty seconds.                               10 energy.
//   Telekinetic Grab An enemy held fast and hauled to the caster's feet (an attack spell).                    30 energy.


