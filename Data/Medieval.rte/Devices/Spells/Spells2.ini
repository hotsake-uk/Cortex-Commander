///////////////////////////////////////////////////////////////////////
// Medieval Spells II
//
// The second batch of the Kingdom's spells: ten attacks and three tricks, built as Spells.ini's are (each an HDFirearm copied from
// "Medieval Spell Base", a book or scroll where it lies, an EnergyCost a cast, SpellCast.lua running the cast). Most are cast on the spot:
// their rounds are invisible range marks (the AI's reach), and SpellCast.lua finds what is under the aim and makes the effect, by itself or
// through a controller with a script of its own (this folder). Ice Lance alone fires a real projectile. Sunbeam and Water Jet are held,
// like Dragon's Breath. Sounds are Tools/Medieval/spellsounds.py's, the books and props Tools/Medieval/spells.py's, the Blizzard's screen
// pass Shaders/Blizzard.frag (Shaders/Shaders.ini).
//
// The attacks:
//   Chain Lightning  A bolt into the enemy under the aim that leaps on to up to four more near them.                       40 energy.
//   Ice Lance        A fast spear of ice: skewers one unit and chills them; a wall it strikes grows a crust of ice.         25 energy.
//   Blizzard         A storm over the aim point for six seconds: everything under it chilled and slowed, snow settling.    60 energy.
//   Flame Wall       A wall of fire along the ground in front for eight seconds that burns what crosses it.               40 energy.
//   Holy Smite       A pillar of light out of the sky onto the aim point; the undead take double.                          45 energy.
//   Sunbeam          A burning beam from the hands, held, that sets alight what it touches.                               2.5 energy a round.
//   Stone Spikes     Spikes of rock punch up out of the ground in a line in front, impaling and lifting.                  40 energy.
//   Thunderclap      A clap all round the caster: enemies within four paces stunned a moment and shoved.                  30 energy.
//   Petrify          The enemy under the aim turns to stone for five seconds: held fast, half the damage, silenced.        45 energy.
//   Water Jet        A jet of water from the hands, held: douses fires and burning units, shoves hard, leaves puddles.     1.5 energy a round.
// The tricks (Spells - Utility):
//   Wall of Stone    A wall of real stone rises out of the ground in front, six pixels thick and forty tall, for cover.    35 energy.
//   Bridge of Light  A glowing plank of light along the aim, up to five paces, to walk on for ten seconds.                 30 energy.
//   Summon Wolf      Two wolves (Actors/Wolf/Wolf.ini) out of the mist on your side for thirty seconds; four at most.      55 energy.


