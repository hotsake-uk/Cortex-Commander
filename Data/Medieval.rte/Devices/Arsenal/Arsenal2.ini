///////////////////////////////////////////////////////////////////////
// Medieval Arsenal II: the Kingdom's second armoury
//
// Bows: the Warbow (a heavier longbow; bodkin arrows that go through mail), the Hunting Bow (quick, broadhead arrows that bleed), the
//   Arbalest (a steel-bowed crossbow, very slow, its bolt through a shield) and Fire Arrows (a longbow strung with pitch-dipped arrows that
//   set alight what they stick in, FireArrow.lua).
// Melee (copies of Medieval Blade, Devices.ini; HeavyWeapon.lua on the heavy ones): Flamberge, Poleaxe, Flail, Falchion, Morning Star,
//   Hunting Knife, War Scythe, Quarterstaff. Shields: Tower Shield, Buckler.
// Thrown: Throwing Spear, Francisca (Weapons - Thrown, thrown at an enemy a few strides off); the Sling, a weapon that lobs stones; the Net,
//   which wraps whoever it lands on (Net.lua); the Snare Trap, set on the ground, which closes on the first enemy to tread in it (SnareTrap.lua);
//   and the Alchemist's flasks (copies of Arsenal Pot, Pot.lua): the Oil Flask (a slick of oil that burns, OilBurst.lua), the Frost Flask
//   (chills everyone near, FrostBurst.lua), the Smoke Flask (a thick cloud) and the Healing Draught (heals the friends it breaks among,
//   DraughtBurst.lua; the AI throws it at a hurt friend, HumanBehaviors.lua ThrowDraughtUpdate).
// Sprites: Tools/Medieval/arsenal.py. Sounds (Sounds/Arsenal): Tools/Medieval/arsenalsounds.py. Speech: Speech/Arsenal.ini.


