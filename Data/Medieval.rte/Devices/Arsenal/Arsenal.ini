///////////////////////////////////////////////////////////////////////
// Medieval Arsenal
//
// More for the king's armouries: pots and things to throw, and heavier steel for close work.
//
// Thrown: fire winds up the throw (hold for a harder one) and lets go; another of the same comes to hand.
//   Firepot           a clay pot of greek fire with a burning rag in its neck. It breaks on what it hits (Pot.lua) and splashes burning
//                     fuel about, sets alight whoever is close, with a flash, a small shockwave and smoke (FirepotBurst.lua).
//   Stinkpot          breaks into a choking yellow-green cloud that bubbles and lingers (StinkCloud.lua).
//   Holy Hand Grenade pull the pin (start the throw), count to three, and lob. A huge golden blast with rays of light and a choir
//                     (HolyHandGrenade.lua, HolyBlast.lua).
//   Throwing Hammer   a heavy blunt head that wheels end over end and knocks over what it hits (HeavyWeapon.lua).
//   Bolas             whirl through the air and wrap round an enemy's legs, bringing him down for a few seconds (Bolas.lua,
//                     BolasTangle.lua).
//   Caltrops          a pouch that bursts where it lands into iron spikes that lie there half a minute and bite enemies treading on
//                     them (CaltropPouch.lua, Caltrop.lua).
// The pots and caltrops are "Bombs - Grenades", so the AI lobs them like grenades (also over cover where an enemy was last seen); the
// hammer and bolas are "Weapons - Thrown", thrown at an enemy a few strides off like the javelin, and gone back for after.
//
// Melee (copies of Medieval Blade, see Devices.ini): Warhammer, Mace, Halberd, Greatsword. HeavyWeapon.lua on each adds sparks to a blow
// that lands and a chance to knock the man down; the two great weapons' wielders sometimes roar a swing.
//
// Sprites and glows: Tools/Medieval/arsenal.py. Sounds (Sounds/Arsenal): Tools/Medieval/arsenalsounds.py. Speech: Speech/Arsenal.ini.


