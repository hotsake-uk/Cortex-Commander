///////////////////////////////////////////////////////////////////////
// Medieval Spell Scrolls
//
// Powerups (Base.rte/Devices/Powerups) that give a few casts of one of the Medieval spells (Devices/Spells/Spells.ini) to any unit, caster
// or not: used from the unit menu's Quick actions, a scroll puts its spell in the unit's hand, and each pull of the trigger is a cast that
// costs no energy. Once the last is cast, the unit takes back what it held before. Placed from the Sandbox item list; not in the buy menu.
// The pictures are Tools/MakePowerupSprites.py's: the seal and ribbon in the colour of the spell's school.


AddDevice = HeldDevice
	CopyOf = Powerup Base
	PresetName = Fireball Scroll
	AddToGroup = Powerups
	AddToGroup = Spell Scrolls
	Buyable = 1
	BuyableMode = 2
	Description = A scroll of Fireball: 2 casts of the spell, by anyone, for no energy.
	GoldValue = 60
	SpriteFile = ContentFile
		FilePath = Medieval.rte/Devices/Scrolls/ScrollFire.png
	SpriteOffset = Vector
		X = -7
		Y = -3
	PowerupSpell = Fireball
	PowerupCasts = 2
	PowerupUses = 1


